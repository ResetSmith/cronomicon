# Publish the release images to the GitHub Container Registry.
#
# Runs when a vX.Y.Z tag is pushed (the last step of the release flow in
# AGENTS.md) and builds three linux/amd64 images from that tagged commit:
#
#   ghcr.io/resetsmith/cronomicon             the server (backend/Dockerfile)
#   ghcr.io/resetsmith/cronomicon-runner      slim runner (backend/Dockerfile.runner)
#   ghcr.io/resetsmith/cronomicon-runner-fat  runner + ansible/terraform (backend/Dockerfile.runner.fat)
#
# Each is tagged X.Y.Z, X.Y and latest. This is a publish step, not a gate:
# `make verify` and the frontend build + tests still run locally before the
# release merge. A tag that disagrees with the version const or the top
# CHANGELOG entry is refused before anything is built.
name: Publish images

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Re-publish an existing tag by hand: run it with the tag selected as the ref.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the version const and the top CHANGELOG entry
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::run this from a vX.Y.Z tag, not a branch ($GITHUB_REF_NAME)"; exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          const=$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\(.*\)"$/\1/p' backend/cmd/cronomicon/main.go | head -n1)
          changelog=$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | head -n1)
          echo "tag=$tag const=$const changelog=$changelog"
          [ "$tag" = "$const" ] || { echo "::error::tag v$tag != version const $const"; exit 1; }
          [ "$tag" = "$changelog" ] || { echo "::error::tag v$tag != top CHANGELOG entry $changelog"; exit 1; }

  publish:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cronomicon
            dockerfile: backend/Dockerfile
            description: Cronomicon script orchestrator (server + embedded UI)
          - image: cronomicon-runner
            dockerfile: backend/Dockerfile.runner
            description: Cronomicon runner agent (slim, SSH-onward, no local toolchains)
          - image: cronomicon-runner-fat
            dockerfile: backend/Dockerfile.runner.fat
            description: Cronomicon runner agent with ansible, terraform and git
    steps:
      - uses: actions/checkout@v7

      - name: Build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/resetsmith/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
