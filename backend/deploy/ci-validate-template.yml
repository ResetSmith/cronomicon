# Cronomicon — CI-time job-definition validation (V1.1-1, from T11; directory mode 2.4.0).
#
# Drop this into the .gitlab-ci.yml of a repository that holds Cronomicon job
# definitions. On every merge request it runs `cronomicon validate` over the
# whole checkout, as Git sync reads it: scripts/, jobs/, schedules/ and
# workflows/ with their sub-folders, and inventory/ (its top level, as sync
# reads it). Errors are line-numbered and fail the pipeline; warnings are
# printed and do not.
#
# The `cronomicon` binary ships the same parser the runtime uses, so CI and sync
# do not disagree. Use the version your Cronomicon deployment runs.
#
# ── The image ────────────────────────────────────────────────────────────────
# A CI job's `script:` runs in a shell, and the library checkout below needs
# git. The Cronomicon server image is distroless: it has NEITHER, and its binary
# is /app/cronomicon, not on the PATH. (Until 2.4.0 this template named the
# server image, and could not run in it.) Build a validation image from it once
# per Cronomicon version and push it to a registry your runners can pull from:
#
#     FROM ghcr.io/resetsmith/cronomicon:<version> AS cronomicon
#     FROM debian:bookworm-slim
#     RUN apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl \
#      && rm -rf /var/lib/apt/lists/*
#     COPY --from=cronomicon /app/cronomicon /usr/local/bin/cronomicon
#
# (bookworm, because the binary is built against the glibc of the server's
# distroless base, Debian 12: an Alpine base does not run it. curl is for the
# optional merge-request comment at the end.)
#
# ── Which repository this is ─────────────────────────────────────────────────
# A checkout cannot say whether it is Global's repository or an agency's, and
# the rules differ (2.4.0):
#
#   CRONOMICON_REPO_KIND: "global"  — the installation's own repository. A
#       script_ref, scheduleRef or reaction that names nothing here is an error.
#       A job may name any scope, or none.
#   CRONOMICON_REPO_KIND: "agency"  — an agency's repository. A job must name a
#       scope (sync refuses one that does not). A reference that names nothing
#       here may be Global's, which sync looks in too: without the library
#       below it is a WARNING, with it an error if Global's has none either.
#
# CRONOMICON_LIBRARY_URL — for an agency's repository, the HTTPS URL of
#   Global's repository. When set, it is cloned (shallow, read-only) and
#   references are looked for there, as sync looks. It implies "agency".
#   CRONOMICON_LIBRARY_REF is the branch Cronomicon syncs from (default main).
#   CRONOMICON_LIBRARY_TOKEN, a MASKED CI/CD variable, is a token that can read
#   that repository (a Project or Group Access Token with read_repository), sent
#   in a header and never in the URL; CRONOMICON_LIBRARY_USER is the user it is
#   sent as (oauth2 for an access token; gitlab-ci-token with $CI_JOB_TOKEN,
#   when Global's project allows this project's job token).
#
# ── Optional: the errors as a comment on the merge request ───────────────────
# Set GITLAB_MR_TOKEN, a MASKED CI/CD variable holding a Project or Group Access
# Token with the `api` scope (CI_JOB_TOKEN cannot post notes). When the job
# fails on a merge request, its output is posted as a note. The failed job
# already blocks the merge and shows the errors in its log: this is a
# convenience, not a second gate.

variables:
  CRONOMICON_VALIDATE_IMAGE: "registry.example.com/cronomicon-validate:2.4.0"
  CRONOMICON_REPO_KIND: "global"
  CRONOMICON_LIBRARY_URL: ""
  CRONOMICON_LIBRARY_REF: "main"
  CRONOMICON_LIBRARY_USER: "oauth2"

validate-job-definitions:
  stage: test
  image: "$CRONOMICON_VALIDATE_IMAGE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      set -eu
      case "$CRONOMICON_REPO_KIND" in
        global|agency) ;;
        *) echo "CRONOMICON_REPO_KIND must be \"global\" or \"agency\", not \"$CRONOMICON_REPO_KIND\"" >&2; exit 2 ;;
      esac
      flags=""
      if [ -n "${CRONOMICON_LIBRARY_URL:-}" ]; then
        auth=""
        if [ -n "${CRONOMICON_LIBRARY_TOKEN:-}" ]; then
          auth="Authorization: Basic $(printf '%s:%s' "$CRONOMICON_LIBRARY_USER" "$CRONOMICON_LIBRARY_TOKEN" | base64 | tr -d '\n')"
        fi
        rm -rf /tmp/cronomicon-library
        git -c "http.extraHeader=$auth" clone --quiet --depth 1 --branch "$CRONOMICON_LIBRARY_REF" \
          "$CRONOMICON_LIBRARY_URL" /tmp/cronomicon-library
        flags="-library /tmp/cronomicon-library"
      elif [ "$CRONOMICON_REPO_KIND" = "agency" ]; then
        flags="-agency"
      fi
      set +e
      # $flags is two words or none.
      cronomicon validate $flags . > .cronomicon-validate.log 2>&1
      code=$?
      cat .cronomicon-validate.log
      exit $code
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ] && [ -n "${GITLAB_MR_TOKEN:-}" ] && [ -n "${CI_MERGE_REQUEST_IID:-}" ] \
         && [ -f .cronomicon-validate.log ]; then
        note="$(printf '### Cronomicon job-definition validation failed\n\n```\n%s\n```\n' "$(cat .cronomicon-validate.log)")"
        curl -sf --request POST \
          --header "PRIVATE-TOKEN: $GITLAB_MR_TOKEN" \
          --data-urlencode "body=$note" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes" >/dev/null || true
      fi
