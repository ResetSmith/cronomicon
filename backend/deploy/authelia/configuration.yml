# Authelia configuration — EXAMPLE / STARTING POINT (tested against Authelia
# 4.38 schema). If you already run Authelia, you likely only need to (a) add the
# access-control rule for the Cronomicon host and (b) confirm group membership lands
# in the `Remote-Groups` header (the forward-auth middleware in docker-compose.yml
# already lists it in authResponseHeaders).
#
# Secrets (jwt / session / storage encryption / LDAP bind password) are supplied
# via *_FILE env vars in docker-compose.yml — never inline them here.
# Replace example.com / *.example.com throughout.

server:
  address: tcp://0.0.0.0:9091

log:
  level: info
  format: json

theme: auto

# ── Authentication backend ──────────────────────────────────────────────────
# This example uses the file backend so the stack boots standalone. In your
# environment, swap this for your existing LDAP/AD backend (architecture A3).
# The AD groups your users belong to must come through as Authelia "groups";
# those become Remote-Groups, which Cronomicon maps to roles via ad_group_mappings.
authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2
  # ldap:
  #   address: ldaps://dc.example.com
  #   base_dn: DC=example,DC=com
  #   users_filter: (&({username_attribute}={input})(objectClass=user))
  #   groups_filter: (&(member={dn})(objectClass=group))
  #   user: CN=authelia,OU=ServiceAccounts,DC=example,DC=com
  #   # password supplied via AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE

# ── Access control ────────────────────────────────────────────────────────────
# Default deny; only members of the Cronomicon access group reach the app host.
# (Cronomicon then derives operator roles from the same group membership.)
access_control:
  default_policy: deny
  rules:
    - domain: auth.example.com
      policy: bypass
    # Runner endpoints must NOT go through the browser SSO. A runner host has no
    # Authelia session; it authenticates the server with its OWN bearer
    # (amt_run_* / amt_reg_*), and the provisioning artifacts are non-secret (the
    # token in /install/<token> is itself the credential). Without this bypass,
    # `curl .../install/<token>` and the runner's poll/register get 302'd to the
    # login page — returning HTML, not the script (the classic
    # "syntax error near unexpected token `<!doctype html>'" install failure).
    # The app still enforces the runner bearer on the /api paths below, so the
    # bypass here only skips the SSO, not authentication. This rule must come
    # BEFORE the one_factor rule (first match wins).
    - domain: amadeus.example.com
      policy: bypass
      resources:
        - "^/healthz$"
        - "^/readyz$"
        - "^/version$"
        - "^/runner-install\\.sh$"
        - "^/agents/[^/]+$"
        - "^/install/[^/]+$"
        - "^/api/v1/runners/register$"
        - "^/api/v1/runners/[^/]+/poll$"
        - "^/api/v1/runners/[^/]+/redeclare$"
        - "^/api/v1/runners/[^/]+/hostkeys$"
        - "^/api/v1/runs/[^/]+/manifest$"
        - "^/api/v1/runs/[^/]+/log$"
    - domain: amadeus.example.com
      policy: one_factor
      subject:
        - "group:amadeus-users"

# ── Sessions ──────────────────────────────────────────────────────────────────
session:
  name: authelia_session
  # secret supplied via AUTHELIA_SESSION_SECRET_FILE
  cookies:
    - domain: example.com
      authelia_url: https://auth.example.com
      default_redirection_url: https://amadeus.example.com
      expiration: 12h
      inactivity: 1h

regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m

# ── Storage & notifier ──────────────────────────────────────────────────────
# Local SQLite + filesystem notifier keep the example self-contained; point these
# at your existing Authelia storage/notifier in production.
storage:
  local:
    path: /data/db.sqlite3
  # encryption_key supplied via AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE

notifier:
  filesystem:
    filename: /data/notification.txt

# Used to mint the password-reset JWT; secret supplied via
# AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE.
identity_validation:
  reset_password:
    jwt_lifespan: 5m
