    <title>Cronomicon</title>
    <!--
      Fonts are SELF-HOSTED (VU-1). The console is deployed behind a reverse proxy with SSO
      onto networks that may have no egress to fonts.googleapis.com, and a blocked
      stylesheet silently drops the whole type system to system-ui. These are
      Google's own latin / latin-ext subsets; only the origin changed.

      The families are IBM Plex (VU-Q1's hybrid): Sans for body and titles,
      Sans Condensed for column heads and eyebrows — condensed uppercase is
      structural, it buys real characters-per-pixel in History's 9-column table —
      and Mono for cron, trace IDs, timestamps and durations. Outfit and
      JetBrains Mono were retired here.

      The app declares NO Fraunces (F2-2). It never set the serif on anything —
      VU-Q1 put it on the login page and sidebar wordmark, both of which render
      as raster assets — so the two @font-face blocks here declared a face
      nothing could use. The .woff2 files STAY in public/fonts: the manuals in
      documentation/ set their hero in Fraunces and carry their own inlined
      declarations pointing at them.

      Plex Sans is a single variable file spanning 400-700; Plex Condensed and
      Plex Mono are static per weight. Unreferenced faces are never fetched, so a
      weight nothing uses costs nothing at runtime.

      Vite copies public/ verbatim into backend/web/dist, and //go:embed all:dist
      (backend/web/embed.go) is recursive, so these land in the Go binary with no
      embed change.
    -->

    <link rel="preload" href="/fonts/plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
