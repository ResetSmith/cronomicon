# Cronomicon production stack (Option B: External Proxy / Nginx Proxy Manager).
#
#   browser ──TLS──▶ Nginx Proxy Manager (existing; injects Remote-*)
#                             │
#                             ▼ proxied to amadeus:8080
#                          amadeus (published on host port 8080)
#                             │
#                             └──▶ /var/lib/amadeus volume
#
# Under this topology, amadeus is published directly on the host (port 8080).
# Ensure your external proxy strips any client-supplied Remote-* headers before injecting.
# Use CRONOMICON_TRUSTED_PROXIES=10.0.0.0/8 (or your proxy's specific IP/CIDR).

name: amadeus

services:
  # ── Cronomicon: the app. Built from this repo; published on host port 8080.
  amadeus:
    build:
      # This compose file lives at the repo root so the build context (`.`) IS
      # the repo root — which the Dockerfile needs (it copies frontend/ and
      # backend/, and .dockerignore lives at the root). Works identically for
      # DockHand and for a local `docker compose build` from the repo root.
      context: .
      dockerfile: backend/Dockerfile
      args:
        VERSION: ${CRONOMICON_VERSION:-dev}
        COMMIT: ${CRONOMICON_COMMIT:-none}
        BUILD_DATE: ${CRONOMICON_BUILD_DATE:-unknown}
    # Image to run. Default: the CI-built image in the internal registry, which
    # DockHand re-pulls when the pipeline calls the stack webhook. To build
    # from source instead, set
    # CRONOMICON_IMAGE=amadeus:local and run `docker compose up -d --build` from a
    # FRESH clone. DockHand's "Build images on deploy" must stay OFF.
    image: ${CRONOMICON_IMAGE:-registry.example.com/amadeus:latest}
    restart: unless-stopped
    ports:
      - "${CRONOMICON_EXTPORT:-8079}:8080"
    #env_file:
    #  - ./amadeus.env
    volumes:
      - amadeus-data:/var/lib/amadeus
      # Stored-secret KEK (S14) — app CONFIG, not a store secret, so it lives under
      # CRONOMICON_KEK*. Provision out-of-band; back up
      # SEPARATELY from the SQLite S3 backup. Path matches CRONOMICON_KEK_FILE in
      # amadeus.env.
      # NOTE: under DockHand the repo is re-cloned each deploy and the KEK is not
      # in git, so a relative bind mount resolves to a non-existent source and
      # Docker creates an empty DIRECTORY here. We supply the KEK via the
      # CRONOMICON_KEK env var instead (DockHand env panel). To use a file, mount an
      # ABSOLUTE host path that exists and set CRONOMICON_KEK_FILE to it.
      #- /absolute/host/path/amadeus_kek:/run/secrets/amadeus_kek:ro
    healthcheck:
      # Distroless has no shell/curl — the binary probes itself (B.5).
      test: [ "CMD", "/app/amadeus", "healthcheck", "-ready" ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      CRONOMICON_APPRISE_URL: ${CRONOMICON_APPRISE_URL}
      CRONOMICON_AUTH_MODE: ${CRONOMICON_AUTH_MODE}
      CRONOMICON_BACKUP_S3_ACCESS_KEY: ${CRONOMICON_BACKUP_S3_ACCESS_KEY}
      CRONOMICON_BACKUP_S3_BUCKET: ${CRONOMICON_BACKUP_S3_BUCKET}
      CRONOMICON_BACKUP_S3_ENDPOINT: ${CRONOMICON_BACKUP_S3_ENDPOINT}
      CRONOMICON_BACKUP_S3_REGION: ${CRONOMICON_BACKUP_S3_REGION}
      CRONOMICON_BACKUP_S3_SECRET_KEY: ${CRONOMICON_BACKUP_S3_SECRET_KEY}
      CRONOMICON_BACKUP_S3_USE_SSL: ${CRONOMICON_BACKUP_S3_USE_SSL}
      CRONOMICON_BOOTSTRAP_ADMIN_GROUP: ${CRONOMICON_BOOTSTRAP_ADMIN_GROUP}
      CRONOMICON_COOKIE_SECURE: ${CRONOMICON_COOKIE_SECURE}
      CRONOMICON_GITLAB_BASE_URL: ${CRONOMICON_GITLAB_BASE_URL}
      CRONOMICON_GITLAB_TOKEN: ${CRONOMICON_GITLAB_TOKEN}
      CRONOMICON_GITLAB_WEBHOOK_SECRET: ${CRONOMICON_GITLAB_WEBHOOK_SECRET}
      # KEK = app config (namespace contract): CRONOMICON_KEK*.
      CRONOMICON_KEK: ${CRONOMICON_KEK:-}
      CRONOMICON_KEK_FILE: ${CRONOMICON_KEK_FILE:-}
      CRONOMICON_LOGOUT_REDIRECT_URL: ${CRONOMICON_LOGOUT_REDIRECT_URL}
      CRONOMICON_LOG_FORMAT: ${CRONOMICON_LOG_FORMAT}
      CRONOMICON_LOG_LEVEL: ${CRONOMICON_LOG_LEVEL}
      CRONOMICON_RETENTION_CHANGELOG_DAYS: ${CRONOMICON_RETENTION_CHANGELOG_DAYS}
      CRONOMICON_RETENTION_RUNS_DAYS: ${CRONOMICON_RETENTION_RUNS_DAYS}
      CRONOMICON_RUNNER_BOOTSTRAP_TOKEN: ${CRONOMICON_RUNNER_BOOTSTRAP_TOKEN}
      CRONOMICON_SSH_EXECUTOR_ENABLED: ${CRONOMICON_SSH_EXECUTOR_ENABLED}
      CRONOMICON_TRUSTED_PROXIES: ${CRONOMICON_TRUSTED_PROXIES}
  #    networks:
  #      internal: {}

  # ── Apprise gateway: multi-service push fan-out.
  #  apprise:
  #    image: caronc/apprise:1.1
  #    restart: unless-stopped
  #    expose:
  #      - "8000"
  #    volumes:
  #      - apprise-config:/config
  #      - apprise-plugin:/plugin
  #      - apprise-attach:/attach
  #    networks:
  #      internal: {}

  #networks:
  # Private app network: internal is NOT internal: true anymore so NPM can reach it if needed,
  # or NPM can route to the Docker host's IP on port 8080.
  #  internal:
  #    ipam:
  #      config:
  #        - subnet: 172.28.0.0/24

volumes:
  # The volume DockHand's stack created. `external: true` re-attaches it by its
  # exact name and refuses to start if it is missing — compose never creates a
  # fresh, empty one by accident. Confirm the name with `docker volume ls`.
  amadeus-data:
    external: true
    name: amadeus_amadeus-data
    #  apprise-config: {}
    #  apprise-plugin: {}
    #  apprise-attach: {}
