  # ── SSH inventory (DB-backed per A1.3) ─────────────────────────────────────
  /ssh/hosts:
    get:
      tags: [Settings]
      operationId: listSshHosts
      summary: List SSH target hosts
      responses:
        '200':
          description: Hosts.
          content:
