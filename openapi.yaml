        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ssh/hosts/{hostId}/test:
    post:
      tags: [Settings]
      operationId: testSshHost
      summary: Test the SSH connection to a host
      description: >-
        Opens a real SSH connection to the host (direct or via its bastion) and
        verifies key-based login, persisting the outcome to the host's status.
        A test that runs but fails to authenticate/connect still returns 200 —
        the result is data; 4xx/5xx mean the test could not be run.
      parameters: [{ $ref: '#/components/parameters/hostId' }, { $ref: '#/components/parameters/csrf' }]
      responses:
        '200':
          description: Test ran; outcome in the body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A connection test is already in progress for this target. }

  /ssh/hosts/{hostId}/host-key:
    delete:
      tags: [Settings]
      operationId: clearSshHostKey
      summary: Clear the pinned host key (re-key)
      description: >-
        Clears the target's pinned SSH host key so the next connect re-captures it
        via TOFU (FU-1) — the supported way to re-key a legitimately rotated host
        without a raw SQL UPDATE. Resets status to unverified. Audited.
      parameters: [{ $ref: '#/components/parameters/hostId' }, { $ref: '#/components/parameters/csrf' }]
      responses:
        '204': { description: Pin cleared (or was already empty). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ssh/bastions:
    get:
      tags: [Settings]
      operationId: listSshBastions
      summary: List SSH bastions
      responses:
