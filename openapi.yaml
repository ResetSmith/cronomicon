        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Settings]
      operationId: deleteSshBastion
      summary: Delete a bastion
      parameters: [{ $ref: '#/components/parameters/bastionId' }, { $ref: '#/components/parameters/csrf' }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ssh/bastions/{bastionId}/test:
    post:
      tags: [Settings]
      operationId: testSshBastion
      summary: Test the SSH connection to a bastion
      description: >-
        Opens a real SSH connection to the bastion, authenticating with the
        bastion's own user + key, and persists the outcome to its status. Same
        200-with-result contract as the host test.
      parameters: [{ $ref: '#/components/parameters/bastionId' }, { $ref: '#/components/parameters/csrf' }]
      responses:
        '200':
          description: Test ran; outcome in the body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A connection test is already in progress for this target. }

  /ssh/bastions/{bastionId}/host-key:
    delete:
      tags: [Settings]
      operationId: clearBastionHostKey
      summary: Clear the pinned bastion host key (re-key)
      description: >-
        Clears the bastion's pinned SSH host key so the next connect re-captures
        it via TOFU (FU-1/SU-4). Resets status to unverified. Audited.
      parameters: [{ $ref: '#/components/parameters/bastionId' }, { $ref: '#/components/parameters/csrf' }]
      responses:
        '204': { description: Pin cleared (or was already empty). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ssh/credentials:
    get:
      tags: [Settings]
      operationId: listSshCredentials
      summary: List SSH key credentials
      parameters:
        - { $ref: '#/components/parameters/tagFilter' }
        - { $ref: '#/components/parameters/tagMatch' }
      responses:
        '200':
          description: Credentials (metadata only; never key material).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SshCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Settings]
      operationId: createSshCredential
      summary: Create an SSH key credential
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SshCredentialInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /ssh/credentials/{credentialId}:
    get:
      tags: [Settings]
      operationId: getSshCredential
      summary: Get an SSH key credential (metadata only)
      parameters: [{ $ref: '#/components/parameters/credentialId' }]
      responses:
        '200':
          description: Credential.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Settings]
      operationId: updateSshCredential
      summary: Update or rotate an SSH key credential
      parameters: [{ $ref: '#/components/parameters/credentialId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SshCredentialInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Settings]
      operationId: deleteSshCredential
      summary: Delete an SSH key credential
      description: >-
        Refuses with 409 (returning the referencing hosts/bastions) when the
        credential is still in use, unless force=true — which clears those
        references first, then deletes.
      parameters:
        - { $ref: '#/components/parameters/credentialId' }
        - { $ref: '#/components/parameters/csrf' }
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Delete even if referenced, clearing the references.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Still referenced by hosts/bastions; retry with force=true.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshCredentialUsage' }

  /ssh/credentials/{credentialId}/usage:
    get:
      tags: [Settings]
      operationId: sshCredentialUsage
      summary: List hosts and bastions that reference a credential
      parameters: [{ $ref: '#/components/parameters/credentialId' }]
      responses:
        '200':
          description: Referencing hosts and bastions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshCredentialUsage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ssh-credential-tags/{credentialId}:
    put:
      tags: [Settings]
      operationId: updateSshCredentialTags
      summary: Set an SSH key credential's tags (operator-authored)
      description: |
        Replaces the credential's operator-authored tag set (migration 470). Tags
        are plaintext metadata stored beside the label — never the sealed key
        material — so the crypto/rotate paths are untouched. Carries the same
        ConfigureApp permission as the credential's other writes. Tags are
        normalized server-side: trimmed, blanks dropped, de-duplicated
        case-insensitively, and capped (≤30 tags, ≤64 chars each) — a violation is 422.
      parameters:
        - { $ref: '#/components/parameters/credentialId' }
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: The updated credential (with its normalized tags; key material never included).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  # ── Access (roles, mappings, scope restrictions, recent logins) ────────────
  /roles:
    get:
      tags: [Access]
      operationId: listRoles
      summary: List roles + permission matrix
      description: |
        Roles are DATA as of v0.56.1 (RB-6/RB-7) — a `roles` table, not a
        compiled-in list — so this returns the four built-ins plus any custom role
        an operator has defined. Ordered by descending `rank`, then name.

        Roles are pure, reusable PERMISSION TEMPLATES and carry no scope of their
        own: scope attaches to the grant (the scope-restriction matrix today,
        `access_grants` in a later phase). Modelling departments as roles instead
        would mean one role per department per level — 24 agencies × 4 levels = 96
        roles, and four more for every department added.
      responses:
        '200':
          description: Every defined role.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Access]
      operationId: createRole
      summary: Define a custom role (ManageRoles)
      description: |
        Names are canonicalized to lowercase, so `Tax-Operator` and `tax-operator`
        are one role and the second create is a 409. Signs out every other session
        (SU-5): a role's permission set changes what its holders may do on their
        next request, so stale sessions must re-resolve.
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: The created role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: A role with that (canonicalized) name already exists. }
        '422': { $ref: '#/components/responses/Validation' }

  /roles/{roleName}:
    put:
      tags: [Access]
      operationId: updateRole
      summary: Edit a role's permissions (ManageRoles)
      description: |
        Built-in roles ARE editable — an operator who wants Approver without
        publishSchedule should not have to invent a parallel role — but two floors
        are enforced with 409 `last_admin_lockout`:

        - the `admin` role can never give up `manageRoles`, because nothing could
          then restore it; and
        - the edit may not leave *no* role holding `manageRoles`.

        `builtin` is not updatable: it is what makes a role undeletable, so
        clearing it would be a way to delete `admin` in two steps. Signs out every
        other session (SU-5).
      parameters:
        - { name: roleName, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200':
          description: The updated role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such role. }
        '409': { description: 'Lockout floor: admin may not lose manageRoles, and some role must retain it.' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Access]
      operationId: deleteRole
      summary: Delete a custom role (ManageRoles)
      description: |
        Built-in roles cannot be deleted (409). A role still mapped to any AD group
        is refused with 409 `role_in_use` rather than cascading — mirroring agency
        deletion, and because cascading would silently strip access from every user
        whose only role this was, which is the kind of quiet revocation this whole
        surface exists to make visible. Its scope-restriction rows are removed
        alongside it, so recreating the name later does not silently re-arm old
        grants. Signs out every other session (SU-5).
      parameters:
        - { name: roleName, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/csrf' }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such role. }
        '409': { description: Built-in, or still referenced by an access grant. }

  /agencies/{agencyId}/members:
    put:
      tags: [Agencies]
      operationId: setAgencyMembers
      summary: Replace one agency's member list (RB-22)
      description: |
        The agency-scoped write axis. `PUT /{kind}-agencies` replaces one ENTITY's
        agency list; this replaces one AGENCY's member list across all five kinds
        (scope, secret, env-var, ssh-credential, runner), and touches only rows
        belonging to this agency — so two admins editing two different departments
        cannot race on the same rows, which the entity-centric setters cannot
        promise from an agency-shaped editor.

        Adding an entity is a re-homing act and carries the RF-1b guard per added
        entity: the caller needs the kind's permission on an agency that owns the
        entity today (unowned entities are unrestricted-only, RB-Q14) AND on this
        agency. Removing needs the permission on this agency alone. Scopes are
        governed by the route's ConfigureApp gate (their membership defines the
        grant expansion); a scope moving in or out signs out all other operators.

        Refuses removing an entity from the agency that OWNS it (422
        `owner_removal`, RA-15) — transfer ownership first. A no-op save writes no
        audit row. Returns the resulting AgencyDetail.
      parameters: [{ $ref: '#/components/parameters/agencyId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                members:
                  type: array
                  description: The desired complete member list for this agency.
                  items: { $ref: '#/components/schemas/AgencyMemberRef' }
      responses:
        '200':
          description: The agency's resulting contents and dispatch health.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgencyDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

