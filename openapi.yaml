# ─────────────────────────────────────────────────────────────────────────────
# Cronomicon API — SEED CONTRACT (handoff artifact)
#
# This file is the handoff SEED for the backend repo. It was generated from
# the architecture notes (A1–A7 + T1–T13, ratified Jun 9 2026) and the
# S-series backend/schema contracts in the backlog, with entity shapes
# derived from the ratified prototype (amadeus-data.jsx).
#
# IMPORTANT (architecture.md §1 / T5): once backend code exists, this spec MUST
# be generated from code (e.g. swaggo) and wired into CI. Hand-maintenance of
# this file is forbidden after that point. The backend owns the contract; the
# frontend regenerates a typed client from it.
# ─────────────────────────────────────────────────────────────────────────────
openapi: 3.1.0
info:
  title: Cronomicon API
  version: 0.1.0
  description: |
    Seed API contract for the Cronomicon job-orchestration backend, derived from
    the ratified prototype + architecture.md (A1–A7, T1–T13) and the S-series
    backend contracts in todos.md. The backend (Go) owns this file going
    forward; once backend code exists it must be generated from code (swaggo),
    not hand-maintained.

    Conventions:
    - All timestamps on the wire are ISO 8601 / RFC 3339 (S12). Pretty strings
      are a display-layer concern.
    - Trace IDs are backend-minted UUIDv7, opaque to clients (S11).
    - All operator-editable records carry createdBy / lastModifiedBy /
      lastModifiedAt (S1/S4); these are backend-assigned and readOnly.
    - Operator endpoints use the session cookie + CSRF double-submit header on
      state-changing requests (T8). Runner endpoints use a bearer key (T9).
    - Git is canonical for job/workflow/schedule definitions; the entities
      served from the DB are the documented exceptions in architecture.md §2.2.
  contact:
    name: Cronomicon Backend
servers:
  - url: /api/v1
    description: Same-origin API mount (single-container deployment, T3).

tags:
  - name: Jobs
  - name: Scripts
  - name: Workflows
  - name: Runs
  - name: Activity
  - name: Change Log
  - name: Schedules
  - name: Scopes
  - name: Agencies
  - name: Env Vars
  - name: Secrets
  - name: Runners
  - name: Settings
  - name: Access
  - name: Service Accounts
  - name: Revisions
  - name: Git
  - name: Health

security:
  - operatorSession: []

# ═════════════════════════════════════════════════════════════════════════════
paths:
  # ── Health (T13 — unauthenticated, served at root, NOT under /api/v1) ──────
  /healthz:
    get:
      tags: [Health]
      operationId: getHealthz
      summary: Liveness probe
      description: |
        Process is alive and can write to the SQLite DB (architecture.md §11.5).
        Served at the server root, outside /api/v1. Unauthenticated per T13.
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
        '500':
          description: DB not writable — orchestrator should restart the container.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /readyz:
    get:
      tags: [Health]
      operationId: getReadyz
      summary: Readiness probe
      description: |
        Ready to serve traffic. Enumerates subchecks (OIDC metadata cached,
        Vault unsealed if configured, GitLab clone present-or-stale, no pending
        migration). 200 does NOT imply every dependency is up — only that
        Cronomicon can serve with the degradation allowed by §11.4. Served at the
        server root, outside /api/v1. Unauthenticated per T13.
      security: []
      responses:
        '200':
          description: Ready (possibly degraded).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadyzReport' }
        '503':
          description: Not ready (e.g. pending DB migration).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadyzReport' }

  /agents/{filename}:
    get:
      tags: [Runners]
      operationId: downloadAgent
      summary: Download a runner-agent binary or its checksums
      description: |
        Serves the cross-compiled `amadeus-runner` binaries and their
        `SHA256SUMS` baked into the server image (runner provisioning D1;
        directory overridable via `CRONOMICON_AGENT_DIR`). Allowlisted filenames
        only: `amadeus-runner-linux-amd64`, `amadeus-runner-linux-arm64`,
        `SHA256SUMS`. Consumed by `runner-install.sh --download`, which
        verifies the checksum before installing. Served at the server root,
        outside /api/v1. Unauthenticated by design — the binary is not a
        secret and the install flow runs before any credential exists on the
        host (rationale in deploy/security-review.md).
      security: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            enum: [amadeus-runner-linux-amd64, amadeus-runner-linux-arm64, SHA256SUMS]
      responses:
        '200':
          description: The artifact (binaries as octet-stream, SHA256SUMS as text).
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string }
        '404':
          description: |
            Unknown filename (`not_found`), or this deployment does not bundle
            agent binaries (`agents_not_bundled` — bare-metal builds; the
            message carries a build-it-yourself hint).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /install/{token}:
    get:
      tags: [Runners]
      operationId: installScript
      summary: One-click personalized runner install script
      description: |
        Serves `runner-install.sh` with this server's URL, the registration
        token, and binary-download-on baked in, so a whole install is one
        flagless pipe (runner provisioning plan 2 Phase 2, D2):

            curl -fsSL https://amadeus.example.com/install/crn_reg_… | sudo bash

        A dumb substitution endpoint: it does NOT read the DB or validate the
        token against it (no token-validity oracle). Registration remains the
        sole enforcement point — single-use, atomic, audited — so serving a
        script for a dead token just yields a clean registration failure on the
        host. Only the token SYNTAX is checked (`crn_reg_` + 64 hex); anything
        else is a generic 404. Capabilities are not baked — the agent
        auto-detects the host's toolchains at startup (Phase 1). Served at the
        server root, outside /api/v1. Unauthenticated by design: the token in
        the path IS the credential and the script is not a secret (see
        deploy/security-review.md, incl. the token-in-URL access-log note).
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: A registration token (`crn_reg_` + 64 lowercase hex).
          schema:
            type: string
            pattern: '^crn_reg_[0-9a-f]{64}$'
      responses:
        '200':
          description: The personalized install script.
          content:
            text/x-shellscript:
              schema: { type: string }
        '400':
          description: |
            The server could not reconstruct its own URL from the request
            (`bad_host`) — install via the Provision helper's explicit one-liner
            instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: |
            The path is not a syntactically valid registration token, or this
            deployment has no bundled frontend (`not_found`). Reveals nothing
            about whether a well-formed token is live.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Jobs ───────────────────────────────────────────────────────────────────
  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List jobs
      description: |
        Jobs are parsed from the GitLab clone at sync time (Git wins on read,
        §2.4). Runtime fields (status, lastRun, nextRun) come from the DB.
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/RunType' } }
        - { name: scope, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/JobStatus' } }
        - { $ref: '#/components/parameters/tagFilter' }
        - { $ref: '#/components/parameters/tagMatch' }
        - { name: q, in: query, description: Free-text search on name., schema: { type: string } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
      responses:
        '200':
          description: Paginated job list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Jobs]
      operationId: createJob
      summary: Compose an amadeus-source job (A11)
      description: |
        Creates an in-app (source='amadeus') job binding a Git Script (scriptRef) ×
        Schedule(s) × Scope × execution options — no Git round-trip. Requires the
        Compose capability (Admin-only in v20). The referenced script's run_type +
        body + executor are denormalized onto the job so it runs through the same
        scheduler/executor seam as a Git job.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobComposeInput' }
      responses:
        '201':
          description: The created job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /jobs/{jobId}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get a job
      parameters: [{ $ref: '#/components/parameters/jobId' }]
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Jobs]
      operationId: updateJob
      summary: Edit an amadeus-source job (A11)
      description: Edits an in-app job. Git-source jobs are read-only here (409). Requires Compose.
      parameters: [{ $ref: '#/components/parameters/jobId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobComposeInput' }
      responses:
        '200':
          description: The updated job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Jobs]
      operationId: deleteJob
      summary: Delete an amadeus-source job (A11)
      description: |
        Deletes an in-app job (cascades its schedule bindings). Git-source jobs
        are read-only here (409). Requires Compose.

        Also 409s while any reaction WATCHES this job (RX-24) with code
        `reactions_watching` — distinct from the git-source `conflict`, because
        only this refusal is clearable — listing them, unless ?force=true. Deleting a watched job never cascades its watchers
        away — a reaction that vanished because somebody removed an unrelated
        upstream would be a silent loss of authored work — so forcing leaves
        them dangling, flagged `missing` on the Reactions tab.
      parameters:
        - { $ref: '#/components/parameters/jobId' }
        - { name: force, in: query, description: 'Delete even while reactions watch it, leaving those reactions dangling.', schema: { type: boolean } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /jobs/{jobId}/file-sightings:
    get:
      tags: [Jobs]
      operationId: listJobFileSightings
      summary: The file-arrival sighting ledger (FX-E1)
      description: >-
        Every arrival a watch observed for this job, newest first — including the ones that
        started nothing. A sighting with a null runId carries refusedReason instead: the durable
        answer to "the file landed, why did nothing happen?", which v0.57.31 recorded from day
        one and nothing could read until v1.0.5. Rows age out on the runs retention window.
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: One page of sightings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  pageSize: { type: integer }
                  totalItems: { type: integer }
                  totalPages: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FileSighting' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{jobId}/run:
    post:
      tags: [Jobs]
      operationId: runJob
      summary: Trigger a manual run
      description: |
        Enqueues a run. The backend mints the trace ID (UUIDv7, S11), resolves
        the executor (R5.1: per-trigger override > job spec.executor > global
        execution.defaultExecutor > run-type capability default), and filters
        candidate runners by capability (A6.3); if none match, the run stays
        queued with reason "waiting for {type}-capable runner".
        ansible/terraform route to the runner executor and queue normally when
        no capable runner is registered (R4.3) — they are not rejected.
        Targeting a scope whose declared types exclude the job type is allowed
        (advisory model, §9.2) — the UI soft-warns, the API does not reject.
        Auth: session + CSRF, **plus scope access AND the triggerJobs verb**, both
        enforced on this route.

        *Scope access* (A5): the caller must be able to reach the run's effective
        scope — the job's declared scope, or the `scope` override below — and a
        scope they cannot reach is a 403. The predicate is the READ-side one
        (auth.ScopeReadable), so an unrestricted caller reaches every scope.

        *The verb* (RB-2, v0.56.4): the caller must additionally hold **triggerJobs
        on that same scope**. The two answer different questions — may you SEE this
        scope, may you ACT on it — and both must pass, which is what stops a
        viewer with scope access from triggering. Holding the verb somewhere is not
        holding it here: an operator scoped to Finance is a 403 on a Tax job.

        **An unscoped job carries no authority of its own** (RB-26). A job with no
        declared scope used to be triggerable by anyone with a session, dispatched
        to the general runner pool, with its declared targetHost validated against
        nothing. Now a RESTRICTED caller must bind an effective scope they hold via
        the `scope` field below — `403 scope_required` otherwise — and only an
        unrestricted caller may run it unbound. This reframes an unscoped job as a
        TEMPLATE: one `restart-service`, run by Tax against Tax and Finance against
        Finance, rather than one catalog entry per department.

        Binding also makes the run real rather than nominal: it records the bound
        scope, derives that scope's agency set (so the run leaves the general pool
        and reaches that department's runners), and enables host-subset targeting,
        which requires a scope to validate membership against.

        **A declared targetHost is validated against a newly bound scope** (RB-27).
        When a restricted caller binds a scope to a job that had none, the job's
        declared host must be a member of that scope's inventory — `422
        scope_membership`, the same code the host-subset path uses. Without this the
        bind would be decorative: an unscoped job pinned to `finance-db-01` and
        bound to Tax would still reach the Finance host.

        A SCHEDULED fire has no caller, so it is deliberately left unbound and
        general-pool (RB-Q11(c)); schedule authoring is admin-only for that reason.
      parameters: [{ $ref: '#/components/parameters/jobId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  description: Override target scope. Defaults to the job's declared scope.
                targetHost:
                  type: string
                  description: |
                    Target a single host instead of a scope fan-out (EX.5). Defaults to
                    the job's declared host. Legacy single-host form; prefer targetHosts
                    for one-or-many selection (equivalent to a one-element targetHosts).
                targetHosts:
                  type: array
                  items: { type: string }
                  description: |
                    F2 — restrict this run to a subset of the bound scope's hosts (one or
                    many). Every entry must be a member of the effective scope's inventory
                    or the run is rejected (422, code=scope_membership). Empty/omitted ⇒
                    full-scope fan-out (today's default). Enforced for the SSH executor;
                    best-effort for runner-executor runs whose agent resolves a local
                    inventory (V2-12). Free-form open-host targeting (hosts outside any
                    scope) is V2.
                targetGroups:
                  type: array
                  items: { type: string }
                  description: |
                    M3 — restrict this run to one or more inventory GROUPS of the bound
                    scope. Each must be a group in the scope's parsed projection or the
                    run is rejected (422, code=group_membership); if the projection is
                    unavailable (an unsupported inventory construct), all group targeting
                    is rejected. Group members are expanded for the SSH executor and
                    passed by NAME as `ansible --limit` for the runner — both executors
                    target the identical set. Unions with targetHosts when both are given.
                ansibleLimit:
                  type: string
                  description: |
                    M3 — RAW `ansible --limit` passthrough for patterns the structured
                    projection can't model (e.g. complex set arithmetic). ANSIBLE / runner
                    runs only — rejected (422, code=invalid_executor) on the SSH executor,
                    which cannot honor a raw pattern. Takes precedence over the structured
                    host∪group limit. Exec-safe (a single argv element, no shell); its
                    content is the operator's responsibility.
                executor:
                  type: string
                  enum: [runner, ssh]
                  description: |
                    Per-trigger executor override (R5.1). Highest-precedence input;
                    overrides the job's spec.executor and the global default. Omit
                    to resolve from spec.executor → global default → run-type
                    capability default. executor=ssh is rejected (422) for
                    ansible/terraform, which require the runner executor (R5.2).
                runnerTag:
                  type: [string, 'null']
                  maxLength: 64
                  description: |
                    RT — per-run runner pin override. Highest-precedence input,
                    above the job's operator override and its declared pin. Three
                    distinct cases: a tag pins THIS run to runners carrying it;
                    `""` runs this one unpinned even though the job is pinned (the
                    break-glass case when the tagged runners are all down); and
                    omitting the field inherits the job's effective pin. `null` is
                    treated as omitted.

                    Rejected (422, code=`invalid_runner_tag`) when the run
                    RESOLVES to the ssh executor — the in-process SSH pool has no
                    runner for a tag to select, so honouring the pin there is
                    impossible and ignoring it would run the job from the control
                    plane while the operator believed it was confined to a network
                    segment. Note this tests the resolved executor, so a job with
                    no explicit executor can hit it via the default chain. The same
                    rule refuses a run that binds an SSH key and resolves to ssh
                    (`key_binding_requires_runner`).
                priority:
                  type: integer
                  description: >-
                    QP — claim priority for this run only. Higher is claimed
                    first; ties break oldest-first. There is deliberately no
                    job-spec default: a standing priority is how one job starves
                    another permanently rather than merely going first today.
                ansibleCheck:
                  type: boolean
                  description: |
                    Phase 3 — `--check`: a DRY RUN. Ansible reports what would change
                    and applies nothing. The run still records success/failure
                    normally, so this flag (and the run's own log) is the only record
                    that it was a rehearsal. Ansible run types only (422 otherwise).
                ansibleDiff:
                  type: boolean
                  description: "Phase 3 — `--diff`: show per-task diffs. Ansible run types only."
                ansibleTags:
                  type: array
                  items: { type: string }
                  description: |
                    Phase 3 — `--tags`: run ONLY tasks carrying these tags. Plain tag
                    names; a tag containing a comma or ansible pattern character is
                    refused (422), because it would silently re-split the selection.
                ansibleSkipTags:
                  type: array
                  items: { type: string }
                  description: "Phase 3 — `--skip-tags`: exclude tasks carrying these tags. Same charset rule as ansibleTags."
                ansibleVerbosity:
                  type: integer
                  minimum: 0
                  maximum: 4
                  description: "Phase 3 — 0 ⇒ normal, 1–4 ⇒ `-v` … `-vvvv`. Outside the range is a 422."
                ansibleBecome:
                  type: boolean
                  description: |
                    Phase 3 — `--become`: escalate privilege on the target. No extra
                    permission is required: a playbook can already declare `become`
                    itself, so the flag grants nothing the caller could not run anyway.
                ansibleBecomeUser:
                  type: string
                  description: "Phase 3 — `--become-user` (default root). Plain username charset, else 422."
                ansibleExtraVars:
                  type: object
                  additionalProperties: { type: string }
                  description: |
                    Phase 3 — `-e name=value` extra-vars, ansible's highest-precedence
                    variable source. Two constraints: `ansible_user` and
                    `ansible_ssh_private_key_file` are REFUSED (422) because they are
                    owned by the run's connect-as identity and `-e` is the same tier —
                    accepting them would let a run connect as someone other than what
                    its audit record claims; and values land in the runner's process
                    table, readable by any local user there, so they must never carry
                    secret material (use `references`).
                sshUser:
                  type: string
                  description: |
                    CA — per-run "connect as" override: the SSH login used for every
                    resolved target of THIS run, in place of each host's configured
                    username (per-host default when omitted; bastion hops unaffected,
                    CA-Q4). Plain username charset only (letters, digits, '.', '-',
                    '_'; starts with a letter or '_'; ≤32 chars) — else 422.
                    Identity-capable run types only (ssh-family + ansible): on an
                    ansible run it is delivered as the `ansible_user` connection
                    extra-var, which BEATS inventory-authored identity on every host
                    of the run (RP-Q1). 422 (validation_failed) on terraform, which
                    authenticates through its providers rather than SSH.
                sshCredential:
                  type: string
                  description: |
                    CA — per-run stored SSH credential override, by LABEL (names only —
                    key bytes never ride the request or the run's audit envelope). The
                    selected key replaces each resolved target's configured key for
                    THIS run: in-process signer resolution on the SSH executor;
                    delivered-key-file resolution (D8, CRONOMICON_KEY_<label>) on runner
                    ssh-family runs — such runs are claimable only by
                    allow_secret_injection runners and refuse local-inventory runners
                    (409). On an ansible run the delivered key file is passed as the
                    `ansible_ssh_private_key_file` connection extra-var, beating the
                    inventory's key for every host (RP-Q1). Requires the
                    ManageEnvVars permission (403 without it) — selecting a key is a
                    grant over stored key material, the same gate as `references`.
                    Unknown label → 422 validation_failed; identity-capable run types
                    only (ssh-family + ansible), like sshUser.
                env:
                  type: object
                  additionalProperties: { type: string }
                  description: |
                    F1 — per-run environment-variable overrides, applied on top of any
                    schedule-declared env (override-wins). Plaintext key/value only —
                    to inject a stored Secret/Variable/SSH Key use `references` below
                    instead of pasting a value here. Keys must match
                    ^[A-Za-z_][A-Za-z0-9_]*$ (non-conforming keys are dropped). Values are
                    NOT treated as secrets for redaction — do not pass secret material.
                promptAnswers:
                  type: object
                  additionalProperties: { type: string }
                  description: |
                    T2.4 — run-input audit metadata: declared-input name → where the value
                    came from ("typed" | "default" | "override" | "job env"). Purely
                    descriptive; it never changes what the run does, and keys the job does
                    not declare are dropped server-side. Recorded on the run's override
                    envelope. Optional — omitting it behaves exactly as before.
                reviewedSections:
                  type: array
                  items: { type: string, enum: [variables, where-it-runs, targets, method, advanced, when-to-run, confirmation] }
                  description: |
                    RV — which of the Run dialog's sections the operator had open
                    before running (the visited-gating record), plus `confirmation`
                    when the run's deviating settings were confirmed through the RC
                    confirmation window. `when-to-run` was added in v0.57.21 (RU-8);
                    older clients never send it. Audit-only, like the prompt metadata: never
                    changes what the run does. Unknown values are silently dropped;
                    absence means the caller wasn't the dialog.
                promptAcknowledged:
                  type: boolean
                  description: |
                    T2.4 — true when the operator explicitly proceeded past an unfilled
                    required run input ("Run anyway"). Distinguishes "was warned and
                    proceeded" from "nobody looked". Advisory: it does NOT suppress the
                    server-derived promptWarnings and never affects acceptance (UDV4 — an
                    unfilled required input never returns 422). Optional.
                references:
                  type: array
                  items:
                    type: object
                    required: [kind, name]
                    properties:
                      kind:
                        type: string
                        enum: [secret, var, key]
                        description: The Env Vars section the referenced row lives in.
                      name:
                        type: string
                        description: The row's BARE name (never the derived CRONOMICON_* form).
                      as:
                        type: string
                        description: |
                          RA-4 — the optional ALIAS: the bare DESTINATION name this
                          row's value is injected under, so a caller can supply
                          THEIR department's credential to a shared job body that
                          reads a fixed CRONOMICON_SECRET_<name>. Omitted ⇒ injected
                          under the row's own name.

                          A destination, never a selector: `name` still selects the
                          row and it is still resolved under this run's scope and
                          agency snapshot, so an alias can never widen what the
                          caller may attach — an out-of-department row aliased to
                          an innocuous name still 403s. Same charset rules as a row
                          name of that kind; a violation is 422 invalid_binding.
                  description: |
                    V2-11 (stored-reference additions) — attach existing Env Vars rows
                    (Secrets / Variables / SSH Keys) to THIS run only, on top of the
                    job's/script's declared reference bindings. Additive: the declared
                    set cannot be shrunk per-run. Names only — values resolve at
                    dispatch under the run's scope/agency rules exactly like declared
                    bindings (fail-closed, same oracle-safe 409), and only the names
                    enter the run's override envelope. Requires the ManageEnvVars
                    permission (403 without it): a reference is a grant over stored
                    secret/key material, the same gate as editing a job's declared
                    bindings. Invalid kind or bare name → 422 invalid_binding. A key
                    added to a run that RESOLVES to the ssh executor is refused like a
                    declared key (422 key_binding_requires_runner, KB — the in-app
                    executor cannot deliver key files; SSH keys are delivered on the
                    runner path only). Preflight resolvability with POST
                    /references/validate.
                runAt:
                  type: [string, 'null']
                  format: date-time
                  description: |
                    AR — "When to run": defer this run to an RFC3339 instant.
                    Everything else in the body is validated and frozen at
                    trigger time; at runAt the run is promoted through the
                    normal enqueue seam. Must be in the future and within a
                    year. Concurrency cap and Forbid policy are judged at
                    promotion, not at scheduling. Omit to run immediately.
                    A deferred trigger answers 202 with a PendingRun instead
                    of a Run; cancel via DELETE /pending-runs/{id}.
      responses:
        '202':
          description: Run accepted and queued/dispatched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Concurrency cap reached (globalSettings.maxConcurrent; see S16 — per-job cap TBD).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            Validation failed. `Error.code` distinguishes the cases:
            `invalid_executor` — executor=ssh cannot run ansible/terraform; use the
            runner executor (R5.2). `scope_membership` / `group_membership` — a
            targetHosts/targetGroups entry that is not a member of the effective scope's
            inventory (F2/M3). `prompt_required` (JR-Q5) — the job is
            `promptEnforcement: block` and a declared REQUIRED run input has no value in
            the run's effective env; the message names them. A `warn` job (the default,
            and every job that predates Phase 3) is never rejected for this, and
            `promptAcknowledged` does NOT bypass a `block` job (JR-Q10).
            `invalid_binding` — a `references` entry has an unknown kind, an invalid
            bare name, or an invalid `as` alias (same rules as a stored binding
            write); or two entries naming DIFFERENT rows alias to the same
            destination (RA-Q2), which is refused rather than resolved by a silent
            last-wins. The message names the contested CRONOMICON_* key.
            `key_binding_requires_runner` (KB) — the run RESOLVED to the ssh
            executor and the job, its script, or a per-run addition binds an SSH
            key; the in-app executor connects from Cronomicon and cannot place a key
            file on the target, so the run is refused rather than started without
            it. The message names the key and both ways out (the runner executor,
            or a Secret binding written to a file by the job body). Scheduled,
            workflow, reaction and file-arrival fires of such a job record the
            same refusal as a skipped or failed run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /jobs/{jobId}/pause:
    post:
      tags: [Jobs]
      operationId: pauseJob
      summary: Pause scheduled runs
      description: Per-instance pause of scheduled execution; writes a Change Log entry. CSRF required.
      parameters: [{ $ref: '#/components/parameters/jobId' }, { $ref: '#/components/parameters/csrf' }]
      responses:
        '200':
          description: Job paused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{jobId}/resume:
    post:
      tags: [Jobs]
      operationId: resumeJob
      summary: Resume scheduled runs
      description: Counterpart of pause (prototype Change Log shows Paused/Resumed actions). CSRF required.
      parameters: [{ $ref: '#/components/parameters/jobId' }, { $ref: '#/components/parameters/csrf' }]
      responses:
        '200':
          description: Job resumed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{jobId}/kill:
    post:
      tags: [Jobs]
      operationId: killJob
      summary: Stop the active run of a job, recording a disposition
      description: |
        Stops the currently-running execution. Delivery to the runner happens
        via its next /poll response (§6.3 — no server-initiated frames).

        RX-4 — the optional `outcome` body records what the stop MEANT. The run's
        status becomes that outcome; `killedBy` is set on every path and stays the
        proof a human ended it. Omitting the body records `killed`, the
        unclassified stop, which is the pre-disposition behaviour. Note that
        `exitCode` is left untouched deliberately: the kill is only queued for the
        runner, so the process may still be alive, and synthesising an exit status
        for a Success disposition would assert something unobserved.

        Emits a run-end activity entry carrying killedBy, with the outcome
        following the disposition (an unclassified `killed` still records
        `failure`, so the default path is unchanged).
      parameters: [{ $ref: '#/components/parameters/jobId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome:
                  type: string
                  enum: [killed, failure, success, warning]
                  default: killed
                  description: |
                    What the stop meant. `killed` (the default) is the
                    unclassified stop and keeps today's behaviour. The other
                    three are already legal run statuses, so a disposition needs
                    no new vocabulary — a stopped run can be recorded as a
                    success, which is what lets an operator kill a wedged
                    workflow step without failing the workflow.
      responses:
        '202':
          description: Stop signal queued for the executing runner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Job has no active run (`no_active_run`), or the run reached a
            terminal state between selection and the write (`already_terminal`
            — RX-6, the status-guarded write refusing to overwrite a real
            outcome with an asserted one).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Malformed body, or an `outcome` outside the allowed set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Scripts ────────────────────────────────────────────────────────────────
  /scripts:
    get:
      tags: [Scripts]
      operationId: listScripts
      summary: List scripts
      description: |
        Scripts are the reusable executable unit (B-Git). Parsed from scripts/*.yaml
        in the GitLab clone at sync time and cached read-only (Git wins on read,
        §2.4); jobs reference a script via scriptRef. Read-only over the API —
        authoring goes through the Git publish flow. Each row carries usedByCount,
        the number of jobs referencing it (blast-radius visibility).
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/RunType' } }
        - { name: q, in: query, description: Free-text search on name., schema: { type: string } }
        - { $ref: '#/components/parameters/tagFilter' }
        - { $ref: '#/components/parameters/tagMatch' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
      responses:
        '200':
          description: Paginated script list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Script' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /scripts/{name}:
    get:
      tags: [Scripts]
      operationId: getScript
      summary: Get a script
      description: |
        Returns the script plus usedBy — the names of every job referencing it,
        the reverse index that makes a shared script's blast radius visible.
      parameters: [{ $ref: '#/components/parameters/scriptName' }]
      responses:
        '200':
          description: The script, with its used-by job list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Script' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /script-content/{name}:
    get:
      tags: [Scripts]
      operationId: getScriptContent
      summary: Get a script's resolved body
      description: |
        Returns the script's body for catalog display. An inline command/script is
        returned from the stored source; a scriptPath is read on demand from the
        synced clone (path-traversal guarded, capped at 1 MiB for display —
        execution and content-hashing are uncapped). A non-UTF8 body returns
        encoding=binary with content null. Read-only, served to any authenticated
        session. 409 when the file cannot be read from the synced repository (e.g.
        not yet synced, renamed, removed).
      parameters: [{ $ref: '#/components/parameters/scriptName' }]
      responses:
        '200':
          description: The resolved script body, with binary/truncation metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScriptContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /script-tags/{name}:
    put:
      tags: [Scripts]
      operationId: updateScriptTags
      summary: Set a script's tags (SQLite-only, operator-authored)
      description: |
        Replaces the script's user-authored tag set (scripts-tags.md). Tags live
        ONLY in Cronomicon's DB — they are not parsed from or published to Git, and
        they survive syncs. This is the sole write surface on the otherwise
        read-only Scripts catalog. The gate is session + CSRF only (any
        authenticated user); no role permission is required. Tags are normalized
        server-side: trimmed, blanks dropped, de-duplicated case-insensitively,
        and capped (≤30 tags, ≤64 chars each) — a violation is 422.
      parameters:
        - { $ref: '#/components/parameters/scriptName' }
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: The updated script (with its normalized tags).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Script' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /job-tags/{jobId}:
    put:
      tags: [Jobs]
      operationId: updateJobTags
      summary: Set a job's tags (SQLite-only, operator-authored)
      description: |
        Replaces the job's user-authored tag set (tags-support.md D6). Tags live
        ONLY in Cronomicon's DB — they are no longer sourced from YAML spec.tags and
        survive Git syncs. The job is addressed by integer id, so the write is
        source-agnostic. The gate is session + CSRF only (any authenticated user);
        no role permission is required. Tags are normalized server-side: trimmed,
        blanks dropped, de-duplicated case-insensitively, and capped (≤30 tags,
        ≤64 chars each) — a violation is 422.
      parameters:
        - { $ref: '#/components/parameters/jobId' }
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: The updated job (with its normalized tags).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /job-annotation/{jobId}:
    put:
      tags: [Jobs]
      operationId: updateJobAnnotation
      summary: Set a job's operator annotation (SQLite-only, operator-authored)
      description: |
        Replaces the job's annotation — criticality, contact and notes (AN,
        migration 1060). Like tags these live ONLY in Cronomicon's DB, are never
        parsed from or written back to Git, and survive syncs. They are distinct
        from `description`, which is Git-owned and overwritten on every sync: the
        two coexist and neither writes the other. The job is addressed by integer
        id, so the write is source-agnostic. The gate is session + CSRF only (any
        authenticated user); no role permission is required.

        Writing all three fields empty DELETES the annotation rather than storing
        a blank one, so an absent annotation and an empty one stay
        indistinguishable. A recycle-binned job may still be annotated — the same
        exemption tags have — because the bin keeps its annotation and a restore
        brings it back. `notesBy`/`notesAt` are server-assigned; anything sent for
        them is ignored.
      parameters:
        - { $ref: '#/components/parameters/jobId' }
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnotationWrite' }
      responses:
        '200':
          description: The updated job, carrying its annotation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400':
          description: |
            A cap was exceeded (`invalid_annotation`): contact >256 chars or
            notes >4096. Enforced server-side — the UI's maxLength is a courtesy,
            not the boundary.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /job-reference-bindings/{jobId}:
    get:
      tags: [Env Vars]
      operationId: getJobReferenceBindings
      summary: List a job's reference bindings
      description: |
        Returns the Env Vars references (Secrets, Variables, SSH Keys) a job
        declares it consumes (vault-integration.md P1.1, D2 = 2B explicit
        binding). At dispatch the resolver injects ONLY these references, so two
        jobs sharing a scope do not see each other's secrets. Each binding carries
        the BARE row name plus the derived CRONOMICON_<SECTION>_<name> reference.
      parameters: [{ $ref: '#/components/parameters/jobId' }]
      responses:
        '200':
          description: The job's declared reference bindings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceBindingList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Env Vars]
      operationId: setJobReferenceBindings
      summary: Set a job's reference bindings (full replace)
      description: |
        Replaces the job's declared reference-binding set. A binding is a
        least-privilege access control over secrets, so the gate is ManageEnvVars
        (+ CSRF), not the any-user tags gate. Each binding's name must be a POSIX
        identifier (the derived-reference charset) and secret names may not be a
        reserved KEK name — a violation is 422.
      parameters:
        - { $ref: '#/components/parameters/jobId' }
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenceBindingWrite' }
      responses:
        '200':
          description: The job's stored reference bindings after the replace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceBindingList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /script-reference-bindings/{name}:
    get:
      tags: [Env Vars]
      operationId: getScriptReferenceBindings
      summary: List a script's reference bindings
      description: |
        Returns the Env Vars references a script declares it consumes
        (vault-integration.md P1.1). Scripts are keyed by name only. Same shape as
        the job bindings endpoint.
      parameters: [{ $ref: '#/components/parameters/scriptName' }]
      responses:
        '200':
          description: The script's declared reference bindings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceBindingList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Env Vars]
      operationId: setScriptReferenceBindings
      summary: Set a script's reference bindings (full replace)
      description: |
        Replaces the script's declared reference-binding set. Gated ManageEnvVars
        (+ CSRF); validation as for the job endpoint.
      parameters:
        - { $ref: '#/components/parameters/scriptName' }
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenceBindingWrite' }
      responses:
        '200':
          description: The script's stored reference bindings after the replace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceBindingList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /script-reference-scan/{name}:
    get:
      tags: [Env Vars]
      operationId: scanScriptReferences
      summary: Scan a script body for reference bindings
      description: |
        Scans a script's body and returns the reference bindings it declares in
        derived form (`suggested`), plus a bare-name lint (`bareReferences`):
        reference sites still using a bare name that matches a known Env Vars row,
        which an operator should migrate to the derived CRONOMICON_<SECTION>_<name>
        form. The reserved prefix is what makes discovery precise (namespace plan
        W5 → this plan's D2). Suggestions prefill a script's binding set.
      parameters: [{ $ref: '#/components/parameters/scriptName' }]
      responses:
        '200':
          description: Suggested bindings and bare-name lint findings.
          content:
            application/json:
              schema:
                type: object
                required: [suggested, bareReferences]
                properties:
                  suggested:
                    type: array
                    items: { $ref: '#/components/schemas/ReferenceBinding' }
                  bareReferences:
                    type: array
                    items: { $ref: '#/components/schemas/ReferenceBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The script's body could not be read from the synced repo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /runs/{traceId}/references:
    get:
      tags: [Executions]
      operationId: getRunReferences
      summary: List the reference bindings a run injects
      description: |
        Returns the Env Vars references (Secrets, Variables, SSH Keys) a run
        injects, derived from its job's and referenced script's declared bindings
        (vault-integration.md P1.8). Names + kind + derived reference only, NEVER
        values — so run detail can show WHICH references a run received without
        exposing their contents. Scope-guarded like the run detail (FR-H2).
      parameters: [{ $ref: '#/components/parameters/traceId' }]
      responses:
        '200':
          description: The references the run injects.
          content:
            application/json:
              schema:
                type: object
                required: [references]
                properties:
                  references:
                    type: array
                    items: { $ref: '#/components/schemas/ReferenceBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /references/validate:
    post:
      tags: [Env Vars]
      operationId: validateReferences
      summary: Validate reference bindings against a scope (authoring-time)
      description: |
        Answers, BEFORE a run is triggered, the question dispatch answers vaguely:
        would each declared reference resolve for a run in `scope`? (agencies plan
        T1.1, AG-Q4.) Until this endpoint the only feedback on a bad binding was a
        409 at dispatch whose message deliberately collapses "out of scope" and
        "not found" into one sentence, so a run cannot be used as a cross-scope
        existence oracle (M2).

        That oracle rule is about RUNS. Here it is replaced by a tighter one: the
        response reveals NOTHING the caller's own `GET /env-vars` / `GET
        /env-secrets` would not already show them. Both lists are scope-filtered
        per actor, so precision degrades ROW BY ROW — a row in a scope the caller
        may not read is never named, and its existence collapses back into
        `not_found`. `scope` itself must be readable by the caller (else 403).

        Session-gated rather than ManageEnvVars: the verdict is bounded by the
        caller's own visibility, and the chips must render for the read-only
        operators who look at job detail. CSRF-gated despite being read-only, so a
        cross-origin page cannot probe names on a live session. It is a POST
        because the payload is a binding SET — a job resolves every chip in one
        round-trip and the Run dialog re-resolves the set on every scope override.

        Values are NEVER returned; SSH keys carry no scope column, so a key verdict
        is pure existence and `resolvedScope` is always null for them.
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenceValidateRequest' }
      responses:
        '200':
          description: One verdict per submitted reference, in request order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceValidateResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /reference-usage:
    get:
      tags: [Env Vars]
      operationId: getReferenceUsage
      summary: Count the jobs and scripts that bind each reference
      description: |
        Returns, per reference (kind + bare name), how many jobs and scripts
        declare a binding to it (agencies plan T1.9), so an admin can see what an
        Env Vars row is actually wired into before editing its scope. Counts only
        — never values, and never WHICH job. Job counts are scope-filtered to the
        caller's grants; script bindings carry no scope (scripts are a single
        shared catalog) and are counted for every session, matching the existing
        `GET /script-reference-bindings` read gate. References nothing binds are
        absent from the list rather than reported as zero.
      responses:
        '200':
          description: Binding counts per reference.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceUsageList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /runner-tags/{runnerId}:
    put:
      tags: [Runners]
      operationId: updateRunnerTags
      summary: Set a runner's tags (SQLite-only, operator-authored)
      description: |
        Replaces the runner's operator-authored tag set (migration 580). Runners
        are self-registered agents (not a Git catalog), so tags are plain SQLite
        metadata with no sync concern. The gate is ConfigureApp + CSRF, matching
        the sibling runner↔agency membership write. Tags are normalized
        server-side: trimmed, blanks dropped, de-duplicated case-insensitively,
        and capped (≤30 tags, ≤64 chars each) — a violation is 422.
      parameters:
        - { $ref: '#/components/parameters/runnerId' }
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: The runner id, name, and its normalized tags.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  tags: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /workflow-tags/{workflowId}:
    put:
      tags: [Workflows]
      operationId: updateWorkflowTags
      summary: Set a workflow's tags (SQLite-only, operator-authored)
      description: |
        Replaces the workflow's user-authored tag set (tags-support.md). Tags live
        ONLY in Cronomicon's DB — never parsed from Git — and survive syncs. The
        workflow is addressed by integer id, so the write is source-agnostic. The
        gate is session + CSRF only (any authenticated user); no role permission is
        required. Tags are normalized server-side: trimmed, blanks dropped,
        de-duplicated case-insensitively, and capped (≤30 tags, ≤64 chars each) —
        a violation is 422.
      parameters:
        - { $ref: '#/components/parameters/workflowId' }
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: The updated workflow (with its normalized tags).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /workflow-annotation/{workflowId}:
    put:
      tags: [Workflows]
      operationId: updateWorkflowAnnotation
      summary: Set a workflow's operator annotation (SQLite-only, operator-authored)
      description: |
        The workflow twin of PUT /job-annotation/{jobId} — identical semantics,
        identical gate, identical caps. See that operation for the full rules.
      parameters:
        - { $ref: '#/components/parameters/workflowId' }
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnotationWrite' }
      responses:
        '200':
          description: The updated workflow, carrying its annotation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '400':
          description: |
            A cap was exceeded (`invalid_annotation`): contact >256 chars or
            notes >4096.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /schedule-tags/{name}:
    put:
      tags: [Schedules]
      operationId: updateScheduleTags
      summary: Set a schedule's tags (SQLite-only, operator-authored)
      description: |
        Replaces a first-class schedule's user-authored tag set (tags-support.md).
        Tags live ONLY in Cronomicon's DB — never parsed from Git — and survive syncs.
        Keyed by (source, name): a git and an amadeus schedule may share a name, so
        ?source (default git) disambiguates. The gate is session + CSRF only (any
        authenticated user); no role permission is required. Tags are normalized
        server-side: trimmed, blanks dropped, de-duplicated case-insensitively, and
        capped (≤30 tags, ≤64 chars each) — a violation is 422.
      parameters:
        - { $ref: '#/components/parameters/scheduleDefName' }
        - { name: source, in: query, description: Schedule origin (default git)., schema: { type: string, enum: [git, amadeus] } }
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: The updated schedule (with its normalized tags).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  # ── Schedule definitions (first-class Schedules, A10a) ──────────────────────
  /schedule-defs:
    get:
      tags: [Schedules]
      operationId: listScheduleDefs
      summary: List first-class schedules
      description: |
        First-class Schedules (A10a) are standalone named crons (+ optional env)
        parsed from schedules/*.yaml and cached read-only; jobs/workflows reference
        one via scheduleRefs, expanded into the runtime schedule cache at sync. This
        is a DISTINCT resource from GET /schedules (the per-binding owner
        projection). source ∈ {git, amadeus}; git rows are Git-authored, amadeus
        rows are operator-authored (Phase 3+). Each row carries usedByCount.
      parameters:
        - { name: source, in: query, description: Filter by origin., schema: { type: string, enum: [git, amadeus] } }
        - { name: q, in: query, description: Free-text search on name., schema: { type: string } }
        - { $ref: '#/components/parameters/tagFilter' }
        - { $ref: '#/components/parameters/tagMatch' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
      responses:
        '200':
          description: Paginated schedule list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Schedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Schedules]
      operationId: createScheduleDef
      summary: Author an amadeus-source schedule (schedule-builder)
      description: |
        Creates an in-app (source='amadeus') first-class Schedule — a named cron (+
        optional plaintext env) authored without a Git round-trip. Requires the
        Compose capability (Admin-only in v20). Git-source schedules are read-only
        here; they are authored through the Git publish flow.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '201':
          description: The created schedule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /schedule-defs/{name}:
    get:
      tags: [Schedules]
      operationId: getScheduleDef
      summary: Get a first-class schedule
      description: |
        Returns the schedule plus usedBy — the jobs/workflows referencing it
        (the reverse index). Optional ?source selects the origin (default git).
      parameters:
        - { $ref: '#/components/parameters/scheduleDefName' }
        - { name: source, in: query, schema: { type: string, enum: [git, amadeus] } }
      responses:
        '200':
          description: The schedule, with its used-by list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Schedules]
      operationId: updateScheduleDef
      summary: Edit an amadeus-source schedule (schedule-builder)
      description: |
        Edits an in-app schedule and PROPAGATES the new cron/env to every job and
        workflow that referenced it — so the change actually takes effect, not just in
        the catalog (the scheduleRefs snapshot is updated by source_ref). Git-source
        schedules are read-only here (409). Requires Compose.
      parameters: [{ $ref: '#/components/parameters/scheduleDefName' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '200':
          description: The updated schedule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Schedules]
      operationId: deleteScheduleDef
      summary: Delete an amadeus-source schedule (schedule-builder)
      description: |
        Deletes an in-app schedule. Blocked with 409 when still referenced unless
        ?force=true, which also detaches the expanded entries from referencing
        definitions (resyncing their legacy schedule mirror). Git-source schedules are
        read-only here (409). Requires Compose.
      parameters:
        - { $ref: '#/components/parameters/scheduleDefName' }
        - { name: force, in: query, description: Delete even when referenced; detaches the expansions and resyncs the legacy mirror., schema: { type: boolean } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ── Workflows ──────────────────────────────────────────────────────────────
  /workflows:
    get:
      tags: [Workflows]
      operationId: listWorkflows
      summary: List workflows
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/tagFilter' }
        - { $ref: '#/components/parameters/tagMatch' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
      responses:
        '200':
          description: Paginated workflow list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Workflows]
      operationId: createWorkflow
      summary: Compose an amadeus-source workflow (A11)
      description: |
        Creates an in-app (source='amadeus') workflow — a DB-authored step graph
        over jobs — with no Git round-trip. Requires the Compose capability
        (Admin-only in v20). Steps resolve their jobs via the A11 source precedence
        (per-step jobSource > the workflow's source > fallback).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowComposeInput' }
      responses:
        '201':
          description: The created workflow.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /workflows/validate:
    post:
      tags: [Workflows]
      operationId: validateWorkflow
      summary: Dry-run validate a workflow step graph (WB-A1)
      description: |
        Validates a workflow's step graph — structural/enum shape (WB-S5), the
        same-path duplicate-name guard, and job-existence — WITHOUT persisting,
        returning structured {ok, errors[]} so the editor can surface inline
        feedback before committing a write. Requires the Compose capability.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowComposeInput' }
      responses:
        '200':
          description: Validation result (always 200 on a well-formed body; inspect `ok`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowValidationResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /workflows/{workflowId}:
    get:
      tags: [Workflows]
      operationId: getWorkflow
      summary: Get a workflow
      parameters: [{ $ref: '#/components/parameters/workflowId' }]
      responses:
        '200':
          description: The workflow with its step graph.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Workflows]
      operationId: patchWorkflow
      summary: Enable / disable a workflow (per-instance override)
      description: |
        The only mutable field is `disabled` — the documented exception to
        Git-canonicality (§2.4 disabledWfs). All other workflow edits go
        through Git. CSRF required.
      parameters: [{ $ref: '#/components/parameters/workflowId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                disabled: { type: boolean }
      responses:
        '200':
          description: Updated workflow.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Workflows]
      operationId: updateWorkflow
      summary: Edit an amadeus-source workflow (A11)
      description: Edits an in-app workflow's step graph + schedules. Git-source workflows are read-only here (409). Requires Compose.
      parameters: [{ $ref: '#/components/parameters/workflowId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowComposeInput' }
      responses:
        '200':
          description: The updated workflow.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Workflows]
      operationId: deleteWorkflow
      summary: Delete an amadeus-source workflow (A11)
      description: |
        Deletes an in-app workflow (cascades its schedule bindings). Git-source
        workflows are read-only here (409). Requires Compose.

        Also 409s while any reaction WATCHES this workflow (RX-24) with code
        `reactions_watching`, listing them, unless ?force=true — the same rule,
        and the same reason, as the job route above.
      parameters:
        - { $ref: '#/components/parameters/workflowId' }
        - { $ref: '#/components/parameters/csrf' }
        - { name: force, in: query, description: 'Delete even while reactions watch it, leaving those reactions dangling.', schema: { type: boolean } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workflows/{workflowId}/trigger:
    post:
      tags: [Workflows]
      operationId: triggerWorkflow
      summary: Trigger a workflow run
      description: |
        Starts a workflow run; backend mints the workflow trace ID and the
        per-step run trace IDs (S11). Constituent runs link to the workflow run
        via a real FK, not string convention (S3). CSRF required.
      parameters: [{ $ref: '#/components/parameters/workflowId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                runAt:
                  type: [string, 'null']
                  format: date-time
                  description: AR — defer this workflow run to an RFC3339 instant (see runJob.runAt). A deferred trigger answers 202 with a PendingRun.
      responses:
        '202':
          description: Workflow run started (or, with runAt, a PendingRun was parked).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Workflow is disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pending-runs/{id}:
    delete:
      tags: [Runs]
      operationId: cancelPendingRun
      summary: Cancel a deferred ad-hoc run
      description: |
        AR — deletes a pending (not-yet-fired) deferred run. Session + CSRF —
        the same gate as triggering: scheduling state created through the run
        door is cancellable through the run door. Restricted actors may only
        cancel pending runs whose owner scope they can read (SU-2). 404 when
        the run already fired, was cancelled, or never existed; the
        promote/cancel race resolves to whoever acts first.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/csrf' }
      responses:
        '204': { description: Cancelled. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workflow-runs:
    get:
      tags: [Runs]
      operationId: listWorkflowRuns
      summary: List workflow run history
      parameters:
        - { name: workflowUid, in: query, schema: { type: string }, description: "R2-1 — filter by the workflow's permanent identity. Outranks both alternatives: unlike workflowName it cannot come to mean two workflows once per-agency naming lands, and unlike workflowId it is never reused." }
        - { name: workflowId, in: query, schema: { type: integer }, description: "Filter by the workflow rowid (legacy; prefer workflowUid)." }
        - { name: workflowName, in: query, schema: { type: string }, description: "WB-D2 — filter by the stable workflow name (survives rename/recreate); pair with workflowSource to disambiguate." }
        - { name: workflowSource, in: query, schema: { type: string, enum: [git, amadeus] }, description: "WB-D2 — narrows workflowName to one source." }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RunStatus' }, description: "Filters on the DISPLAY status each item carries, not the raw column: 'cancelled' selects soft-cancelled runs (the flag from migration 260) and every other value excludes them; 'danger' covers failure/killed; 'running' also returns queued, matching the console's one-word fold." }
        - name: calendar
          in: query
          description: |
            CAL — return only fires suppressed by this working calendar; pass "*"
            for any calendar suppression. Matches the structured
            suppressedByCalendar column, never the reason text, so "every run
            suppressed by federal-holidays this fiscal year" cannot be broken by
            a copy edit to the message.
          schema: { type: string }
        - name: triggerKind
          in: query
          description: RX — filter by how the workflow run was caused.
          schema: { type: string, enum: [manual, scheduled, webhook, reaction] }
        - name: reactedTo
          in: query
          description: |
            RX — the reverse because-of link: workflow runs CAUSED BY this run id.
            The jobs side is the same parameter on /runs; ask both, since a
            reaction can fire either kind.
          schema: { type: string }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - name: sort
          in: query
          description: Sort column (TS-20; see /runs sort). Omitted ⇒ created_at DESC.
          schema: { type: string, enum: [workflow, schedule, started, completed, user, duration, status] }
        - { $ref: '#/components/parameters/sortOrder' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
      responses:
        '200':
          description: Paginated workflow runs (90-day retention per A4).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/WorkflowRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workflow-runs/{traceId}:
    get:
      tags: [Runs]
      operationId: getWorkflowRun
      summary: Get a workflow run with step details
      parameters: [{ $ref: '#/components/parameters/traceId' }]
      responses:
        '200':
          description: Workflow run including hierarchical step details and context snapshots.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRunDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workflows/runs/{traceId}/cancel:
    post:
      tags: [Workflows]
      operationId: cancelWorkflowRun
      summary: Soft-cancel a running workflow run (WB-S2)
      description: |
        Stops dispatching further steps, marks not-started (queued) child runs
        'skipped', lets in-flight child runs finish (no runner kill), and ends the
        run as cancelled (display status 'cancelled'). Idempotent for a running run;
        409 if the run already finished or was cancelled. CSRF required.
      parameters: [{ $ref: '#/components/parameters/traceId' }, { $ref: '#/components/parameters/csrf' }]
      responses:
        '202': { description: Cancellation accepted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ── Reactions ────────────────────────────────────────────────────────────────
  /reactions:
    get:
      tags: [Schedules]
      operationId: listReactions
      summary: List every reaction (the cross-entity edge list)
      description: |
        RX — a reaction says "when the named upstream definition finishes with
        `onOutcome`, run me". It is a fourth trigger kind alongside cron,
        interval and one-shot, and the only one whose event is another
        definition finishing rather than an instant arriving.

        A reaction is EDGE-TRIGGERED: it is not a latch, does not accumulate,
        and cannot be inspected as "currently waiting", because it never waits.
        A newly created reaction fires on the NEXT matching completion and never
        retroactively on the most recent historical one.

        This endpoint is the whole graph, which the run-graph view needs because
        reactions make the coupling implicit — Upcoming cannot project a
        reaction, since a reaction has no instant.
      responses:
        '200':
          description: Every reaction, dangling upstreams flagged.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reactions/{ownerKind}/{ownerName}:
    get:
      tags: [Schedules]
      operationId: getDefinitionReactions
      summary: List one definition's reactions
      parameters:
        - { $ref: '#/components/parameters/reactionOwnerKind' }
        - { $ref: '#/components/parameters/reactionOwnerName' }
      responses:
        '200':
          description: This definition's reactions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Schedules]
      operationId: replaceDefinitionReactions
      summary: Replace a definition's reactions
      description: |
        Wholesale replacement — an empty list clears them. Admin-gated
        (ConfigureApp), the same gate as schedule-defs and calendars: a reaction
        is a standing instruction to run something and, unlike a schedule, has
        no visible clock.

        Validation refuses, with the offending reaction named: self-reference,
        an unknown upstream, an `onOutcome` outside the enum, a cycle (with the
        full path listed), and an upstream the author cannot read. That last one
        is not incidental — without it a low-privilege author could bind to a
        high-privilege job and read fire timing as a covert channel for "did the
        quarterly close succeed?". Note the readability check exists on this
        path only: Git sync has no author identity to check, which is a stated
        trust boundary (repo write access already dominates the channel).

        Reactions authored here are `amadeus`-source and are never touched by a
        Git sync, which replaces only its own source's rows.
      parameters:
        - { $ref: '#/components/parameters/reactionOwnerKind' }
        - { $ref: '#/components/parameters/reactionOwnerName' }
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reactions:
                  type: array
                  items: { $ref: '#/components/schemas/ReactionInput' }
      responses:
        '200':
          description: The definition's reactions after the replace.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The definition is git-source. Its reactions are authored in Git
            (`spec.reactions`) — an in-app write would be replaced by the next
            sync, since a sync replaces a definition's git-source reactions
            wholesale so that it can never wipe an operator's in-app rows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            A validation refusal, naming the reaction and the rule it broke.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reactions/{ownerKind}/{ownerName}/{name}:
    delete:
      tags: [Schedules]
      operationId: deleteReaction
      summary: Delete one reaction
      parameters:
        - { $ref: '#/components/parameters/reactionOwnerKind' }
        - { $ref: '#/components/parameters/reactionOwnerName' }
        - name: name
          in: path
          required: true
          description: The reaction's entry name.
          schema: { type: string }
        - { $ref: '#/components/parameters/csrf' }
      responses:
        '204': { description: Reaction deleted. }
        '400': { description: ownerKind was not job or workflow. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The definition is git-source; its reactions are authored in Git.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Working calendars ────────────────────────────────────────────────────────
  /calendars:
    get:
      tags: [Schedules]
      operationId: listCalendars
      summary: List working calendars
      description: |
        A calendar (CAL) is a named set of wall-clock dates — federal holidays, a
        change-freeze period, a fiscal-close run-day list. Schedule ENTRIES bind
        calendars in two polarities (skipCalendars / onlyCalendars) and the
        scheduler suppresses matching fires, recording each suppression in History.

        Cronomicon ships NO holiday content: operators author their own dates and own
        them end to end. The consequence is that a calendar which runs out of days
        silently stops suppressing, so each row carries lastDay/daysRemaining and
        the response carries the warning threshold.

        Reads are session-only; every write route is admin-only.
      responses:
        '200':
          description: All calendars, with coverage summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Calendar' }
                  expiryWarningDays:
                    type: integer
                    description: Days of remaining coverage below which a calendar should be flagged as expiring.
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Schedules]
      operationId: createCalendar
      summary: Create a working calendar
      description: |
        Admin-only, the same gate as schedule authoring and for the same class of
        reason: whoever can edit a calendar can lift a change freeze, or — with a
        global calendar covering today — halt every scheduled fire.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /calendars/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [Schedules]
      operationId: getCalendar
      summary: Get one calendar with its days
      responses:
        '200':
          description: The calendar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Schedules]
      operationId: updateCalendar
      summary: Update a calendar's metadata and flags
      description: |
        Days are NOT touched here — use PUT /calendars/{name}/days — so a metadata
        edit cannot silently wipe a year of dates by omitting the field.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Schedules]
      operationId: deleteCalendar
      summary: Delete a calendar
      description: |
        409 while any schedule entry still binds it, unless ?force=true. Forcing
        leaves dangling names, which fail toward each polarity's authored intent:
        a dangling skip binding FIRES (a visible, correctable policy violation)
        and a dangling only binding NEVER FIRES (silence).
      parameters:
        - { name: force, in: query, description: Delete even while bound, leaving the bindings dangling., schema: { type: boolean } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /calendars/{name}/days:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      tags: [Schedules]
      operationId: replaceCalendarDays
      summary: Replace a calendar's day list
      description: |
        Wholesale replacement, because the authoring gesture is "here is next
        year's list". Days are validated as real YYYY-MM-DD dates, de-duplicated
        and stored sorted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days:
                  type: array
                  items: { $ref: '#/components/schemas/CalendarDay' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  # ── Schedules (inventory + projected upcoming runs) ──────────────────────────
  /schedules:
    get:
      tags: [Schedules]
      operationId: listSchedules
      summary: Schedule inventory
      description: |
        One row per named schedule entry across all jobs and workflows, with
        enabled/paused state and next/last run times. Cron evaluates in the
        server's time zone; nextRunAt/lastRunAt are absolute RFC3339 instants.
      responses:
        '200':
          description: All schedule entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ScheduleEntryStatus' }
                  calendarRollup:
                    type: object
                    additionalProperties: { type: string }
                    description: |
                      CAL-12 — per-definition calendar summary, keyed
                      "kind:source:name". Entries that agree collapse to the bare
                      calendar names; entries that disagree render
                      "federal-holidays (2 of 3 entries)". This is the single-place
                      answer to "does job X run on holidays?", which entry-level
                      binding otherwise costs. Restricted actors see only the
                      definitions they may read.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /schedules/upcoming:
    get:
      tags: [Schedules]
      operationId: listUpcomingSchedules
      summary: Projected upcoming schedule fires
      description: |
        Flattened, soonest-first projection of every enabled, unpaused schedule
        entry's fire times within the window. Capped; paused/disabled
        definitions are excluded.
      parameters:
        - name: window
          in: query
          description: Projection horizon.
          schema: { type: string, enum: [24h, 7d], default: 24h }
      responses:
        '200':
          description: Upcoming fires, ascending by time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  window: { type: string, enum: [24h, 7d] }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ScheduleUpcoming' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Runs / History ─────────────────────────────────────────────────────────
  /runs:
    get:
      tags: [Runs]
      operationId: listRuns
      summary: List run history
      description: Execution history (HIST). 90-day retention per A4, configurable.
      parameters:
        - { name: job, in: query, description: "Filter by job NAME. Kept forever, and honest about what it is: once per-agency naming lands (AF-4b), a name can belong to more than one job and this returns every one of them. Prefer jobUid to mean one job.", schema: { type: string } }
        - name: jobUid
          in: query
          description: |
            R2-1 — filter by the job's permanent identity (the `uid` every job
            has carried since AF-4a), frozen onto each run at enqueue. This is
            the filter that keeps meaning exactly one job after names may
            repeat across agencies. Composes with `job` rather than replacing
            it.
          schema: { type: string }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/RunType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RunStatus' } }
        - { name: kind, in: query, description: Filter by run kind (job | ssh-test)., schema: { type: string, enum: [job, ssh-test] } }
        - name: calendar
          in: query
          description: |
            CAL — return only fires suppressed by this working calendar; pass "*"
            for any calendar suppression. Matches the structured
            suppressedByCalendar column, never the reason text, so "every run
            suppressed by federal-holidays this fiscal year" cannot be broken by
            a copy edit to the message.
          schema: { type: string }
        - { name: manual, in: query, schema: { type: boolean } }
        - name: triggerKind
          in: query
          description: |
            RX — filter by how the run was caused. `reaction` is History's answer
            to "show me everything a cascade produced".
          schema: { type: string, enum: [manual, scheduled, workflow, webhook, reaction] }
        - name: reactedTo
          in: query
          description: |
            RX — the reverse because-of link: return only runs CAUSED BY this run
            id. Ask /workflow-runs the same question, since a reaction can fire
            either kind.
          schema: { type: string }
        - name: trace
          in: query
          description: |
            RX — pivot to ONE run by trace id. The forward because-of link needs
            somewhere to go: naming a run's cause without being able to open it
            makes an operator copy an id into a search box mid-incident.
          schema: { type: string }
        - name: stopped
          in: query
          description: |
            RX-22 — filter on whether a human stopped the run (`killedBy IS NOT
            NULL`), orthogonal to status. Composes with `status` rather than
            being folded into it, so `?status=success&stopped=true` returns runs
            an operator stopped and recorded as a success — the state kill
            dispositions create, and one status alone cannot express.
          schema: { type: boolean }
        - { name: user, in: query, schema: { type: string } }
        - { name: runnerId, in: query, description: Filter by the runner (UUID) that executed the run., schema: { type: string } }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - name: sort
          in: query
          description: >-
            Sort column (TS-20). Unknown keys are a 400. Omitted ⇒ created_at
            DESC (unchanged default). Ordering is applied before pagination,
            with a created_at/id tiebreak so pages never shear.
          schema: { type: string, enum: [job, type, executor, schedule, started, completed, user, duration, status] }
        - { $ref: '#/components/parameters/sortOrder' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
      responses:
        '200':
          description: Paginated run history.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /runs/{traceId}:
    get:
      tags: [Runs]
      operationId: getRun
      summary: Get a run
      parameters: [{ $ref: '#/components/parameters/traceId' }]
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{traceId}/manifest:
    get:
      tags: [Runs, Runners]
      operationId: getRunManifest
      summary: Fetch the execution manifest for a claimed run (R1.2, D2)
      description: |
        Runner-only endpoint (bearer auth, T9). Fetched right after the runner
        claims a run via /poll. The manifest carries everything the agent needs
        to execute — the resolved command (interpreter + body), the run's env
        snapshot, and the target host references — resolved through the same
        source of truth the in-app SSH executor uses, so the two paths can't
        drift.

        Credential model b (D1): host *references only*. The manifest never
        carries decrypted private-key bytes; authKeyEnvVar is the NAME of the
        env var holding the key, which the agent resolves locally against its
        own credentials.

        Inventory canonicality (D8): when the owning runner registered with
        inventory=amadeus, targets is fully resolved (scope_hosts→ssh_hosts);
        when inventory=local, targets is empty and the agent resolves hosts in
        scope against its own inventory (network-isolated segments).

        Authorization (R1.4): the calling runner must own the run
        (run.runner_id == caller runner id); a non-owning runner gets 404.
      security:
        - runnerBearer: []
      parameters: [{ $ref: '#/components/parameters/traceId' }]
      responses:
        '200':
          description: The execution manifest.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManifestResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Run is not a claimed, running runner run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /runs/{traceId}/log:
    get:
      tags: [Runs]
      operationId: getRunLog
      summary: Fetch the (redacted) run log
      description: |
        Operator-facing log read. What Cronomicon persisted is what is served —
        redaction happens unconditionally at ingest (T7/S7), so the UI never
        sees unredacted secret values.

        With the S3 archive backend (SL-3, the s3-logging plan) a
        log whose local file has been reaped is served from the bucket
        THROUGH this endpoint — same body, same `X-Log-Offset` — never by
        redirect: the bucket stays off the browser and the read works wherever
        the server can reach it. Only a sealed log is ever archived, so the
        live-tail contract below is unaffected.
      parameters:
        - { $ref: '#/components/parameters/traceId' }
        - name: offset
          in: query
          required: false
          description: |
            Byte offset to read from (EP-8a). Serves the log from this byte to
            the end, for live tailing of a running job: poll with the
            `X-Log-Offset` value the previous response returned and receive only
            what was appended since. Safe because the log file is append-only
            with stable offsets — redaction happens at ingest (T7/S7), before
            the write, so a byte once written is never rewritten.

            Omitted or `0` returns the whole log, identical to the pre-EP-8a
            response. An offset at or past the end of the file is **not** an
            error: it returns 200 with an empty body and the current
            `X-Log-Offset`, so a client whose bookmark outlived a reaped or
            rotated log can notice and restart from 0 instead of wedging.
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: |
            Log content from `offset` (default 0) to the end of the file.
          headers:
            X-Log-Offset:
              description: |
                Byte offset of the end of the file as measured when this
                response was produced — i.e. where the next poll should resume.
                Measured before the body is written, so it never covers bytes
                the client did not receive.
              schema: { type: integer, format: int64, minimum: 0 }
          content:
            text/plain:
              schema: { type: string }
        '400':
          description: |
            Malformed trace id (`invalid_trace_id`). The id becomes a log-file
            name, so path separators, `..`, a leading `.`, anything over 64
            characters, or any character outside `[A-Za-z0-9._-]` is rejected
            before the filesystem is touched (LU-12).

            Or a malformed `offset` (`invalid_offset`) — anything that is not a
            non-negative integer. Rejected rather than coerced to 0: silently
            re-serving the whole file would give a tailing client no signal that
            its bookmark was never understood.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: |
            `log_archive_unavailable` — the run's log was archived to S3 and
            its local file is gone, but the archive backend is not configured
            (settings blanked after archiving) or the bucket could not be read.
            Not a 404: the log exists and the server knows where.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Runs, Runners]
      operationId: streamRunLog
      summary: Runner log stream ingest (chunked POST, T6)
      description: |
        Runner-only endpoint (bearer auth, T9). The runner opens a single
        long-lived chunked POST when execution starts; the body is
        newline-delimited UTF-8 log lines, closed with a trailing JSON envelope
        line: {"exitCode":0,"durationMs":12435,"endedAt":"2026-06-09T14:22:01Z"}.
        On transient connection loss the runner retries with X-Resume-Offset;
        Cronomicon appends idempotently from that byte offset. Redaction is
        performed by Cronomicon on ingest (T7). Exhausting the retry budget marks
        the run danger with reason log_stream_lost.
      security:
        - runnerBearer: []
      parameters:
        - { $ref: '#/components/parameters/traceId' }
        - name: X-Resume-Offset
          in: header
          required: false
          description: Byte offset to resume appending from after a transient connection loss.
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Newline-delimited UTF-8 log lines + trailing JSON envelope line.
      responses:
        '204':
          description: Stream accepted and fully persisted.
        '400':
          description: |
            Malformed trace id (`invalid_trace_id`). The id becomes a log-file
            name, so path separators, `..`, a leading `.`, anything over 64
            characters, or any character outside `[A-Za-z0-9._-]` is rejected
            before the filesystem is touched (LU-12).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: X-Resume-Offset does not match the persisted byte count.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      persistedOffset:
                        type: integer
                        description: Current persisted byte count; runner should resume from here.

  # ── Activity feed ──────────────────────────────────────────────────────────
  /activity:
    get:
      tags: [Activity]
      operationId: listActivity
      summary: List activity feed entries
      description: |
        Discriminated-union event feed (run-start/run-end/workflow-start/
        workflow-end/config/gitsync/push). UI shows a 72h window; the API
        serves up to the 90-day retention (A4).
      parameters:
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/ActivityKind' }
        - { name: actor, in: query, schema: { type: string } }
        - name: runner
          in: query
          description: |
            Exact match on `runnerName`. Independent of `actor`: the UI sends
            one or the other (its actor picker is a single choice), but both
            set is not an error — both must then match.
          schema: { type: string }
        - { name: scope, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
      responses:
        '200':
          description: Paginated activity entries, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ActivityEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Change Log / Audit ─────────────────────────────────────────────────────
  /activity/actors:
    get:
      tags: [Activity]
      operationId: listActivityActors
      summary: Distinct actors appearing in the activity feed
      description: |
        The option list for the feed's actor filter, classified server-side so
        no client grows its own copy of the rules.

        Window-scoped on purpose (AA-Q5): it takes the same `from`/`to` as
        `GET /activity` and reports only actors seen in that window, so the
        picker offers the population the feed is actually showing and widening
        the window widens the list. A global distinct over the full 90-day
        retention would list every runner that ever polled.

        `users` are actors that look like an identity (contain `@`), `runners`
        are distinct non-null `runnerName` values, and `system` is everything
        else — the fixed vocabulary (`system`, `scheduler`, `ssh-executor`, and
        `operator` on rows written before the actor was recorded).
      parameters:
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
      responses:
        '200':
          description: Distinct actors within the window, each group sorted case-insensitively.
          content:
            application/json:
              schema:
                type: object
                required: [users, runners, system]
                properties:
                  users:   { type: array, items: { type: string } }
                  runners: { type: array, items: { type: string } }
                  system:  { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /change-log:
    get:
      tags: [Change Log]
      operationId: listChangeLog
      summary: List Change Log (config/audit) entries
      description: Audit of in-app actions. 1-year retention per A4. User identity comes from the authenticated session (S6).
      parameters:
        - { name: category, in: query, schema: { type: string }, description: 'e.g. Settings, Env Vars, Jobs, Workflows, Schedule' }
        - { name: user, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - name: sort
          in: query
          description: Sort column (TS-20; see /runs sort). Omitted ⇒ timestamp DESC.
          schema: { type: string, enum: [timestamp, user, category, action, target] }
        - { $ref: '#/components/parameters/sortOrder' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
      responses:
        '200':
          description: Paginated change log.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ChangeLogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /audit/export:
    get:
      tags: [Change Log]
      operationId: exportAudit
      summary: Export audit data (S5)
      description: |
        Honours date-range, event-type filters and CSV/JSON format exactly as
        surfaced in Settings → Audit & Compliance (S5).
      parameters:
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - name: eventTypes
          in: query
          description: |
            Comma-separated event-type filters. Omitted or empty means every type.

            **`authEvents` returns the authentication/authorization trail** — the
            `auth_events` table: `login`, `login-failed`, `logout`, `denied`,
            `csrf-failed`, `dev-auth`, `bootstrap-admin`, `session-revoked`. Before
            v0.52.11 this value was a pure alias for `configChanges`: selecting it
            alone returned every config change and not one auth event. Any saved
            filter or script that relied on the old behaviour must now select
            `configChanges` explicitly. Because an auth event may have no actor
            (a failed login, a CSRF rejection before identity resolves), those rows
            export with the actor `(unauthenticated)`; the machine-readable
            `reason`, the two client addresses and the user agent are folded into
            `details` as `reason=… remoteAddr=… clientIp=… userAgent=…` rather
            than widening the shared row shape (`AuditRow` is a union across four
            dissimilar tables and its CSV header is a stable contract).
          schema:
            type: array
            items:
              type: string
              enum: [executions, activity, configChanges, authEvents, schedulePushes]
          explode: false
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, json]
      responses:
        '200':
          description: Export payload (Content-Disposition attachment).
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /schedule-pushes:
    get:
      tags: [Schedules]
      operationId: listSchedulePushes
      summary: List schedule push audit records
      description: Records of Cronomicon→GitLab pushes. 1-year retention per A4.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [success, failed] } }
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - name: sort
          in: query
          description: Sort column (TS-20; see /runs sort). Omitted ⇒ newest first.
          schema: { type: string, enum: [timestamp, user, file, status] }
        - { $ref: '#/components/parameters/sortOrder' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
      responses:
        '200':
          description: Paginated push audit.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/SchedulePush' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Schedules (publish — A2/D2/D13) ────────────────────────────────────────
  /schedules/publish:
    post:
      tags: [Schedules]
      operationId: publishSchedule
      summary: Publish a schedule edit (or new job YAML) to GitLab
      description: |
        Commits the YAML to main as the bot identity and returns the new commit
        SHA (A2). The If-Match header carries the base_sha the edit was based
        on — REQUIRED (hard contract per A2/D2/D13). On mismatch the server
        rejects with 412 and returns the diff so the UI can show "someone else
        changed this — review and retry." Pushes are serialized server-side
        with a DB row lock (§3.4). The validator enforces apiVersion and the
        YAML schema (T10), returning line-numbered 422 errors. CSRF required.
      parameters:
        - { $ref: '#/components/parameters/csrf' }
        - name: If-Match
          in: header
          required: true
          description: The base_sha (Git commit SHA) the edit was based on.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchedulePublishRequest' }
      responses:
        '201':
          description: Committed to GitLab.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulePush' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412':
          description: base_sha mismatch — file changed since the edit was based.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Validation' }
        '503':
          description: GitLab unreachable — retry later (§11.4 degradation matrix).
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Scopes / Inventories ───────────────────────────────────────────────────
  /scopes:
    get:
      tags: [Scopes]
      operationId: listScopes
      summary: List scopes (inventories)
      description: |
        Git-source scopes are parsed fresh from the clone at sync time
        (pragma + sidecar + inference, S10); Cronomicon-source (local) scopes are
        DB-backed (S8). Capability resolution precedence is local field >
        sidecar > pragma > inference (§9.1). Pragma parse errors are returned
        line-numbered on each scope.
      parameters:
        - name: source
          in: query
          schema: { type: string, enum: [git, amadeus] }
      responses:
        '200':
          description: All scopes with resolved capability.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Scope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Scopes]
      operationId: createScope
      summary: Create a local (Cronomicon-source) scope (S8)
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalScopeInput' }
      responses:
        '201':
          description: Created. Admin role gains access by default; others denied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Scope name already exists (case-insensitive unique).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }

  /scopes/{scopeId}:
    get:
      tags: [Scopes]
      operationId: getScope
      summary: Get a scope
      parameters: [{ $ref: '#/components/parameters/scopeId' }]
      responses:
        '200':
          description: The scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Scopes]
      operationId: updateScope
      summary: Update a local scope (S8/S9)
      description: |
        Only Cronomicon-source scopes are editable (Git scopes are edited in
        GitLab). Rename does NOT cascade to job/workflow/env-var references in
        v1 (S9) — the response includes brokenReferences so the UI can warn.
        supportedTypes enforces a bash floor (S10). CSRF required.
      parameters: [{ $ref: '#/components/parameters/scopeId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalScopeInput' }
      responses:
        '200':
          description: Updated; brokenReferences lists dangling name references after a rename (S9 lint).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Scope'
                  - type: object
                    properties:
                      brokenReferences:
                        type: array
                        items:
                          type: object
                          properties:
                            entity: { type: string, description: 'jobs | workflows | envVars | secrets | schedules' }
                            name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Attempt to edit a Git-source scope, or rename collision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Scopes]
      operationId: deleteScope
      summary: Delete a local scope
      description: |
        Cronomicon-source only. Assumption (W11 open question): deletion is
        rejected with 409 while jobs reference the scope; in-flight runs keep
        their trigger-time resolution. CSRF required.
      parameters: [{ $ref: '#/components/parameters/scopeId' }, { $ref: '#/components/parameters/csrf' }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Scope is Git-source or still referenced by jobs/workflows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /scopes/{scopeId}/inventory:
    get:
      tags: [Scopes]
      operationId: getScopeInventory
      summary: Get a scope's inventory + advisory parsed projection
      description: |
        Returns the scope's inventory and its ADVISORY parsed projection (groups,
        host_vars, group_vars). The projection is best-effort and NON-authoritative
        — execution always uses the raw inventory via `ansible-playbook -i`. When
        the inventory contains a construct outside the supported INI subset,
        parseStatus is `unavailable`, projection is omitted, and parseReason/parseLine
        explain why (the raw inventory still ships unchanged). raw is returned only
        for amadeus-source scopes. Requires the ConfigureApp permission — inventory
        detail can include sensitive non-connection vars under arbitrary keys, so
        the read surface is kept no broader than the privilege that guards mutation.
      parameters: [{ $ref: '#/components/parameters/scopeId' }]
      responses:
        '200':
          description: The scope's inventory document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Scopes]
      operationId: putScopeInventory
      summary: Author/replace an amadeus-source scope's inventory (M5)
      description: |
        Writes a raw inventory to an AMADEUS-source scope (in-app authoring), then
        validates + parses it exactly as git sync does: secret-bearing vars are
        rejected (422 inventory_secret_rejected, line-numbered; the scope is left
        unchanged), the advisory projection + scope_hosts membership are replaced,
        and the run-type capability is inferred (unioned into supportedTypes).
        Git-source scopes are 409 (managed in GitLab). Only `ini` is supported.
        CSRF required.
      parameters: [{ $ref: '#/components/parameters/scopeId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryInput' }
      responses:
        '200':
          description: Inventory written; the updated inventory document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Secret-bearing inventory (code=inventory_secret_rejected, line-numbered) or an unsupported format.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      errors:
                        type: array
                        items: { $ref: '#/components/schemas/LineError' }

  /scopes/{scopeId}/inventory/import-hosts:
    post:
      tags: [Scopes]
      operationId: importScopeHosts
      summary: Import an amadeus scope's inventory hosts into ssh_hosts (M5, cap C)
      description: |
        Materializes an AMADEUS-source scope's parsed inventory hosts into ssh_hosts
        (source=amadeus, scope_id) so the in-app SSH executor can dial them. Keyed by
        (scope_id, hostname): an existing row is updated when overwrite is set, else
        skipped. Git scopes auto-import via sync (409 here). Requires a usable
        (non-degraded) projection. CSRF required.
      parameters: [{ $ref: '#/components/parameters/scopeId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryImportInput' }
      responses:
        '200':
          description: Import result (created/updated/skipped/rejected).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryImportResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /scopes/resync:
    post:
      tags: [Scopes]
      operationId: resyncScopes
      summary: Re-parse inventories from the Git clone
      description: Triggers a re-parse of inventory files + pragmas and returns capability deltas; emits a gitsync activity entry. CSRF required.
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      responses:
        '200':
          description: Sync result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scopesSynced: { type: integer }
                  errors:
                    type: array
                    items: { $ref: '#/components/schemas/LineError' }
                  deltas:
                    type: array
                    items:
                      type: object
                      properties:
                        scope: { type: string }
                        change: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Env Vars ───────────────────────────────────────────────────────────────
  # ── Agencies (network-isolation zones; writes: ConfigureApp) ─────────────────
  /analytics/runs:
    get:
      tags: [Runs]
      operationId: runAnalytics
      summary: Run aggregates over a window — success rate, duration, failure clustering
      description: |
        Computed on demand from the runs table (PF-Q7); there are no rollup
        tables, so these numbers cannot disagree with History.

        Omit `job` for the fleet-wide view. Results are always filtered to the
        scopes the caller can read, so this cannot become a side channel that
        reveals work in a scope they hold no grant for.

        `successRate` is over TERMINAL OUTCOMES only — counting calendar-skipped
        runs as failures would make a correctly-suppressed job look broken.
      parameters:
        - name: job
          in: query
          required: false
          schema: { type: string }
        - name: source
          in: query
          required: false
          schema: { type: string, enum: [git, amadeus] }
        - name: window
          in: query
          required: false
          description: Window as a day count ("7d", "30"). Default 30, capped at 365.
          schema: { type: string }
      responses:
        '200':
          description: Aggregates for the window.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunAnalytics' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /definitions/{kind}/{name}/revisions:
    get:
      tags: [Revisions]
      operationId: listDefinitionRevisions
      summary: One amadeus-source definition's revision history
      description: |
        An append-only log of compose-input snapshots, newest first. Written
        inside the same transaction as the write it describes, so a definition
        cannot exist without a record of what it replaced.

        Git-source definitions are absent by design: their history is Git's.
        A save that changed nothing writes no revision.
      parameters:
        - { $ref: '#/components/parameters/definitionKind' }
        - { $ref: '#/components/parameters/definitionName' }
      responses:
        '200':
          description: Revisions, newest first (max 100).
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DefinitionRevision' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /definitions/{kind}/{name}/revisions/{no}/restore:
    post:
      tags: [Revisions]
      operationId: restoreDefinitionRevision
      summary: Roll a definition back to an earlier revision
      description: |
        Re-submits the stored snapshot through the ordinary write path, so the
        restored definition is validated, audited and RBAC-checked exactly as a
        hand-typed edit would be — and the restore is itself a new revision.

        Operator-owned tags are NOT rolled back: they are edited through their
        own endpoint and a restore carrying the snapshot's tags would silently
        revert tagging work done since. CSRF required.
      parameters:
        - { $ref: '#/components/parameters/definitionKind' }
        - { $ref: '#/components/parameters/definitionName' }
        - name: 'no'
          in: path
          required: true
          description: The revision number to restore.
          schema: { type: integer }
        - { $ref: '#/components/parameters/csrf' }
      responses:
        '200':
          description: Restored; the response is the rewritten definition.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The definition is in the recycle bin — restore it from there first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /recycle-bin:
    get:
      tags: [Revisions]
      operationId: listRecycleBin
      summary: Soft-deleted amadeus-source definitions
      description: |
        Deleting an in-app definition stamps it rather than removing it. It
        leaves the catalog, stops firing and refuses runs and edits, but its
        schedules, pauses, tags, reactions and log folder all survive — which is
        what makes restoring it a single lossless step.

        A binned definition still occupies its (source, name) key, so creating a
        replacement 409s until it is restored or purged.
      responses:
        '200':
          description: What is in the bin, and when each item ages out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RecycleBinEntry' }
                  retentionDays:
                    type: integer
                    description: The purge window. 0 means keep forever.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /recycle-bin/{kind}/{name}/restore:
    post:
      tags: [Revisions]
      operationId: restoreFromRecycleBin
      summary: Restore a soft-deleted definition
      description: |
        Clears the tombstone. Jobs and workflows were never taken apart by the
        soft delete, so nothing else has to be rebuilt.

        A schedule additionally has its runtime bindings replayed: binning one
        detaches the entries its referrers fire on (they are keyed by
        source_ref, not cascaded), so the delete records them and the restore
        puts them back. Referrers deleted in the meantime are not resurrected.
        CSRF required.
      parameters:
        - { $ref: '#/components/parameters/definitionKind' }
        - { $ref: '#/components/parameters/definitionName' }
        - { $ref: '#/components/parameters/csrf' }
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string }
                  name: { type: string }
                  restored: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /recycle-bin/{kind}/{name}:
    delete:
      tags: [Revisions]
      operationId: purgeFromRecycleBin
      summary: Permanently delete a binned definition
      description: |
        The hard delete the soft delete deferred: the row goes, the delete
        cascades fire, the entity code retires so a later definition of the same
        name gets a fresh log folder, and the name is free again. The log folder
        itself is annotated rather than destroyed. Not reversible. CSRF required.
      parameters:
        - { $ref: '#/components/parameters/definitionKind' }
        - { $ref: '#/components/parameters/definitionName' }
        - { $ref: '#/components/parameters/csrf' }
      responses:
        '204': { description: Purged. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runners/{id}/file-sightings:
    post:
      tags: [Runners]
      operationId: reportFileSightings
      summary: Report observed file arrivals (agent → server)
      security:
        - runnerBearer: []
      description: |
        ET-D. The agent reports what it OBSERVED; the server decides what that
        means and does the firing — the agent never triggers a run itself.
        Mirrors the host-key upload.

        Ownership-guarded: a runner may only report as itself. A sighting for a
        path the server did not distribute to this runner is refused, so an
        agent cannot widen its own remit by inventing one.

        De-duped on (job, path, size, mtime): two runners sharing an NFS mount
        report the same arrival and the job runs once. A file REPLACED at the
        same path fires again; an unchanged file sitting in the directory does
        not re-fire.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sightings:
                  type: array
                  items:
                    type: object
                    required: [jobSource, jobName, path, sizeBytes, mtime]
                    properties:
                      jobSource: { type: string, enum: [git, amadeus] }
                      jobName: { type: string }
                      jobUid:
                        type: string
                        description: >-
                          Protocol v11 — echoed back exactly as the server sent
                          it in the watch spec. The server matches it against
                          what it actually distributed and fires from its own
                          copy, so this identifies which watch the report
                          belongs to; it never selects a job on its own.
                      path: { type: string }
                      sizeBytes: { type: integer }
                      mtime: { type: string, format: date-time }
      responses:
        '200':
          description: How many arrivals started a run, and how many were already known or refused.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fired: { type: integer }
                  ignored: { type: integer }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: A runner may only report its own sightings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /service-accounts:
    get:
      tags: [Service Accounts]
      operationId: listServiceAccounts
      summary: List service accounts (machine principals)
      description: |
        Never carries token material. The plaintext is returned once, by the
        creating POST, and only its hash is stored — a lost token is reissued,
        never recovered.
      responses:
        '200':
          description: Service accounts, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Service Accounts]
      operationId: createServiceAccount
      summary: Mint a service account — returns the token ONCE
      description: |
        Requires ManageRoles: minting a service account IS granting a role, so
        it sits behind the permission that edits grants rather than
        ConfigureApp. CSRF required.

        The response is the only time the plaintext token exists outside the
        caller's hands. Store it before closing the dialog.
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceAccountInput' }
      responses:
        '201':
          description: Created. `token` is present exactly here and never again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MintedServiceAccount' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A service account with this name already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /service-accounts/{id}:
    delete:
      tags: [Service Accounts]
      operationId: revokeServiceAccount
      summary: Revoke a service account
      description: |
        Revokes rather than deletes. The account name is the audit actor
        (`svc:<name>`) on every run it ever triggered, and removing the row
        would make that history unreadable. CSRF required.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/csrf' }
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /trigger/jobs/{name}:
    post:
      tags: [Service Accounts]
      operationId: triggerJobByName
      summary: Start a job run as a service account
      security:
        - serviceToken: []
      description: |
        The machine entry point (ET-B). Authenticated by a service-account
        bearer token, addressed by NAME rather than rowid — an external caller
        holds a config file, not a row id.

        The body is the same body POST /jobs/{jobId}/run accepts (scope, target
        hosts/groups, executor, env, connect-as identity, ansible options,
        declared run inputs, `runAt` for a deferred run), and every gate that
        path applies is applied here against the token's resolved identity.
        Runs are recorded with `triggerKind: webhook` and actor `svc:<name>`.

        TWO refusals are specific to this route: a job must be marked
        `requestable: true` to be externally triggerable at all (403
        `not_requestable`), and a bare name matching more than one source is a
        409 rather than a silent pick.
      parameters:
        - name: name
          in: path
          required: true
          description: The job's name.
          schema: { type: string }
        - name: source
          in: query
          required: false
          description: |
            Disambiguates a name present in both sources. Omit when the name is
            unique; a name in two sources without this is 409 `ambiguous_name`.
          schema: { type: string, enum: [git, amadeus] }
      requestBody:
        required: false
        content:
          application/json:
            # Identical to POST /jobs/{jobId}/run's body — that operation is the
            # one enforcement site and this route delegates to it, so the shape
            # is defined there rather than duplicated (and allowed to drift)
            # here.
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Run enqueued (or parked, when the body carried `runAt`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            The token's grant does not permit triggering this job, or the job is
            not marked `requestable` (code `not_requestable`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The name is ambiguous across sources (`ambiguous_name`), the
            concurrency cap is full (`concurrency_cap`), a Forbid-policy run
            is already active (`concurrency_conflict`), the job is paused
            (`job_paused`), a fleet-wide working calendar suppresses today
            (`suppressed_by_calendar`), or another admission gate refused
            (`run_refused`).

            FX-C: `job_paused` is raised on the TOKEN route only. A person
            clicking Run in the UI may override a pause — the dialog names it
            in a confirmation first — but a service account cannot see that
            confirmation, so for it a pause is simply a pause.
            `suppressed_by_calendar` is not raised when the request defers the
            run (`runAt`): the freeze is re-judged at the promotion instant, so
            parking a run for after the freeze is allowed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            Validation failed — the same `Error.code` set as `POST
            /jobs/{id}/run`, including `key_binding_requires_runner` (KB): a
            key-bound job whose run resolves to the ssh executor is refused for
            a token exactly as for a click.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /trigger/workflows/{name}:
    post:
      tags: [Service Accounts]
      operationId: triggerWorkflowByName
      summary: Trigger a workflow as a service account
      security:
        - serviceToken: []
      description: |
        The workflow twin of /trigger/jobs/{name}.

        NOTE: workflows have no `requestable` column, so there is no
        per-definition opt-in here — the token's grant is the whole gate. Scope
        a workflow-triggering token narrowly.
      parameters:
        - name: name
          in: path
          required: true
          description: The workflow's name.
          schema: { type: string }
        - name: source
          in: query
          required: false
          schema: { type: string, enum: [git, amadeus] }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Workflow run started.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ambiguous name, or a concurrency gate refused the run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /agencies:
    get:
      tags: [Agencies]
      operationId: listAgencies
      summary: List agencies (network-isolation zones)
      responses:
        '200':
          description: Agencies.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agency' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Agencies]
      operationId: createAgency
      summary: Create an agency
      description: Operator-governed (ConfigureApp); agencies are never self-declared by a runner. CSRF required.
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgencyInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agency' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: An agency with this name already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }

  /agencies/{agencyId}:
    get:
      tags: [Agencies]
      operationId: getAgencyDetail
      summary: What one agency contains — and whether anything will run in it
      description: |
        The per-agency view (T4.2/T4.3): every scope, secret, variable, SSH key and
        runner that belongs to this agency, plus the two numbers that decide whether
        work placed here actually moves.

        `onlineRunners: 0` is the trap from the investigation this whole plan came
        out of — an agency with no online runner silently queues every run targeting
        it, forever, and until now that was visible only on the run, one run at a
        time. `queuedRuns` turns the prediction into a count. It is derived from the
        same `run_agencies` index `claimRun` probes, so this number and dispatch
        cannot disagree.
      parameters: [{ $ref: '#/components/parameters/agencyId' }]
      responses:
        '200':
          description: The agency's contents and dispatch health.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgencyDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Agencies]
      operationId: updateAgency
      summary: Update an agency
      parameters: [{ $ref: '#/components/parameters/agencyId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgencyInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agency' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: An agency with this name already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Agencies]
      operationId: deleteAgency
      summary: Delete an agency
      description: |
        Blocked with 409 (code=agency_in_use) while any scope (and, from M2, any
        runner) references it. Historical run agency snapshots never block deletion.
      parameters: [{ $ref: '#/components/parameters/agencyId' }, { $ref: '#/components/parameters/csrf' }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Agency is still referenced (code=agency_in_use).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /scopes/{scopeId}/agency:
    put:
      tags: [Scopes]
      operationId: setScopeAgency
      summary: Bind (or clear) a scope's agency
      description: |
        Operator overlay valid for both git- and amadeus-source scopes (agency is a
        deployment fact the GitOps repo does not own); survives re-sync. A null
        agencyId clears the binding. 422 (code=unknown_agency) if the id is not in
        the catalog. CSRF required.
      parameters: [{ $ref: '#/components/parameters/scopeId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agencyId: { type: [string, 'null'], description: Agency id to bind, or null to clear. }
      responses:
        '200':
          description: Updated scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The referenced agency does not exist (code=unknown_agency).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /env-vars:
    get:
      tags: [Env Vars]
      operationId: listEnvVars
      summary: List non-secret env vars (DB-backed per A1.1)
      parameters:
        - { $ref: '#/components/parameters/tagFilter' }
        - { $ref: '#/components/parameters/tagMatch' }
      responses:
        '200':
          description: Env vars.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EnvVar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Env Vars]
      operationId: createEnvVar
      summary: Create an env var
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvVarInput' }
      responses:
        '201':
          description: Created (Change Log entry written).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvVar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Key already exists for this scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }

  /env-vars/{envVarId}:
    put:
      tags: [Env Vars]
      operationId: updateEnvVar
      summary: Update an env var
      parameters: [{ $ref: '#/components/parameters/envVarId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvVarInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvVar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Env Vars]
      operationId: deleteEnvVar
      summary: Delete an env var
      parameters: [{ $ref: '#/components/parameters/envVarId' }, { $ref: '#/components/parameters/csrf' }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /env-var-tags/{envVarId}:
    put:
      tags: [Env Vars]
      operationId: updateEnvVarTags
      summary: Set an env var's tags (operator-authored)
      description: |
        Replaces the variable's operator-authored tag set (migration 470). Tags
        live ONLY in Cronomicon's SQLite DB — they are never sourced from Git. Unlike
        the read-only catalog tag endpoints, this carries the same ManageEnvVars
        permission as the variable's other writes. Tags are normalized server-side:
        trimmed, blanks dropped, de-duplicated case-insensitively, and capped
        (≤30 tags, ≤64 chars each) — a violation is 422.
      parameters:
        - { $ref: '#/components/parameters/envVarId' }
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: The updated env var (with its normalized tags).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvVar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  # ── Secrets ────────────────────────────────────────────────────────────────
  /env-secrets:
    get:
      tags: [Secrets]
      operationId: listEnvSecrets
      summary: List secrets (values never included)
      parameters:
        - { $ref: '#/components/parameters/tagFilter' }
        - { $ref: '#/components/parameters/tagMatch' }
      responses:
        '200':
          description: Secret metadata only.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EnvSecret' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Secrets]
      operationId: createEnvSecret
      summary: Create a secret
      description: stored-source values are encrypted at rest (AES-256-GCM, HKDF from CRONOMICON_SECRET_KEY per S14 recommendation). vault-source entries store the reference only.
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvSecretInput' }
      responses:
        '201':
          description: Created (value never echoed back).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvSecret' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Key already exists for this scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }

  /env-secrets/{secretId}:
    put:
      tags: [Secrets]
      operationId: updateEnvSecret
      summary: Update a secret
      parameters: [{ $ref: '#/components/parameters/secretId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvSecretInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvSecret' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Secrets]
      operationId: deleteEnvSecret
      summary: Delete a secret
      parameters: [{ $ref: '#/components/parameters/secretId' }, { $ref: '#/components/parameters/csrf' }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /env-secrets/{secretId}/reveal:
    post:
      tags: [Secrets]
      operationId: revealEnvSecret
      summary: Reveal (unmask) a stored secret value (S1/S14)
      description: |
        Explicit unmask of a stored-source secret. Every reveal writes a Change
        Log entry (§8.2). POST (not GET) because it has an audit side effect.
        vault-source secrets cannot be revealed through Cronomicon. CSRF required.
      parameters: [{ $ref: '#/components/parameters/secretId' }, { $ref: '#/components/parameters/csrf' }]
      responses:
        '200':
          description: The decrypted value.
          content:
            application/json:
              schema:
                type: object
                required: [value]
                properties:
                  value: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Secret is vault-source — value lives in Vault.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /env-secrets/{secretId}/migrate-to-vault:
    post:
      tags: [Secrets]
      operationId: migrateSecretToVault
      summary: Migrate a stored secret to Vault (H10/§8.3)
      description: Moves the value to Vault at the given path; the stored ciphertext is zeroed and deleted. No undo. CSRF required.
      parameters: [{ $ref: '#/components/parameters/secretId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vaultPath]
              properties:
                vaultPath:
                  type: string
                  examples: ['secret/data/cronomicon#DB_PASSWORD']
      responses:
        '200':
          description: Migrated; secret is now vault-source.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvSecret' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already vault-source.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Vault unreachable (§11.4).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /env-secret-tags/{secretId}:
    put:
      tags: [Secrets]
      operationId: updateSecretTags
      summary: Set a secret's tags (operator-authored)
      description: |
        Replaces the secret's operator-authored tag set (migration 470). Tags are
        plaintext metadata stored in SQLite ONLY — never part of the encrypted
        envelope, so the crypto/reveal/migrate paths are untouched. Carries the
        same ManageEnvVars permission as the secret's other writes. Tags are
        normalized server-side: trimmed, blanks dropped, de-duplicated
        case-insensitively, and capped (≤30 tags, ≤64 chars each) — a violation is 422.
      parameters:
        - { $ref: '#/components/parameters/secretId' }
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: The updated secret (with its normalized tags; value never included).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvSecret' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  # ── Runners ────────────────────────────────────────────────────────────────
  /runners:
    get:
      tags: [Runners]
      operationId: listRunners
      summary: List registered runners (operator)
      parameters:
        - { $ref: '#/components/parameters/tagFilter' }
        - { $ref: '#/components/parameters/tagMatch' }
      responses:
        '200':
          description: Runners with live state.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Runner' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /runners/register:
    post:
      tags: [Runners]
      operationId: registerRunner
      summary: Register a runner (single-use registration token, A6.1/Phase 7)
      description: |
        Called by the runner binary with a registration token (crn_reg_*,
        24h expiry, single-use per install — or the multi-use env bootstrap
        token) as the bearer credential. Returns the runner record + a
        long-lived API key used for all subsequent runner calls. The token
        row is consumed ATOMICALLY by the successful registration (two hosts
        cannot register from one token) and records which runner consumed it;
        a used token is rejected with the distinct `token_used` error naming
        that runner, an expired one with `token_expired`.
      security:
        - runnerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, os, capabilities, version, protocolVersion]
              properties:
                name: { type: string }
                os: { type: string, enum: [Linux, Windows] }
                capabilities:
                  type: array
                  items: { $ref: '#/components/schemas/RunType' }
                version: { type: string }
                maxConcurrent: { type: integer, default: 5 }
                protocolVersion:
                  type: integer
                  minimum: 12
                  description: |
                    The runner↔server wire-protocol version this agent speaks.
                    REQUIRED, and it must equal the server's current protocol:
                    the floor tracks it, because server and agent ship from one
                    repository and the runner upgrade command exists to move a
                    fleet with the server. Absent counts as 0 and is refused the
                    same way (426) — there is no pre-handshake carve-out, since
                    registration is where the wire shape is agreed.
                inventory:
                  type: string
                  enum: [amadeus, local]
                  default: amadeus
                  description: |
                    Per-runner inventory canonicality (D8). amadeus — the
                    manifest carries fully-resolved targets. local — the agent
                    resolves hosts against its own inventory (network-isolated
                    segments); the manifest ships only the scope name.
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                required: [runner, apiKey]
                properties:
                  runner: { $ref: '#/components/schemas/Runner' }
                  apiKey:
                    type: string
                    description: Long-lived runner API key. Shown once; store securely.
        '401':
          description: Registration token invalid or expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }
        '426':
          description: |
            Agent protocol below the server's floor (`protocol_too_old`).
            Absent counts as 0. Upgrade the agent binary — the floor tracks the
            server's current protocol.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /runners/{runnerId}:
    delete:
      tags: [Runners]
      operationId: deregisterRunner
      summary: Deregister (revoke) a runner
      description: Operator action — deleting the registration revokes the runner's API key (§6.6). CSRF required.
      parameters: [{ $ref: '#/components/parameters/runnerId' }, { $ref: '#/components/parameters/csrf' }]
      responses:
        '204': { description: Deregistered. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runners/{runnerId}/poll:
    get:
      tags: [Runners]
      operationId: pollForWork
      summary: Long-poll for work (A6.2) — doubles as heartbeat
      description: |
        Runner-only (bearer). Cronomicon holds the connection until work is
        available or the server-side timeout (default 30s) elapses. load,
        version and heartbeat ride as query params — there is no separate
        heartbeat endpoint. Server→runner control messages (kill, drain
        acknowledgement, re-register) are delivered in this response; no
        bidirectional channel exists (§6.3). The optional configDigest query
        param enables automatic drift detection (Phase 5).
      security:
        - runnerBearer: []
      parameters:
        - { $ref: '#/components/parameters/runnerId' }
        - { name: load, in: query, schema: { type: integer, minimum: 0 } }
        - { name: version, in: query, schema: { type: string } }
        - name: configDigest
          in: query
          schema: { type: string }
          description: |
            Canonical SHA-256 of the agent's CURRENTLY declared config
            (name, os, capability tokens, maxConcurrent, inventory, version,
            protocolVersion) — automatic drift detection (Phase 5). On
            mismatch with the digest stored at (re-)registration the server
            delivers the re-register control op (flap-guarded), so
            declared-config changes propagate on the next poll after a
            restart. Optional; absent ⇒ no drift check. (The op was once sent
            only to protocol v4+ rows; that gate went with the protocol floor,
            which every registered agent now meets.)
        - name: settingsVersion
          in: query
          schema: { type: integer, minimum: 0 }
          description: |
            The managed-settings version the agent has APPLIED (Phase 4). A
            settings-capable agent always sends it (even 0); its presence is
            how the server knows it may include the settings object in the
            response, and it records the value as the ack. Absent (pre-Phase-4
            agent) ⇒ the server never sends settings.
      responses:
        '200':
          description: Work assignment and/or control messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PollResponse' }
        '204':
          description: Timeout elapsed; no work. Poll again.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '426':
          description: |
            The runner's stored protocol is below the server's floor
            (`protocol_too_old`). The floor is checked on EVERY poll, not only
            at registration: an agent registers once and then resumes a saved
            identity, so a runner registered before a server upgrade would
            otherwise keep polling at its old protocol and be handed fields its
            binary silently drops. Upgrade the agent binary and restart it — the
            runner keeps its identity and needs no deregistration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /runners/{runnerId}/placement:
    post:
      tags: [Runners]
      summary: Accept a placement suggestion for an unbound runner
      description: |
        Restores the agency membership and tags recorded in a snapshot onto a
        runner that currently belongs to no agency (DR-7).

        This endpoint IS the human confirmation. The server never re-binds a
        re-registered runner on its own — see PlacementSuggestion for why.

        Authorization is `configureApp` PLUS the ability to grant EVERY agency
        the snapshot names: an unrestricted operator passes everywhere, a
        departmental one only for agencies they already administer. One refusal
        fails the whole accept, because a partial placement looks placed.
      operationId: acceptRunnerPlacement
      parameters:
        - name: runnerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [historyId]
              properties:
                historyId:
                  type: integer
                  description: The snapshot to apply, from the runner's placementSuggestion.
      responses:
        '204': { description: Placement restored. }
        '400': { description: historyId missing or unreadable. }
        '401': { description: Not authenticated. }
        '403':
          description: |
            The caller cannot grant at least one agency this placement would
            restore.
        '409':
          description: |
            The suggestion no longer applies — the runner has since been placed,
            removed or renamed, or the snapshot aged out of its retention window.
        '500': { description: Server error. }
  /runners/{runnerId}/placement/dismiss:
    post:
      tags: [Runners]
      summary: Dismiss a placement suggestion
      description: |
        Records that the snapshot is not to be restored (DRF-3). The dismissal
        is on the SNAPSHOT, so it is never offered again to any runner; the row
        is kept as history and still ages out on the retention window.

        Same authorization as accepting: dismissing is a decision about
        placement, and a suggestion only ever targets a runner in no agency —
        the general pool — so it is `configureApp` and, per RF-Q3, unrestricted
        in practice.
      operationId: dismissRunnerPlacement
      parameters:
        - name: runnerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [historyId]
              properties:
                historyId: { type: integer }
      responses:
        '204': { description: Dismissed. }
        '400': { description: historyId missing or unreadable. }
        '401': { description: Not authenticated. }
        '403': { description: The caller may not decide placement for this runner. }
        '409': { description: The snapshot does not exist or is already dismissed. }
        '500': { description: Server error. }
  /runners/{runnerId}/drain:
    post:
      tags: [Runners]
      operationId: drainRunner
      summary: Drain a runner (§6.5)
      description: |
        Marks the runner draining; it stops receiving new work via /poll but
        finishes active jobs. When active count hits 0 it transitions to
        offline. Per-runner drain timeout (default 1h, A6.4) force-kills on
        expiry, marking still-active runs danger with reason drain_timeout.
        CSRF required.
      parameters: [{ $ref: '#/components/parameters/runnerId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                timeoutMinutes:
                  type: integer
                  default: 60
      responses:
        '202':
          description: Drain initiated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runner' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Runner already draining or offline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /runners/{id}/secret-injection:
    put:
      tags: [Runners]
      operationId: setRunnerSecretInjection
      summary: Set a runner's secret-injection trust flag
      description: |
        Toggles whether this runner may CLAIM runs that inject reference bindings
        and receive resolved secret material in its manifest (vault-integration.md
        P1.4/P1.8, migration 600). This is an operator trust grant — never
        agent-self-declared — mirroring agency membership: it defaults off and is
        set only here. A run whose job/script declares reference bindings is claimed
        ONLY by a flagged runner. Blast radius: a flagged runner receives decrypted
        secret VALUES in its manifest, so grant it only to runners you trust with the
        secrets in the scopes it serves. Gated ConfigureApp + CSRF.
      parameters:
        - name: id
          in: path
          required: true
          description: The runner's id.
          schema: { type: string }
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allow]
              properties:
                allow:
                  type: boolean
                  description: Whether the runner may receive injected secret material.
      responses:
        '200':
          description: The updated flag.
          content:
            application/json:
              schema:
                type: object
                required: [id, allowSecretInjection]
                properties:
                  id: { type: string }
                  allowSecretInjection: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runners/{runnerId}/resync:
    post:
      tags: [Runners]
      operationId: resyncRunner
      summary: Request an id-preserving re-declaration (protocol v4)
      description: |
        Operator action (CSRF required) — runner-install-update.md Phase 4.
        Flags the runner; its next poll delivers the re-register control op
        and the agent re-declares its current local config in place via
        /runners/{runnerId}/redeclare — same id, same API key, no deregister
        dance. The op cannot change what a runner is: the agent re-reads its
        OWN local config.
      parameters: [{ $ref: '#/components/parameters/runnerId' }, { $ref: '#/components/parameters/csrf' }]
      responses:
        '202':
          description: Resync requested; delivered on the runner's next poll.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runner' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runners/{runnerId}/settings:
    patch:
      tags: [Runners]
      operationId: updateRunnerSettings
      summary: Update a runner's server-managed settings (Phase 4)
      description: |
        Operator action (CSRF required) — runner-install-update-2.md Phase 4.
        Replaces the runner's server-managed override set (a COMPLETE desired
        set — present fields are managed, absent fields are cleared) and bumps
        settings_version. The change rides the runner's next poll and the agent
        applies it in-memory (no restart); until the agent acks,
        settingsVersion > settingsAckedVersion (pending). An all-empty body
        clears every override (the runner reverts to its local declared values)
        and still bumps the version.
      parameters: [{ $ref: '#/components/parameters/runnerId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedRunnerSettings' }
      responses:
        '200':
          description: Settings stored; version bumped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  managedSettings: { $ref: '#/components/schemas/ManagedRunnerSettings' }
                  settingsVersion: { type: integer }
                  settingsAckedVersion: { type: integer }
        '400':
          description: Invalid settings (e.g. maxConcurrent < 1, a non-run-type mask entry).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runners/{runnerId}/keyscan:
    post:
      tags: [Runners]
      operationId: requestHostKeyScan
      summary: Request a host-key scan (Phase 5, D4)
      description: |
        Operator action (CSRF required) — runner-install-update-2.md Phase 5.
        Queues a host-key scan for the given targets; the runner's next poll
        delivers a `keyscan` control op and the agent scans each host from its
        own vantage, uploading what it saw for approval.
      parameters: [{ $ref: '#/components/parameters/runnerId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hosts]
              properties:
                hosts:
                  type: array
                  items: { type: string }
                  description: Targets to scan, as "host" (port 22) or "host:port".
      responses:
        '202':
          description: Scan queued; delivered on the runner's next poll.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hosts: { type: array, items: { type: string } }
        '400': { description: No hosts given., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runners/{runnerId}/hostkeys:
    post:
      tags: [Runners]
      operationId: uploadHostKeys
      summary: Upload scanned host keys (runner-only)
      description: |
        Runner-only (bearer, ownership-guarded). The agent posts the host keys
        it captured for the operator to approve. A re-scan of the same
        (host, keyType) replaces the prior pending row. Never trusts anything —
        approval is a separate operator step.
      security:
        - runnerBearer: []
      parameters: [{ $ref: '#/components/parameters/runnerId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    properties:
                      host: { type: string }
                      keyType: { type: string }
                      fingerprint: { type: string, description: 'SHA256:… for out-of-band comparison.' }
                      knownHostsLine: { type: string, description: The exact line appended to known_hosts on approval. }
      responses:
        '200':
          description: Keys ingested for approval.
          content: { application/json: { schema: { type: object, properties: { accepted: { type: integer } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runners/host-keys/pending:
    get:
      tags: [Runners]
      operationId: listPendingHostKeys
      summary: List host keys awaiting approval
      description: |
        Operator. The scanned keys not yet approved or rejected, newest first,
        with runner names and full SHA256 fingerprints for out-of-band
        comparison (approving without out-of-band verification is still TOFU).
      responses:
        '200':
          description: Pending scanned keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendingHostKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /runners/host-keys/{keyId}/resolve:
    post:
      tags: [Runners]
      operationId: resolveHostKey
      summary: Approve or reject a scanned host key
      description: |
        Operator action (CSRF required). Approving marks the key trusted — the
        runner's next poll delivers its known_hosts line as a `trust-hosts` op
        and the agent appends it. Rejecting marks it rejected; it is never
        trusted. Both decisions are audited.
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject] }
      responses:
        '200':
          description: Resolved.
          content: { application/json: { schema: { type: object, properties: { id: { type: string }, action: { type: string } } } } }
        '400': { description: Invalid action., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already resolved.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /runners/{runnerId}/test:
    post:
      tags: [Runners]
      operationId: testRunner
      summary: Test connection to a runner
      description: |
        Runs a connection test for a runner. Since runner agents poll the
        server, we verify connection by checking if the runner is online
        and its last heartbeat is within the RunnerOfflineAfter duration.
        CSRF required.
      parameters: [{ $ref: '#/components/parameters/runnerId' }, { $ref: '#/components/parameters/csrf' }]
      responses:
        '200':
          description: Connection test outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /runners/{runnerId}/redeclare:
    post:
      tags: [Runners]
      operationId: redeclareRunner
      summary: Id-preserving re-declaration (runner bearer, protocol v4)
      description: |
        Called by the agent on receipt of the re-register control op,
        authenticated with its EXISTING long-lived API key — never a
        registration token (registration tokens are first-contact-only
        credentials, D6). Updates the existing runner row in place: same id,
        same agency membership, same API key, no orphan row. Status, load,
        and registration provenance are untouched. A runner whose row was
        reaped/deregistered gets 404 and must register fresh with a
        registration token.
      security:
        - runnerBearer: []
      parameters: [{ $ref: '#/components/parameters/runnerId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, os, capabilities, version, protocolVersion]
              properties:
                name: { type: string }
                os: { type: string, enum: [Linux, Windows] }
                capabilities:
                  type: array
                  description: Widened capability tokens (run-types + checkout/vault/collection tokens, RX.7).
                  items: { type: string }
                version: { type: string }
                maxConcurrent: { type: integer, default: 5 }
                inventory:
                  type: string
                  enum: [amadeus, local]
                  default: amadeus
                protocolVersion:
                  type: integer
                  minimum: 12
                  description: |
                    Must equal the server's current wire protocol — the floor
                    tracks it (426 below).
                toolchains:
                  type: [object, 'null']
                  additionalProperties: true
                  description: Detected-toolchain display detail (RX.7), incl. keyNames (resolvable credential names, names only; R6).
      responses:
        '200':
          description: Re-declared; the existing row was updated in place.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runner' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
        '426':
          description: Declared protocol below 4.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /runners/registration-tokens:
    get:
      tags: [Runners]
      operationId: listRegistrationTokens
      summary: List registration tokens (single-use, Phase 7)
      description: |
        Label, created/expires, revocation, and the used-by audit trail —
        which runner consumed which token. Never returns plaintext (tokens
        are hash-at-rest; the plaintext is returned exactly once by mint).
        Newest first, capped at 100 rows.
      responses:
        '200':
          description: Registration tokens, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RegistrationTokenInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Runners]
      operationId: mintRegistrationToken
      summary: Mint a single-use registration token (§6.6, Phase 7)
      description: |
        Mints one crn_reg_* token (24h expiry) for one install. Plaintext is
        returned once and never re-served. Unlike the retired shared-token
        rotate, minting does NOT revoke other tokens — several installs can
        be in flight, each with its own token; each dies on its first
        successful registration. CSRF required.
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 120
                  description: Optional operator label, e.g. the intended runner name.
      responses:
        '201':
          description: Minted token — the only response that ever carries plaintext.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RegistrationTokenInfo'
                  - type: object
                    required: [token]
                    properties:
                      token:
                        type: string
                        description: The crn_reg_* plaintext. Shown once; store securely.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /runners/registration-tokens/{tokenId}:
    delete:
      tags: [Runners]
      operationId: revokeRegistrationToken
      summary: Revoke an unused registration token (Phase 7)
      description: |
        Kills a token that should no longer be usable — this replaces the
        shared token's "Regenerate" (there is nothing to rotate anymore). A
        used token cannot be revoked (409): it is already dead as a
        credential and its row is the audit record; to revoke the runner it
        registered, deregister that runner. Revoking an already-revoked
        token is a no-op 204. CSRF required.
      parameters:
        - { name: tokenId, in: path, required: true, schema: { type: integer } }
        - { $ref: '#/components/parameters/csrf' }
      responses:
        '204': { description: Revoked (or already revoked). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Token already used — its row is the audit record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Settings (DB-backed config per §2.2) ───────────────────────────────────
  /settings/general:
    get:
      tags: [Settings]
      operationId: getGeneralSettings
      summary: Get general settings
      responses:
        '200':
          description: General settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneralSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Settings]
      operationId: updateGeneralSettings
      summary: Update general settings
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GeneralSettings' }
      responses:
        '200':
          description: Updated (Change Log entry written).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneralSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /settings/gitlab:
    get:
      tags: [Settings]
      operationId: getGitlabConfig
      summary: Get GitLab connection config (PAT masked)
      responses:
        '200':
          description: Config; pat is always masked on read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitlabConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      operationId: updateGitlabConfig
      summary: Update GitLab connection config
      description: Omit pat to keep the stored value. CRONOMICON_GITLAB_PAT env var overrides the DB value at startup (§11.2).
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitlabConfig' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitlabConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /settings/gitlab/webhook-secret/rotate:
    post:
      tags: [Settings]
      operationId: rotateWebhookSecret
      summary: Rotate the GitLab webhook secret (S15)
      description: |
        Two-step rotation per S15 — writes the new secret to Cronomicon and (if
        updateGitlab=true) updates the webhook config in GitLab via API. Both
        old and new secrets are accepted for an overlap window (>= 5 min). If
        GitLab cannot be updated automatically, the response notes manual
        reconfiguration is required. CSRF required.
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                updateGitlab: { type: boolean, default: true }
                overlapMinutes: { type: integer, default: 5, minimum: 5 }
      responses:
        '200':
          description: Rotated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, description: New secret. Shown once. }
                  gitlabUpdated: { type: boolean }
                  overlapUntil: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: GitLab unreachable; secret not rotated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /settings/vault:
    get:
      tags: [Settings]
      operationId: getVaultConfig
      summary: Get Vault connection config (credentials masked)
      responses:
        '200':
          description: Config.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      operationId: updateVaultConfig
      summary: Update Vault connection config
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaultConfig' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /settings/notifications:
    get:
      tags: [Settings]
      operationId: getNotificationConfig
      summary: Get notification config (provider, Apprise, SMTP)
      responses:
        '200':
          description: Notification config.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      operationId: updateNotificationConfig
      summary: Update notification config
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationConfig' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /settings/notifications/test:
    post:
      tags: [Settings]
      operationId: sendTestNotification
      summary: Send a test notification over every configured transport
      description: >-
        Delivers a fixed test message using the **stored** SMTP and Apprise
        configuration (K-5, v0.52.25). Takes no body on purpose — every
        recipient, gateway and target comes from settings, so this cannot be used
        to mail an arbitrary address. A successful leg stamps that transport's
        `lastSent` exactly as a real alert does.


        Returns **200 whenever the attempt was made**, with per-transport
        outcomes in the body: a refused SMTP connection is a true answer to
        "can this reach anyone?", not a server error. Audited, because it
        delivers to real inboxes.
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      responses:
        '200':
          description: Attempted; see per-transport results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTestReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /settings/audit-compliance:
    get:
      tags: [Settings]
      operationId: getAuditComplianceSettings
      summary: Get audit & compliance settings (retention knobs)
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditComplianceSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      operationId: updateAuditComplianceSettings
      summary: Update audit & compliance settings
      description: Per-table retention knobs per A4. Log redaction is unconditional (T7/S7) — there is no toggle.
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditComplianceSettings' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditComplianceSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /settings/log-storage:
    get:
      tags: [Settings]
      operationId: getLogStorageConfig
      summary: Get per-run log storage config
      responses:
        '200':
          description: Config + usage stats.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogStorageConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Settings]
      operationId: updateLogStorageConfig
      summary: Update per-run log storage config
      description: |
        A new local log directory applies **immediately** — no restart (LU-5).
        The save re-points the runner log writers, the SSH executor, the SSH
        connection-test writer, and (unless pinned via `CRONOMICON_LOG_FILE`) the
        process log. In-flight runs keep writing to the file handle they already
        opened, and existing log files are **not** moved — the read path resolves
        against the current directory, so move the tree yourself if historical
        logs must stay readable.
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogStorageConfig' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogStorageConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /settings/log-storage/sync:
    post:
      tags: [Settings]
      operationId: syncLogStorageNow
      summary: Run one S3 log-archive sync tick now
      description: |
        Runs one archive tick on demand under the sweep's single-flight lock
        (SL-2, the s3-logging plan). The tick runs in the background
        and may take up to its budget (10 minutes); the response is the
        log-storage config as of now with `archive.inProgress` true. Poll
        `GET /settings/log-storage` for `archive.lastSyncFinishedAt`,
        `pending` and `lastSyncError`.

        `?reconcile=1` prefixes the tick with a bucket listing that restores
        archive markers for runs whose object is already present and resets
        the archived count/bytes to what the bucket holds — the repair for a
        database restored from a snapshot older than the last sync, or a
        rollback-and-reapply of migration 1130. Not on by default: it lists
        the whole prefix.
      parameters:
        - $ref: '#/components/parameters/csrf'
        - name: reconcile
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '202':
          description: Tick started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogStorageConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A tick is already running (`sync_in_progress`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: The backend is `local` — select the S3 archive backend and save first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: The sync loop is not running in this process (`log_archive_unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

