                items: { $ref: '#/components/schemas/SshBastion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Settings]
      operationId: createSshBastion
      summary: Create a bastion
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SshBastionInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshBastion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /ssh/bastions/{bastionId}:
    put:
      tags: [Settings]
      operationId: updateSshBastion
      summary: Update a bastion
      parameters: [{ $ref: '#/components/parameters/bastionId' }, { $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SshBastionInput' }
      responses:
