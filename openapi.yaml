        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Agencies]
      operationId: setRunnerAgencies
      summary: Replace the agency membership of each posted runner
      description: |
        Operator-assigned (ConfigureApp); runners never self-declare membership.
