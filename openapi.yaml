  /agency-matrix:
    get:
      tags: [Agencies]
      operationId: getAgencyMatrix
      summary: The whole agency membership grid in one read
      description: |
        Rows = scopes, secrets, variables, SSH keys and runners; columns = agencies
        (the agencies plan T4.1). This is the surface that closes G5: until
        it existed, nothing answered "what belongs to DSS?" in one view, and an
        operator had to hold five facts across four mechanisms at once.

        Rows with NO membership are included deliberately. An empty row is not
        missing information — it is the statement "unrestricted, reachable from
        everywhere", which is precisely the fact you need before assigning
        membership that would narrow it.

        `scope` carries the entity's own scope where it has one ("" = global), so two
        same-named secrets in different scopes are distinguishable. Names and ids
        only — never a value.

        One endpoint rather than nine client-side reads, because the entity-id →
        name join a client would have to perform is exactly the bookkeeping this view
        exists to spare someone. Cells are toggled through the existing
        `PUT /{kind}-agencies` setters (ConfigureApp).
      responses:
        '200':
          description: The membership grid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgencyMatrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /agency-preflight:
    get:
      tags: [Agencies]
      operationId: getAgencyPreflight
      summary: What would break if the agency predicates were switched on (T2.12)
      description: |
        A read-only report of every reference binding that works TODAY and would
        stop working if the Phase-3 agency predicates were enabled right now
        (the agencies plan T2.12). Ship and review this **before**
        Phase 3 — that is the entire reason Phases 2 and 3 are not merged: Phase 2
        populates the membership tables without changing behavior, so this can be
        read against real production data rather than discovered in production.

        Two independently reviewable halves: `referenceFindings` (AG-Q1(b), the
        agency clause on secrets/variables) and `keyFindings` (AG-Q5, the SSH-key
        tightening §7.1 warns about — today any job may bind any key).

        An EMPTY report on a freshly migrated database is expected and correct: the
        migration-670 backfill deliberately assigns no membership that would narrow
        anything, so the tightening only acquires teeth as an operator assigns
        membership. Read `membershipAssigned` alongside the findings — zero there
        means the report has nothing to bite on yet, not that Phase 3 is safe.

        Script-owned bindings cannot be evaluated statically (a script has no scope
        of its own; its bindings resolve against whatever scope the run carries) and
        are counted, not guessed at.
      responses:
        '200':
          description: The pre-flight report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgencyPreflightReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /env-var-shadows:
    get:
      tags: [Env Vars]
      operationId: getEnvVarShadows
      summary: Scoped rows that shadow a global row of the same key (RA-10)
      description: |
        Every scoped Secrets/Variables row that shadows a global row of the same
        key (the runas-update plan RA-10). The same findings appear in
        `GET /agency-preflight`; this endpoint exists so the Env Vars view can warn
        the person editing the catalogue, not only the admin planning a tightening.

        **The failure mode.** Reference resolution prefers a scope-exact row over a
        global one, and an empty agency membership set means "no restriction". A
        scoped row created without membership therefore wins for EVERY department's
        runs in that scope — silently, with nothing in the list or the run log
        saying which row was injected. Unmembered is the state migration 670 leaves
        every row in, so this is the default outcome of adding a scoped row and not
        thinking about departments, not an exotic misconfiguration. Those findings
        carry `unrestricted: true`.

        A shadow with membership is reported too but is usually the override feature
        working as intended: it wins only for its own department's runs.

        Session-gated, and scope-filtered to the caller's grants exactly like
        `GET /env-vars` and `GET /env-secrets` — a finding names a row and a scope,
        so an unfiltered list would be a cross-scope existence oracle (P1.7/M3).
      responses:
        '200':
          description: The shadow warnings visible to this caller. Empty is the healthy state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvVarShadowList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rbac-preflight:
    get:
      tags: [Access]
      operationId: getRbacPreflight
      summary: What would break if the departmental-RBAC switches were flipped (RB-4)
      description: |
        A read-only report of who loses what — and which data must be curated
        first — if the departmental-RBAC predicates were switched on right now
        (the rbac-update plan RB-4). Requires `manageRoles`.

        Both switches are now LIVE and the two-axis model's tables are gone
        (RB-19, v0.57.8), so the four conversion sections this report originally
        carried — losesExecute, multiRoleUsers, wideningRestrictions,
        orphanScopes, grantlessMappings — were removed with them: they each
        answered "what changes when we flip", and that question has no meaning
        once the flip is history and its inputs are dropped. FX-E6: the schema
        below matched that old report for a year after the code stopped emitting
        it, so a schema-validating client rejected every valid response.

        What remains is a CURRENT-STATE hygiene report:

        - `ungrantedGroups` — AD groups people actually present at login that no
          grant names (was `unmappedGroups` until v0.57.8, when it started
          asking the question against the grants that decide access).
        - `unscopedJobs` / `unscopedJobShare` / `totalJobs` — jobs a restricted
          actor must bind a scope for (RB-26), with the denominator.
        - `unscopedSchedules` — deliberately general-pool per RB-Q11(c); a
          number to watch, not a blocker.
        - `pendingUnbound` / `pendingRevoked` — parked runs that fire with
          frozen authorization (RB-Q12); the hand-sweep list.
        - `emptyMembershipEntities` — secrets/variables with no agency
          membership, unrestricted-only under RB-Q14.

        An EMPTY report on a fresh database is expected and correct. Read
        `usersEvaluated` / `grantsEvaluated` alongside the findings — zero there
        means the report had nothing to bite on, not that everything is healthy.
      responses:
        '200':
          description: The pre-flight report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RbacPreflightReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /access-grants:
    get:
      tags: [Access]
      operationId: listAccessGrants
      summary: List access grants (ManageRoles)
      description: |
        A grant is `ad_group → role → where`, and `where` is an **agency** or the
        `*` sentinel — nothing else (RB-Q1). It replaces the two-axis model whose
        independently-unioned halves produced the cross-product leak: a user in
        tax-viewers (viewer→tax) *and* finance-operators (operator→finance)
        resolved to permissions {trigger} and scopes {tax, finance}, and could
        therefore trigger **Tax** jobs. A grant keeps the association the two flat
        lists destroy — *this* role, *here*.

        **AUTHORITATIVE.** These endpoints are the only surface that decides
        access. The two-axis model they replaced (`/ad-group-mappings` +
        `/scope-restrictions`) stopped deciding anything at v0.56.5 and was
        removed, tables and all, in v0.57.8. Editing a grant here changes who can
        do what on the next login, and bumps the session epoch so every other
        signed-in operator is signed out immediately.
      responses:
        '200':
          description: Every grant, ordered by group, role, then agency.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccessGrant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Access]
      operationId: createAccessGrant
      summary: Create an access grant (ManageRoles)
      description: |
        Signs out every other session (SU-5). A duplicate `(adGroup, role, where)`
        is a 409 — grants are deduplicated by a unique index, so the same authority
        cannot be expressed twice.
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessGrantInput' }
      responses:
        '201':
          description: The created grant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessGrant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: An identical grant already exists. }
        '422': { $ref: '#/components/responses/Validation' }

  /access-grants/{grantId}:
    put:
      tags: [Access]
      operationId: updateAccessGrant
      summary: Update an access grant (ManageRoles)
      parameters:
        - { name: grantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessGrantInput' }
      responses:
        '200':
          description: The updated grant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessGrant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such grant. }
        '409': { description: An identical grant already exists. }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Access]
      operationId: deleteAccessGrant
      summary: Delete an access grant (ManageRoles)
      parameters:
        - { name: grantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/csrf' }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such grant. }

  /recent-logins:
    get:
      tags: [Access]
      operationId: listRecentLogins
      summary: List recent logins (Honest View, A3.2)
      description: Users appear only after their first successful OIDC round-trip; lastSeen reflects last successful auth. No directory enumeration in v1.
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
      responses:
        '200':
          description: Recent logins.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/RecentLogin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me:
    get:
      tags: [Access]
      operationId: getCurrentUser
      summary: Get the authenticated user
      description: Resolved identity + role + effective allowed scopes (resolveAllowedScopes, A5). The frontend uses this for UI gating; the backend re-checks on every mutation.
      responses:
        '200':
          description: Current session identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /capabilities:
    get:
      tags: [Settings]
      operationId: getCapabilities
      summary: What this deployment supports, and what this caller may do
      description: |
        Two different kinds of fact in one flat object, and the difference matters.

        *Deployment* flags (`vault`, `apprise`) say what this install has wired at
        all. *Caller* flags say what the signed-in operator holds.

        ⚠️ The permission flags are **FLAT UNION** semantics — "may this actor do
        this SOMEWHERE" (RB-3). They exist for coarse navigation gating and must
        never be used as an access control: an operator scoped to Finance reports
        `triggerJobs: true` and is still refused on a Tax job. Per-row truth is on
        the list endpoints themselves (`canRun`/`canKill` on job rows).

        `unrestricted` is not a permission at all — it reports scope REACH, and
        exists so the Run dialog can tell the two callers of RB-26 apart: a
        restricted caller must bind a scope to an unscoped job, an unrestricted one
        may deliberately run it unbound. Without it the client cannot offer a
        compliance path and the rule would be discovered as a 403.

        `viewDashboard` and `editSchedules` are deliberately absent — RB-Q9/RB-Q13
        deleted them in v0.56.1, because a permission that cannot be enforced should
        not be advertised as if it were.
      responses:
        '200':
          description: Capability flags for this deployment and this caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Git ────────────────────────────────────────────────────────────────────
  /git/sync:
    post:
      tags: [Git]
      operationId: triggerGitSync
      summary: Trigger an immediate Git sync (operator)
      description: Same pipeline as the <=5min poll and the GitLab webhook (§3.1). CSRF required.
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      responses:
        '202':
          description: Sync started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  startedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: GitLab unreachable; serving stale clone (§11.4).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /git/history:
    get:
      tags: [Git]
      operationId: listGitHistory
      summary: List Git sync history
      parameters:
        - name: sort
          in: query
          description: Sort column (TS-20; see /runs sort). Omitted ⇒ newest first.
          schema: { type: string, enum: [timestamp, action, status] }
        - { $ref: '#/components/parameters/sortOrder' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
      responses:
        '200':
          description: Sync events.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/GitSyncEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /webhooks/gitlab:
    post:
      tags: [Git]
      operationId: receiveGitlabWebhook
      summary: GitLab webhook receiver (push events)
      description: |
        Authenticated by the X-Gitlab-Token shared-secret header (§3.1), not by
        session or bearer auth. Triggers an immediate sync. During a webhook
        secret rotation overlap window both old and new secrets are accepted (S15).

        Gated by the Webhook Enabled / Webhook Events settings (F2-3). Disabled →
        403; an event type whose flag is off → 202 with no sync, since an
        unselected event is not a delivery error. X-Gitlab-Event selects the
        flag: `Push Hook` (or an absent header) → push, `Tag Push Hook` → tag,
        `Merge Request Hook` → mr; any other event is accepted and ignored. The
        token is checked first, so a 403 is never reachable without the secret.
      security: []
      parameters:
        - name: X-Gitlab-Token
          in: header
          required: true
          schema: { type: string }
        - name: X-Gitlab-Event
          in: header
          required: false
          schema: { type: string }
          description: "GitLab's event name, used to select the Webhook Events flag. Absent is treated as a push."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GitLab webhook payload (push event). Body is not validated beyond event type.
      responses:
        '202': { description: "Delivery accepted. A sync was triggered unless the event's Webhook Events flag is off, in which case it was accepted and ignored." }
        '401':
          description: Invalid X-Gitlab-Token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Webhook delivery is disabled in Settings → Integrations (Webhook Enabled).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

# ═════════════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    operatorSession:
      type: apiKey
      in: cookie
      name: amadeus_session
      description: |
        Operator browser surface (T8). The OIDC token lives in an httpOnly,
        Secure, SameSite=Lax cookie and is validated on every request; expired
        tokens trigger a prompt=login redirect. State-changing requests
        additionally require the CSRF double-submit header X-CSRF-Token
        mirroring the non-httpOnly csrf-token cookie; mismatches are rejected
        with 403. GET endpoints never mutate state and skip CSRF.
    runnerBearer:
      type: http
      scheme: bearer
      description: |
        Runner surface (T9). Authorization: Bearer <api-key> — the long-lived
        key issued at registration (or a single-use crn_reg_* registration
        token for POST /runners/register only). No cookies, no CSRF.
    serviceToken:
      type: http
      scheme: bearer
      description: |
        Machine surface (ET-A). Authorization: Bearer crnsvc_<token> — a
        service-account credential minted under Settings → Service Accounts and
        shown exactly once. No cookies, no CSRF (there is no session to ride).

        The token is a PRINCIPAL, not a bypass: the account carries a role and
        either an agency or the "*" sentinel, resolving to the same Identity a
        human with that grant would hold. Every scope, verb, concurrency,
        calendar and declared-input rule that applies to a person clicking Run
        applies identically here.

  parameters:
    definitionKind:
      name: kind
      in: path
      required: true
      description: Which kind of amadeus-source definition.
      schema: { type: string, enum: [job, workflow, schedule] }
    definitionName:
      name: name
      in: path
      required: true
      description: The definition's name.
      schema: { type: string }
    reactionOwnerKind:
      name: ownerKind
      in: path
      required: true
      description: Which kind of definition owns the reaction — the one that RUNS.
      schema: { type: string, enum: [job, workflow] }
    reactionOwnerName:
      name: ownerName
      in: path
      required: true
      description: The owning definition's name.
      schema: { type: string }
    csrf:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF double-submit token mirroring the csrf-token cookie (T8). Required on all state-changing operator requests.
      schema: { type: string }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    pageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    sortOrder:
      name: order
      in: query
      description: >-
        Direction for `sort` (TS-20): asc or desc, default asc. Ignored when
        no sort key is sent. Status-keyed sorts order by severity rank (worst
        first ascending), not alphabetically; empty cells sort last in both
        directions. Any other value is a 400.
      schema: { type: string, enum: [asc, desc], default: asc }
    tagFilter:
      name: tag
      in: query
      description: |
        Filter by tag. Repeat the parameter (?tag=a&tag=b) to select multiple
        tags; matching is per whole tag (exact element), never a substring, so
        ?tag=prod does not match a "production" tag. Combine with tagMatch to
        choose AND/OR across multiple tags.
      explode: true
      schema: { type: array, items: { type: string } }
    tagMatch:
      name: tagMatch
      in: query
      description: How to combine multiple tag values — any (OR, default) or all (AND).
      schema: { type: string, enum: [any, all], default: any }
    from:
      name: from
      in: query
      description: Inclusive ISO 8601 lower bound.
      schema: { type: string, format: date-time }
    to:
      name: to
      in: query
      description: Exclusive ISO 8601 upper bound.
      schema: { type: string, format: date-time }
    jobId:
      name: jobId
      in: path
      required: true
      schema: { type: integer }
    workflowId:
      name: workflowId
      in: path
      required: true
      schema: { type: integer }
    scriptName:
      name: name
      in: path
      required: true
      description: |
        Script name (metadata.name), unique across scripts/*.yaml. For scripts in
        sub-folders the name is the repo-relative path (e.g. ops-playbooks/site.yml);
        clients URL-encode the slashes (%2F) and the server matches a trailing-wildcard
        route, so multi-segment names resolve correctly.
      schema: { type: string }
    scheduleDefName:
      name: name
      in: path
      required: true
      description: First-class schedule name (metadata.name); disambiguated by ?source when both origins exist.
      schema: { type: string }
    traceId:
      name: traceId
      in: path
      required: true
      description: Backend-minted UUIDv7 trace ID (S11). Opaque to clients.
      schema: { type: string, format: uuid }
    agencyId:
      name: agencyId
      in: path
      required: true
      schema: { type: string }
    scopeId:
      name: scopeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    envVarId:
      name: envVarId
      in: path
      required: true
      schema: { type: string, format: uuid }
    secretId:
      name: secretId
      in: path
      required: true
      schema: { type: string, format: uuid }
    runnerId:
      name: runnerId
      in: path
      required: true
      schema: { type: string }
    alertId:
      name: alertId
      in: path
      required: true
      schema: { type: string, format: uuid }
    hostId:
      name: hostId
      in: path
      required: true
      schema: { type: string, format: uuid }
    bastionId:
      name: bastionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    credentialId:
      name: credentialId
      in: path
      required: true
      schema: { type: string }
    mappingId:
      name: mappingId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing/invalid session cookie or bearer key. Browser clients are redirected to OIDC login.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        Authenticated but lacking the required role permission, scope access, or CSRF
        token. Every denial of this kind is **audited**: the permission, role and
        scope guards write a `denied` row to `auth_events`, and a rejected CSRF token
        writes `csrf-failed`, each carrying the actor, the required target, and both
        client addresses. Denials are deliberately not throttled, so a scan across
        many resources is visible as such.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict — e.g. a duplicate amadeus-source name, or a write to a read-only git-source definition (A9).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Validation:
      description: Validation failed; details carry line-numbered errors for YAML/pragma inputs (S10/T10).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }

  schemas:
    # ── Shared ────────────────────────────────────────────────────────────────
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code (e.g. forbidden, not_found, base_sha_mismatch, vault_unreachable, log_stream_lost, reactions_watching).
        message: { type: string }
        traceId:
          type: string
          description: Server request correlation ID, if available.

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            errors:
              type: array
              items: { $ref: '#/components/schemas/LineError' }

    LineError:
      type: object
      required: [message]
      properties:
        file: { type: string }
        line:
          type: integer
          description: 1-based line number for YAML/pragma errors (S10 strict parsing).
        field: { type: string }
        message: { type: string }

    PreconditionFailed:
      description: 412 body for the A2 base_sha mismatch flow.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [currentSha, diff]
          properties:
            baseSha:
              type: string
              description: The stale SHA the client sent in If-Match.
            currentSha:
              type: string
              description: SHA currently at the tip for the file.
            diff:
              type: string
              description: Unified diff between the client's base and the current file, so the UI can show "someone else changed this — review and retry."

    Page:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }

    AuditFields:
      description: Backend-assigned audit fields present on all operator-editable records (S1/S4).
      type: object
      properties:
        createdBy: { type: string, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        lastModifiedBy: { type: string, readOnly: true }
        lastModifiedAt: { type: string, format: date-time, readOnly: true }

    # ── Enums ────────────────────────────────────────────────────────────────
    RunType:
      type: string
      enum: [bash, ansible, terraform, powershell, perl, python]

    JobStatus:
      type: string
      description: Aggregate job state shown in the Jobs table.
      enum: [running, success, danger, paused, idle, queued]

    RunStatus:
      type: string
      description: success | warning | danger map to the prototype's history statuses; killed runs surface as danger with a reason; cancelled is a display-only status for a soft-cancelled workflow run (WB-S2).
      enum: [queued, running, success, warning, danger, skipped, cancelled]

    ActivityKind:
      type: string
      enum: [run-start, run-end, workflow-start, workflow-end, config, gitsync, push]

    ActivityOutcome:
      type: [string, 'null']
      enum: [success, failure, warning, null]

    # ── Jobs / Workflows ─────────────────────────────────────────────────────
    AnnotationWrite:
      type: object
      description: |
        A full replace of the operator annotation, never a patch: the client
        always holds the current value (it just rendered it), and a partial
        update would make "clear the contact" indistinguishable from "leave it
        alone". All three fields empty DELETES the annotation.
      properties:
        critical:
          type: boolean
          default: false
          description: Operator-set criticality. Display-only; see the Job schema's field.
        contact:
          type: string
          maxLength: 256
          description: Free-text contact, usually a distribution list or on-call rotation.
        notes:
          type: string
          maxLength: 4096
          description: Free-text operator notes. Plain text; newlines are significant.
    Job:
      type: object
      description: |
        A job definition + DB runtime state. source ∈ {git, amadeus} (A9): git
        jobs are Git-authored (definition fields read-only over the API; edits go
        through the publish flow); amadeus jobs are operator-composed in-app via
        POST/PUT /jobs (A11).
      properties:
        id: { type: integer, readOnly: true }
        uid:
          type: string
          readOnly: true
          description: >-
            AF-4a — the definition's stable surrogate identity, assigned when the
            row is first seen (by sync or by the composer) and preserved across
            syncs, edits and restores. Unlike `id` (a numeric handle) and unlike
            the name (which a later phase will allow to repeat across agencies),
            the uid never changes for the life of the row. New integrations
            should key on it.
        name: { type: string, readOnly: true }
        source:
          type: string
          enum: [git, amadeus]
          readOnly: true
          description: Origin — git (Git-authored) or amadeus (operator-composed in-app).
        sourcePath:
          type: string
          nullable: true
          readOnly: true
          description: Repo-relative file path (e.g. jobs/db/backup.yaml), for folder browsing. Null for Compose-authored jobs.
        type: { $ref: '#/components/schemas/RunType' }
        scriptRef:
          type: [string, 'null']
          readOnly: true
          description: |
            Name of the Script this job references (B-Git). null ⇒ legacy inline
            body. When set, run_type/command/script/scriptPath/executor on this Job
            are denormalized from the referenced script at sync time (Decision 7).
        scheduleRefs:
          type: array
          readOnly: true
          description: Names of first-class schedules (A10a) this job references; expanded into the runtime schedule cache at sync.
          items: { type: string }
        description: { type: [string, 'null'], readOnly: true, description: Job description (detail responses only). }
        host: { type: string }
        scope: { type: string }
        envPassthrough:
          type: array
          items: { type: string }
          readOnly: true
          description: |
            RP-14 — the job's env-passthrough NAME list (detail responses only);
            mirrors JobComposeInput.envPassthrough for a lossless composer
            round-trip.
        sshUser:
          type: [string, 'null']
          readOnly: true
          description: |
            CA — the job's declarative "connect as" login (detail responses only):
            every run of this job connects as this user instead of each host's
            configured one, unless the Run dialog overrides it per run.
            Identity-capable run types only (ssh-family + ansible; on ansible it
            beats the scope inventory's ansible_user).
        sshCredential:
          type: [string, 'null']
          readOnly: true
          description: |
            CA — the job's declarative stored SSH credential, by LABEL (names only;
            detail responses only). Same precedence and run-type rules as sshUser.
        becomePasswordSecret:
          type: [string, 'null']
          readOnly: true
          description: |
            RA-12 — the bare KEY of a Secrets row supplying this job's Ansible become
            password (detail responses only). A NAME, never a value: the password
            stays in the Secrets catalogue and is resolved at dispatch, then delivered
            to the runner as a 0600 file the agent passes to
            `ansible-playbook --become-password-file` and wipes at run end. null on
            every job that declares none, which is the pre-Phase-B behaviour exactly.

            A job carrying this automatically requires the `become-file` capability
            token, so its runs wait for a runner with ansible-core >= 2.12 rather than
            being assigned to one that cannot honour the flag.
        env:
          type: object
          additionalProperties: { type: string }
          description: |
            Job-level environment variables (JC10); present on detail responses.
            Merged into every run of this job as the BASE layer beneath schedule
            env and per-run override (JC11). Plaintext literals only — not redacted
            (JC12). Distinct from per-schedule env (schedules[].env).
        status: { $ref: '#/components/schemas/JobStatus' }
        enabled:
          type: boolean
          readOnly: true
          description: |
            Raw enabled flag (detail responses only). Distinct from the derived
            `status` (which collapses enabled=0 and a schedule-paused row into
            "paused"); the in-app composer uses this for an exact edit prefill (JC9).
        schedule:
          type: string
          description: Cron expression, or "Manual".
        lastRunAt: { type: [string, 'null'], format: date-time, readOnly: true }
        lastSkippedAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: >-
            FX-D1 — when this job's most recent SUPPRESSED fire was recorded (a working-calendar
            veto, a Forbid refusal, a queue-full skip, a missed-fire marker). Kept apart from
            lastRunAt, which reports the last fire that actually EXECUTED: a suppression is
            evidence a run was expected and deliberately did not happen, and reporting it as the
            last run made a job that has not executed in weeks look current.
        lastSkipReason:
          type: [string, 'null']
          readOnly: true
          description: Why that fire was suppressed, in the same wording History records.
        nextRunAt: { type: [string, 'null'], format: date-time, readOnly: true }
        pendingRunAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: AR — earliest deferred ad-hoc run parked against this job (null when none).
        lastDurationMs: { type: [integer, 'null'], readOnly: true }
        lastChangedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        createdAt: { type: [string, 'null'], format: date-time, readOnly: true }
        lastModifiedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        tags:
          type: array
          description: |
            Operator-authored tags (tags-support.md D6). Stored in SQLite ONLY and
            set via PUT /job-tags/{jobId}. As of the operator-owned model they are
            NO LONGER sourced from YAML spec.tags and survive Git syncs; [] when
            none. Present on both list and detail rows. WRITABLE (inline-editable).
          items: { type: string }
        critical:
          type: boolean
          description: |
            Operator-set criticality (AN, migration 1060), written via
            PUT /job-annotation/{jobId}. DISPLAY-ONLY: it colours a chip and adds a
            line to failure notifications. It does not route alerts, change queue
            priority or page anyone differently — giving it routing meaning is a
            semantic contract that needs a fleet audit first. Present on both list
            and detail rows, and always present: false is a real answer the UI
            acts on, so it does not omit.
        contact:
          type: string
          description: |
            Who to contact when this breaks. Free text rather than a user or
            agency reference, because the real answer is usually a distribution
            list or an on-call rotation that is not an Cronomicon user. ≤256 chars.
            Present on both list and detail rows; omitted when empty.
        notes:
          type: string
          description: |
            Operator notes — what this is for, what to check before re-running.
            Plain text with significant newlines: NOT markdown, and URLs are not
            linkified. ≤4096 chars. DETAIL ONLY, so a page of list rows does not
            carry 4KB each; omitted when empty.
        notesBy:
          type: string
          readOnly: true
          description: |
            The actor who last wrote the annotation. Server-assigned — attribution
            a client could set is attribution nobody can trust. Detail only.
        notesAt:
          type: string
          format: date-time
          readOnly: true
          description: |
            When the annotation was last written (RFC3339, UTC). Server-assigned,
            and paired with notesBy so staleness is visible. Detail only.
        warnAfterSeconds:
          type: [integer, 'null']
          description: >-
            Warn once a run has been going this long (SL). Distinct from
            `timeoutSeconds`, which KILLS: a job running long is often healthy
            and merely slow, so this only raises an `sla-breach` alert and never
            touches the run.
        watch:
          type: array
          description: >-
            ET-D — file-arrival triggers. Each entry is an absolute path glob a
            capable runner polls; when a matching file's size has been unchanged
            for `stableSeconds`, the job runs with the path injected as
            `CRONOMICON_WATCH_PATH` / `CRONOMICON_WATCH_FILE` / `CRONOMICON_WATCH_SIZE`.


            Declaring a watch IS this job's opt-in for being started by a file —
            `requestable` gates the service-account API, a different surface.
            The file itself is never delivered (PF-Q2): the job's script already
            runs where the file is.


            A runner watches only if it was started with `-allow-watch` and the
            path falls inside its `-watch-paths` allowlist, and only if its
            agency can reach the job's scope. The same file seen by two runners
            sharing a mount fires ONCE.
          items:
            type: object
            required: [path]
            properties:
              path:
                type: string
                description: Absolute glob (filepath.Match syntax). Relative paths and `..` are rejected.
              stableSeconds:
                type: integer
                description: >-
                  How long the file's size must hold steady before it counts as
                  arrived. Defaults to 5. Exists because a large file being
                  written is visible long before it is complete.
        mustFinishBy:
          type: [string, 'null']
          description: >-
            A wall-clock deadline as `HH:MM` (24-hour) in the application
            timezone (SL). For the half of the question a duration cannot ask —
            "the nightly close has to be done before the business opens" — since
            the run's start time is exactly what varies. A deadline earlier in
            the day than the run's start is read as tomorrow's, which is what
            makes an overnight window mean what it looks like.
        requestable:
          type: boolean
          default: false
          description: Reserved for V2-2 self-service catalog; present in v1 schema, ignored by v1 UI (A7).
        workflowId:
          type: [integer, 'null']
          readOnly: true
          description: FK to the owning workflow when the job is a workflow step (S3).
        queuedReason:
          type: [string, 'null']
          readOnly: true
          description: >-
            Why this job's newest still-queued run is not starting, e.g. "no runner is online"
            (A6.3). DETAIL responses only (FX-E3) — the list never assigns it, since computing it
            per row would cost a runs probe on every row for a value that only matters once an
            operator is looking at one job.
        scheduleCount:
          type: integer
          readOnly: true
          description: Number of schedule entries (list rows; drives the multi-schedule badge).
        agencies:
          type: array
          readOnly: true
          items: { type: string }
          description: >-
            The job's agency set, DERIVED from its scope via scope_agencies (RB-23).
            Display and filtering only — a job carries no agency of its own, because
            a second source of truth could disagree with the first (a job labelled
            Tax whose scope belongs to Finance) and every authorization decision
            would then have to pick a winner. The run path already settled this by
            snapshotting the derived set onto the run.
        canRun:
          type: boolean
          readOnly: true
          description: >-
            Whether the CALLER may trigger this specific job (RB-24), computed
            server-side against this row's scope. The /capabilities flags are a flat
            union — "may trigger somewhere" — and cannot answer per-row truth: an
            operator scoped to Finance reports triggerJobs=true and still may not
            touch a Tax job. Consume this rather than re-deriving authorization in
            the client, which is how a UI gate drifts from the server's answer.
            Display only: the run path enforces scope but not the verb until the
            release that wires triggerJobs.
        canKill:
          type: boolean
          readOnly: true
          description: Whether the caller may stop/pause/resume runs of this job (RB-24). See canRun.
        command:
          type: [string, 'null']
          readOnly: true
          description: Inline one-liner executable source (execution-update EX.1). Exactly one of command/script/scriptPath is set.
        script:
          type: [string, 'null']
          readOnly: true
          description: Inline multi-line executable source (EX.1).
        scriptPath:
          type: [string, 'null']
          readOnly: true
          description: Repo-relative script file, read from the synced clone (EX.1).
        executor:
          type: [string, 'null']
          readOnly: true
          enum: [runner, ssh, null]
          description: Per-job executor default (EX.3). null ⇒ resolved from run_type at trigger (shell types ⇒ ssh).
        runnerTag:
          type: [string, 'null']
          readOnly: true
          description: |
            The DECLARED runner pin (RT): runs of this job may be claimed only by
            a runner carrying this tag. Part of the job spec — for a Git-source
            job it comes from `spec.runner_tag` and is overwritten on every sync,
            like `description`. null ⇒ no declared pin. It is the ONLY durable
            pin a job has: the operator override that could mask it was retired
            in v1.3.5 (migration 1090), leaving the definition and the per-run
            pin as the two places placement is decided.
        runnerTagEffective:
          type: [string, 'null']
          readOnly: true
          description: |
            The resolved job-level pin. Equal to `runnerTag` today, and kept as a
            distinct field because the resolution itself is server-side: this is
            what a run inherits when its trigger says nothing, and what the Run
            dialog prefills. Clients should read this rather than re-deriving it.
        concurrencyPolicy:
          type: string
          enum: [Allow, Forbid, Queue]
          readOnly: true
          description: >-
            What happens when this job fires while one of its own runs is still
            active. `Allow` overlaps. `Forbid` loses the fire, recorded as a
            skipped run. `Queue` (QP) parks it and promotes it when the gate
            clears, up to a small per-key cap; beyond the cap it falls back to
            Forbid's behaviour and says so in the run's reason.


            `Replace` was removed in v0.57.29: it was accepted and stored for
            releases but no code ever branched on it, so a Replace job behaved
            exactly as Allow. Existing rows were coerced to Allow, which changes
            nothing about how they ran.
        concurrencyKey:
          type: [string, 'null']
          readOnly: true
          description: Custom collision key for Forbid/Replace; defaults to the job name.
        promptEnforcement:
          type: string
          enum: [warn, block]
          readOnly: true
          description: |
            Per-job enforcement for declared REQUIRED run inputs (JR-Q5, migration 660).
            `warn` (the DEFAULT, and the v0.38.0 UDV4 behavior) — an unfilled required
            input never blocks the run; the name is recorded under
            overrides.promptWarnings. `block` — POST /jobs/{jobId}/run is rejected
            422 `prompt_required` while a declared required input has no value in the
            run's effective env. Opt-in per job, because it reaches paths no client-side
            gate can: the API, schedules, and workflow steps. NOT escapable by
            promptAcknowledged (JR-Q10) — an escapable block would just be `warn`.
            Detail-only. An unrecognized stored value normalizes to `warn`.
        timeoutSeconds:
          type: [integer, 'null']
          readOnly: true
        retries:
          type: integer
          readOnly: true
        backoffSeconds:
          type: integer
          readOnly: true
          description: WB-R1 job-level default backoff (seconds) between retry attempts of a workflow step.
        continueOnError:
          type: boolean
          readOnly: true
          description: WB-R1 job-level default; when true a still-failing workflow step is skipped-and-proceeded instead of halting.
        schedules:
          type: array
          readOnly: true
          description: Multi-entry schedule list (detail responses only); mirrors spec.schedules in the job YAML.
          items: { $ref: '#/components/schemas/ScheduleEntry' }
        prompts:
          type: array
          readOnly: true
          description: |
            Declared prompt variables (UDV1); detail responses only. The ad-hoc Run
            dialog renders these as fillable fields whose answers ride the per-run env
            override path (UDV2). Authored on the job (not inferred from script source);
            read-only for git jobs (sourced from spec.prompts). [] when none.
          items: { $ref: '#/components/schemas/JobPrompt' }
        requires:
          type: array
          readOnly: true
          description: |
            Requirement tokens (§5/RX.13) that claim-gate this job to capable
            runners (e.g. `vault`). Read-only for git jobs (sourced from
            spec.requires); writable for amadeus jobs via JobComposeInput. [] when none.
          items: { type: string }

    JobComposeInput:
      type: object
      description: Request body for composing (POST) or editing (PUT) an amadeus-source job (A11).
      required: [scriptRef, scope]
      properties:
        name: { type: string, description: "Job name (slug, [a-z0-9][a-z0-9_-]*). Immutable on edit." }
        scriptRef: { type: string, description: Name of the Git Script to bind (its run_type/body/executor are denormalized onto the job). }
        scope:
          type: string
          description: |
            AF-1 — REQUIRED, and an empty string is a valid answer. A job's scope
            decides which agencies can see it, so the assignment must be a choice:
            a scope name places the job with that scope's agencies, and "" places
            it in All (global — visible to every agency, stored as NULL). Omitting
            the field, or sending null, is refused with a 422; only silence is
            rejected, never a deliberate global job. Git-source jobs are a separate
            contract: a YAML with no scope syncs as All with a warning rather than
            being refused.
        targetHost: { type: string }
        envPassthrough:
          type: array
          items: { type: string }
          description: |
            RP-14 — environment-variable NAMES (never values, D1) the runner agent
            resolves from ITS OWN environment into this job's local-toolchain child
            process (RX.9); the Git-YAML equivalent of `spec.env_passthrough`. For a
            value the agent host holds and Cronomicon does not. An unset name fails the
            run loudly rather than resolving empty. Local-toolchain run types only
            (ansible/terraform) — 422 on an ssh-family job, whose remote environment
            is built entirely from its manifest. CRONOMICON_* names are refused (422):
            those are references Cronomicon injects, not the runner's environment.
        sshUser:
          type: string
          description: |
            CA — declarative "connect as" login for every run of this job (per-run
            override wins). Identity-capable run types only — ssh-family + ansible,
            422 on terraform, which authenticates through its providers rather than
            SSH; plain username charset (422 otherwise).
        sshCredential:
          type: string
          description: |
            CA — declarative stored SSH credential, by LABEL (names only — key bytes
            never ride the API). Must name an existing credential (422 otherwise).
            Setting or changing it requires the ManageEnvVars permission (403) — the
            same "reference = material grant" rule as declared bindings; clearing it
            does not. Per-run override wins; identity-capable run types only
            (ssh-family + ansible).
        becomePasswordSecret:
          type: string
          description: |
            RA-12 — the bare KEY of a Secrets row supplying this job's Ansible become
            password (names only — the value never rides the API).

            Setting it is a grant over stored secret material and carries the same
            ManageEnvVars rule as sshCredential. RA-21 enforces that on the Composer:
            the verb, plus membership of the agency owning the row this job's scope
            would actually RESOLVE — so one department cannot bind another's password.
            The check fires only when the field is SET or CHANGED, so a full-replace
            PUT of an unchanged job stays free for unrelated edits and clearing the
            field needs nothing. Ansible run types only: the Composer refuses anything
            else with 422, the flag reaching ansible-playbook alone.

            Through the Composer the row MUST resolve — an unresolvable name is 422 at
            authoring time, and a name owned by two of the scope's departments is 422
            as AMBIGUOUS rather than settled by a silent pick. Through GIT SYNC it need
            not: an absent row is a sync finding (a warning), never a sync failure,
            because failing the sync would take every other job in the repo down with
            it and the catalogue row is often created minutes later by a different
            person. Dispatch fails closed either way.

            Delivered as a FILE, not an environment value: an env var is readable from
            /proc, and piping one into `sudo -S` puts it in the target's process table
            where redaction cannot reach.
        env:
          type: object
          additionalProperties: { type: string }
          description: |
            Job-level environment variables, merged into every run of this job as the BASE
            layer beneath schedule env and per-run override (schedule/override win on key
            collision; JC11). Plaintext literals only — no references to stored
            env_vars/secrets (V2-11). Not redacted (JC12).
        executor:
          type: string
          enum: [ssh, runner]
          description: Optional per-job executor override; defaults to the referenced script's executor.
        runnerTag:
          type: string
          description: |
            The DECLARED runner pin (RT) — the Git YAML `spec.runner_tag`
            equivalent for an Cronomicon-composed job. Empty ⇒ unpinned. This is one
            of only two places a pin is set; the other is the per-run `runnerTag`
            on POST /jobs/{jobId}/run, which outranks it for that run alone.
        scheduleRefs:
          type: array
          description: Names of first-class schedules to bind (A10a).
          items: { type: string }
        schedules:
          type: array
          description: Inline named schedules (cron + optional env).
          items:
            type: object
            required: [name, cron]
            properties:
              name: { type: string }
              cron: { type: string }
              env: { type: object, additionalProperties: { type: string } }
              startAt:
                type: [string, 'null']
                format: date-time
                description: Activation window start (AW) — the entry does not fire before this instant. null/absent ⇒ active immediately.
              endAt:
                type: [string, 'null']
                format: date-time
                description: Activation window end (AW) — the entry does not fire after this instant. null/absent ⇒ never expires.
              interval:
                type: [string, 'null']
                description: Anchored-interval mode — fire every N from startAt ("7d", "36h"). Mutually exclusive with cron; requires startAt as the anchor.
              skipCalendars:
                type: array
                items: { type: string }
                description: Working calendars whose days suppress this entry's fires (CAL).
              onlyCalendars:
                type: array
                items: { type: string }
                description: Working calendars whose days are the only days this entry may fire on (CAL).
        enabled: { type: boolean }
        requestable: { type: boolean }
        timeoutSeconds: { type: integer }
        retries: { type: integer }
        backoffSeconds: { type: integer, description: WB-R1 job-level default backoff between retry attempts. }
        continueOnError: { type: boolean, description: WB-R1 job-level default; skip-and-proceed instead of halting on failure. }
        concurrencyPolicy: { type: string, enum: [Allow, Forbid, Queue] }
        concurrencyKey: { type: string }
        promptEnforcement:
          type: string
          enum: [warn, block]
          description: |
            Per-job enforcement for declared REQUIRED run inputs (JR-Q5). Omit for the
            `warn` default — the pre-Phase-3 behavior every existing job keeps. `block`
            makes the run genuinely impossible without a value, for EVERY caller
            including the API, schedules, and workflow steps. Anything unrecognized
            normalizes to `warn`, so a typo can never silently harden a job.
        description: { type: string }
        tags: { type: array, items: { type: string } }
        prompts:
          type: array
          description: |
            Declared prompt variables (UDV1) surfaced in the ad-hoc Run dialog. Writable
            for amadeus jobs; git jobs declare these via spec.prompts instead. Always
            send the full list on edit (full-replace PUT, JC1) to avoid stripping it.
          items: { $ref: '#/components/schemas/JobPrompt' }
        requires:
          type: array
          description: |
            Requirement tokens (ansible-update.md §5/RX.13) that claim-gate this
            job to runners advertising them — e.g. `vault`, or
            `collection:<fqcn>`. Writable for amadeus jobs; git jobs declare
            these via spec.requires. Full-replace on edit (JC1).
          items: { type: string }

    JobPrompt:
      type: object
      description: |
        One declared prompt variable on a Job (user-defined-vars.md UDV1). It surfaces
        as a fillable field in the ad-hoc Run dialog; the operator's answer is submitted
        as a per-run env override (env[name]=value, UDV2) and merged into runs.env_json.
        Declared by the author (NOT inferred from script source — the inferred highlighter
        is demoted to an authoring aid, UDV5). Read-only for git jobs (sourced from
        spec.prompts), writable for amadeus jobs (JobComposeInput.prompts).
      required: [name]
      properties:
        name:
          type: string
          description: Env var key the answer binds to (unique within a job).
        label:
          type: string
          description: Human-facing prompt text; the UI falls back to name when empty.
        required:
          type: boolean
          description: |
            When true, an empty value at run time is recorded as a warn-only note on the
            run (UDV4/UDV6) — it never blocks the run (no 422).
        default:
          type: [string, 'null']
          description: Pre-filled value; auto-submitted into the run env even if untouched (UDV8).
        options:
          type: array
          items: { type: string }
          description: |
            Optional dropdown of allowed values. UI convenience only — the backend does
            NOT reject out-of-range values (UDV7).

    Script:
      type: object
      description: |
        The reusable executable unit (B-Git). Parsed from scripts/<name>.yaml and
        cached read-only; jobs reference it via scriptRef. run_type, the body
        (command/script/scriptPath), and the default executor describe the CODE and
        live here rather than on the Job. Read-only over the API.
      properties:
        name: { type: string, readOnly: true }
        description: { type: [string, 'null'], readOnly: true }
        runType: { $ref: '#/components/schemas/RunType' }
        command:
          type: [string, 'null']
          readOnly: true
          description: Inline one-liner executable source. Exactly one of command/script/scriptPath is set.
        script:
          type: [string, 'null']
          readOnly: true
          description: Inline multi-line executable source.
        scriptPath:
          type: [string, 'null']
          readOnly: true
          description: Repo-relative script file, read from the synced clone.
        sourceKind:
          type: string
          readOnly: true
          enum: [command, script, file]
          description: |
            Server-derived tag of which body the row carries (command | script |
            file). Present on list and detail rows; lets the Scripts list badge a
            row without shipping the command/script blobs — the body is fetched on
            demand from /script-content when a row is expanded (CC.11). Omitted
            when the row has no body.
        executor:
          type: [string, 'null']
          readOnly: true
          enum: [runner, ssh, null]
          description: Default executor (optional). null ⇒ resolved from run_type at trigger.
        contentHash:
          type: string
          readOnly: true
          description: "sha256:-prefixed hex digest of the resolved body (Decision 8); snapshotted on runs for reproducibility."
        sourcePath:
          type: [string, 'null']
          readOnly: true
          description: scripts/<name>.yaml in Git.
        syncedAt: { type: string, format: date-time, readOnly: true }
        createdAt: { type: [string, 'null'], format: date-time, readOnly: true }
        lastModifiedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        usedByCount:
          type: integer
          readOnly: true
          description: Number of jobs referencing this script (list rows; blast-radius badge).
        usedBy:
          type: array
          readOnly: true
          description: Names of jobs referencing this script (detail responses only) — the reverse index.
          items: { type: string }
        usedByRefs:
          type: array
          readOnly: true
          description: |
            R2F-3 — the same jobs as `usedBy`, in the same order, each carrying its
            permanent identity and derived agencies so a display can tell two
            same-named jobs apart. A parallel field rather than a reshape of
            `usedBy`, which stays the plain-name array it has always been.
          items:
            type: object
            properties:
              name: { type: string }
              uid: { type: string }
              source: { type: string, enum: [git, amadeus] }
              agencies: { type: array, items: { type: string } }
        warnings:
          type: array
          readOnly: true
          description: |
            Body-lint findings from the sync-time body scan (script-upgrade.md WS-B):
            [] when clean. Present on both list and detail rows.
          items: { $ref: '#/components/schemas/ScriptWarning' }
        variables:
          type: array
          readOnly: true
          description: |
            Environment variables the body references, extracted by the sync-time
            scan (script-upgrade.md WS-B) so an operator can see what to define.
            [] when the body references none, or for run types not yet analyzed
            (ansible/terraform). Present on both list and detail rows.
          items: { $ref: '#/components/schemas/ScriptVariable' }
        prompts:
          type: array
          readOnly: true
          description: |
            Run inputs the script AUTHOR DECLARED in spec.prompts (20260724-job-run-update.md
            JR-Q6, migration 651) — the label/required/default/options an operator actually
            sees. Distinct from `variables` above, which is the HEURISTIC body extraction
            used only as an authoring aid (UDV5): declared beats inferred (UDV1). The Job
            Composer seeds a new job's Run inputs from these, so the required set is correct
            by default. [] when none declared. Present on both list and detail rows.
          items: { $ref: '#/components/schemas/JobPrompt' }
        tags:
          type: array
          description: |
            Operator-authored tags (scripts-tags.md). Stored in SQLite ONLY — not
            parsed from or written back to Git — and set via PUT /script-tags/{name}.
            Preserved across syncs; deleted only if the script is removed from Git.
            [] when none. Present on both list and detail rows. Unlike every other
            Script field this one is WRITABLE.
          items: { type: string }

    ScriptVariable:
      type: object
      description: |
        One environment variable a Script references, found by the sync-time body
        scan. Advisory only — extraction never blocks a sync or enters content_hash.
        A non-null default means the reference is OPTIONAL (the body supplies a
        fallback, e.g. ${VAR:-x}); a null default means it is REQUIRED.
      required: [name]
      properties:
        name:
          type: string
          readOnly: true
          description: The variable name as referenced (e.g. TARGET_HOST).
        default:
          type: [string, 'null']
          readOnly: true
          description: The literal fallback from ${VAR:-x}/${VAR:=x}; null ⇒ required.
        line:
          type: [integer, 'null']
          readOnly: true
          description: 1-based line of the first reference; omitted/null when not attributable.

    ScriptWarning:
      type: object
      description: |
        One body-lint finding on a Script, produced by the sync-time body scan.
        Advisory only — a finding never blocks a sync and never enters content_hash.
      required: [rule, severity, message]
      properties:
        rule:
          type: string
          readOnly: true
          description: "Stable rule id: crlf | non_utf8 | no_shebang | shebang_mismatch | oversized."
        severity:
          type: string
          readOnly: true
          enum: [info, warning, danger]
          description: Drives the chip color (info/warning/danger).
        message:
          type: string
          readOnly: true
          description: Human-readable finding, including remediation.
        line:
          type: [integer, 'null']
          readOnly: true
          description: 1-based line of the finding; omitted/null when not attributable.

    ScriptContent:
      type: object
      description: |
        A script's resolved body for catalog display (GET /script-content/{name}).
        Read on demand from the synced clone; never stored. content is null when
        encoding=binary or the body could not be decoded as UTF-8.
      required: [content, encoding, truncated, byteLength, runType]
      properties:
        content:
          type: [string, 'null']
          readOnly: true
          description: The UTF-8 body, or null when encoding=binary.
        encoding:
          type: string
          readOnly: true
          enum: [utf8, binary]
          description: utf8 when the body is valid UTF-8; binary otherwise (content null).
        truncated:
          type: boolean
          readOnly: true
          description: True when the file exceeded the 1 MiB display cap and content is clipped.
        byteLength:
          type: integer
          readOnly: true
          description: Bytes returned (≤ the 1 MiB display cap).
        runType: { $ref: '#/components/schemas/RunType' }

    PendingRun:
      type: object
      description: |
        AR — a deferred ad-hoc run: a fully-validated manual trigger parked
        until runAt (the frozen Run-dialog envelope rides with it). Promoted
        into an ordinary Run at its instant (bounded catch-up after downtime:
        fires when found ≤24h late, else marked missed); visible on GET
        /schedules/upcoming (adHoc: true) until it fires, is cancelled, or is
        missed.
      properties:
        pending: { type: boolean, description: Always true — discriminates this 202 body from a Run. }
        id: { type: string, description: Pending-run id (cancellation handle). }
        jobName: { type: [string, 'null'] }
        jobSource: { type: [string, 'null'], enum: [git, amadeus, null] }
        workflowName: { type: [string, 'null'] }
        runAt: { type: string, format: date-time }
        scheduledBy: { type: string }

    Schedule:
      type: object
      description: |
        A first-class Schedule (A10a): a standalone named cron (+ optional env)
        referenceable by N jobs/workflows via scheduleRefs. source ∈ {git, amadeus}.
        git rows are Git-authored (read-only over the API); amadeus rows are
        operator-authored (Phase 3+).
      properties:
        uid:
          type: string
          readOnly: true
          description: >-
            AF-4a — stable surrogate identity; see Job.uid.
        skipCalendars:
          type: array
          items: { type: string }
          description: |
            Working calendars whose days suppress this schedule's fires (CAL).
            Read back as well as written: the update body is a full replace, so
            an editor that could not read this would silently clear it on any
            unrelated save.
        onlyCalendars:
          type: array
          items: { type: string }
          description: Working calendars whose days are the only days this schedule may fire on (CAL).
        name: { type: string, readOnly: true }
        source:
          type: string
          enum: [git, amadeus]
          readOnly: true
          description: Origin — git (Git-authored) or amadeus (operator-authored in-app).
        description: { type: [string, 'null'], readOnly: true }
        cron: { type: string, description: Cron expression (6-field with seconds, or 5-field). }
        env:
          type: [object, 'null']
          additionalProperties: { type: string }
          description: Optional plaintext env injected when this schedule fires (committed to Git for git rows).
        startAt:
          type: [string, 'null']
          format: date-time
          description: |
            Activation window start (AW): the schedule does not fire before this
            instant. null/absent ⇒ active immediately. A start already in the past
            is inert — there is no catch-up or backfill fire.
        endAt:
          type: [string, 'null']
          format: date-time
          description: |
            Activation window end (AW): the schedule does not fire after this
            instant. null/absent ⇒ never expires. An elapsed end leaves the entry
            listed (windowState=expired) rather than deleting it.
        interval:
          type: [string, 'null']
          description: |
            Anchored-interval mode (Phase 2): fire every N from startAt — a Go
            duration ("36h", "90m") or a day count ("7d"). MUTUALLY EXCLUSIVE
            with cron, and requires startAt as its phase anchor. Cron is
            calendar-positional and cannot express a repeating interval, which
            is why the anchor is mandatory. Minimum 1 minute.
        mode:
          type: string
          enum: [cron, interval, once]
          readOnly: true
          description: |
            Derived firing mode: `cron` (a cron expression), `interval` (every N
            from startAt) or `once` (a startAt with neither cron nor interval —
            fires exactly once). Clients read this rather than inferring the
            mode from which field happens to be populated.
        contentHash:
          type: string
          readOnly: true
          description: "sha256:-prefixed digest of cron+env; snapshotted on runs for reproducibility (§5.5)."
        sourcePath:
          type: [string, 'null']
          readOnly: true
          description: schedules/<name>.yaml in Git (null for amadeus rows).
        syncedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        createdAt: { type: [string, 'null'], format: date-time, readOnly: true }
        lastModifiedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        tags:
          type: array
          description: |
            Operator-authored tags (tags-support.md). Stored in SQLite ONLY (migration
            290) and set via PUT /schedule-tags/{name}. Never parsed from Git; preserved
            across syncs; [] when none. Present on both list and detail rows. WRITABLE
            (inline-editable).
          items: { type: string }
        usedByCount:
          type: integer
          readOnly: true
          description: Number of jobs/workflows referencing this schedule (blast-radius badge).
        usedBy:
          type: array
          readOnly: true
          description: Jobs/workflows referencing this schedule (detail responses only) — the reverse index.
          items:
            type: object
            properties:
              name: { type: string }
              kind: { type: string, enum: [job, workflow] }
              uid:
                type: string
                description: R2F-3 — the owner definition's permanent identity; absent on pre-identity rows.
              agencies:
                type: array
                items: { type: string }
                description: R2F-3 — the derived agency set behind this row's disambiguation badge. A name is suffixed with its agency ONLY when it is ambiguous within the set the viewer received, so the common single-agency install shows plain names.
    WorkflowStep:
      type: object
      description: One step in a workflow graph. type=parallel carries concurrent arms (leaf jobs or sequences, PS-1); type=sequence carries an ordered serial chain; branch conditions follow the prototype's branching model.
      properties:
        type:
          type: string
          enum: [job, parallel, branch, sequence, workflow]
        name: { type: string }
        label: { type: string }
        jobSource:
          type: string
          enum: [git, amadeus]
          description: A11 per-step source override; empty ⇒ the workflow's source, then fallback.
        jobUid:
          type: string
          description: |
            R2F-2 — pins this step to ONE job by its permanent identity. Since two
            departments may own a job of the same name (1.2.0), a name-only step
            whose name is ambiguous refuses at run time; setting this resolves the
            step in a single lookup with no jobSource precedence walk, and a uid
            that no longer resolves refuses rather than falling back to a
            same-named job. Write it TOGETHER with `name`: the name stays the
            human-readable reference everywhere (history, {fromStep}, YAML) and
            the pair must agree — a uid naming a different job is a 422. Omit for
            an unambiguous name-only reference; git-sourced workflows ignore it
            (names identify jobs within a repository).
        status: { $ref: '#/components/schemas/RunStatus' }
        durationMs: { type: [integer, 'null'] }
        inputs:
          type: object
          description: A12 — env KEY ← an upstream step's captured output ({fromStep, fromOutput}).
          additionalProperties:
            type: object
            properties:
              fromStep: { type: string }
              fromOutput: { type: string }
        outputs:
          type: array
          description: A12 — declared output keys this step exposes (advisory; the executor captures all emitted markers).
          items: { type: string }
        jobs:
          type: array
          description: Present when type=parallel — the concurrent arms (leaf jobs or sequences, PS-1).
          items: { $ref: '#/components/schemas/WorkflowStep' }
        steps:
          type: array
          description: Present when type=sequence — the ordered serial chain (PS-1).
          items: { $ref: '#/components/schemas/WorkflowStep' }
        condition:
          type: [object, 'null']
          description: Present when type=branch; expression evaluated against step outputs.
        pass:
          type: [object, 'null']
          description: Present when type=branch; the taken arm (an object with a steps list).
        fail:
          type: [object, 'null']
          description: Present when type=branch; the not-taken arm (an object with a steps list).
        retries:
          type: integer
          description: WB-R1 per-step retry override; unset ⇒ the job-definition default.
        backoffSeconds:
          type: integer
          description: WB-R1 per-step backoff override (seconds between attempts); unset ⇒ the job default.
        continueOnError:
          type: boolean
          description: WB-R1 per-step override; when true a still-failing step is skipped-and-proceeded instead of halting. Unset ⇒ the job default.
        workflow:
          type: string
          description: >-
            Present when type=workflow (SW) — the name of the sub-workflow this
            step runs. Separate from `name`, which is the step's position in the
            parent's results map (what `inputs.fromStep` addresses), so two steps
            may run the same sub-workflow with different inputs.


            The child executes as a REAL workflow run linked to this step, with
            its own History entry and its own cancellability. Only the step's
            `inputs` cross the boundary — the parent's env does not flow
            implicitly. Nesting is capped at 3 deep; cycles are rejected when
            authoring in-app and refused at run time.

    Workflow:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        uid:
          type: string
          readOnly: true
          description: >-
            AF-4a — stable surrogate identity; see Job.uid.
        name: { type: string, readOnly: true }
        source:
          type: string
          enum: [git, amadeus]
          readOnly: true
          description: Origin — git (Git-authored) or amadeus (operator-composed in-app, A11).
        sourcePath:
          type: string
          nullable: true
          readOnly: true
          description: Repo-relative file path (e.g. workflows/team/deploy.yaml), for folder browsing. Null for Compose-authored workflows.
        description: { type: string, readOnly: true }
        tags:
          type: array
          description: |
            Operator-authored tags (tags-support.md). Stored in SQLite ONLY (migration
            290) and set via PUT /workflow-tags/{workflowId}. Never parsed from Git;
            preserved across syncs; [] when none. Present on both list and detail rows.
            WRITABLE (inline-editable).
          items: { type: string }
        critical:
          type: boolean
          description: |
            Operator-set criticality (AN, migration 1060), written via
            PUT /workflow-annotation/{workflowId}. DISPLAY-ONLY: it colours a chip and adds a
            line to failure notifications. It does not route alerts, change queue
            priority or page anyone differently — giving it routing meaning is a
            semantic contract that needs a fleet audit first. Present on both list
            and detail rows, and always present: false is a real answer the UI
            acts on, so it does not omit.
        contact:
          type: string
          description: |
            Who to contact when this breaks. Free text rather than a user or
            agency reference, because the real answer is usually a distribution
            list or an on-call rotation that is not an Cronomicon user. ≤256 chars.
            Present on both list and detail rows; omitted when empty.
        notes:
          type: string
          description: |
            Operator notes — what this is for, what to check before re-running.
            Plain text with significant newlines: NOT markdown, and URLs are not
            linkified. ≤4096 chars. DETAIL ONLY, so a page of list rows does not
            carry 4KB each; omitted when empty.
        notesBy:
          type: string
          readOnly: true
          description: |
            The actor who last wrote the annotation. Server-assigned — attribution
            a client could set is attribution nobody can trust. Detail only.
        notesAt:
          type: string
          format: date-time
          readOnly: true
          description: |
            When the annotation was last written (RFC3339, UTC). Server-assigned,
            and paired with notesBy so staleness is visible. Detail only.
        status: { $ref: '#/components/schemas/RunStatus' }
        schedule: { type: string }
        disabled:
          type: boolean
          description: Per-instance override; the documented exception to Git-canonicality (§2.4).
        lastRunAt: { type: [string, 'null'], format: date-time, readOnly: true }
        lastSkippedAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: >-
            FX-D1 — when this workflow's most recent SUPPRESSED fire was recorded. The twin of the
            Job field: kept apart from lastRunAt, which reports the last fire that EXECUTED.
        lastSkipReason:
          type: [string, 'null']
          readOnly: true
          description: Why that fire was suppressed.
        nextRunAt: { type: [string, 'null'], format: date-time, readOnly: true }
        createdAt: { type: [string, 'null'], format: date-time, readOnly: true }
        lastModifiedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        agencies:
          type: array
          readOnly: true
          items: { type: string }
          description: >-
            DERIVED, display-only (RB-23). A workflow has no scope of its own, so
            this is the UNION of its constituent jobs' scope→agency memberships —
            the same walk that authorizes a workflow trigger, so a workflow
            spanning two departments lists both rather than picking one. Never
            stored, never authored, and never an access control. Absent when no
            constituent job's scope belongs to an agency.
        steps:
          type: array
          items: { $ref: '#/components/schemas/WorkflowStep' }
        layout:
          type: object
          nullable: true
          readOnly: true
          description: |
            Advisory canvas node positions (WC-P7) — a {nodeId: {x, y}} map the graph
            editor uses to restore a hand-arranged layout. Presentation only: never
            affects step execution order or steps_hash. Null/absent ⇒ dagre auto-layout.
          additionalProperties:
            type: object
            properties:
              x: { type: number }
              y: { type: number }
        schedules:
          type: array
          readOnly: true
          description: Multi-entry schedule list (detail responses only); mirrors spec.schedules in the workflow YAML.
          items: { $ref: '#/components/schemas/ScheduleEntry' }

    WorkflowComposeInput:
      type: object
      description: Request body for composing (POST) or editing (PUT) an amadeus-source workflow (A11).
      required: [steps]
      properties:
        name: { type: string, description: "Workflow name (slug). Immutable on edit." }
        description: { type: string }
        enabled: { type: boolean }
        steps:
          type: array
          description: The step graph (job/parallel/branch). Each job step's referenced job must exist.
          items: { $ref: '#/components/schemas/WorkflowStep' }
        scheduleRefs:
          type: array
          description: Names of first-class schedules to bind (A10a).
          items: { type: string }
        schedules:
          type: array
          description: Inline named schedules (cron + optional env).
          items:
            type: object
            required: [name, cron]
            properties:
              name: { type: string }
              cron: { type: string }
              env: { type: object, additionalProperties: { type: string } }
              startAt:
                type: [string, 'null']
                format: date-time
                description: Activation window start (AW) — the entry does not fire before this instant. null/absent ⇒ active immediately.
              endAt:
                type: [string, 'null']
                format: date-time
                description: Activation window end (AW) — the entry does not fire after this instant. null/absent ⇒ never expires.
              interval:
                type: [string, 'null']
                description: Anchored-interval mode — fire every N from startAt ("7d", "36h"). Mutually exclusive with cron; requires startAt as the anchor.
              skipCalendars:
                type: array
                items: { type: string }
                description: Working calendars whose days suppress this entry's fires (CAL).
              onlyCalendars:
                type: array
                items: { type: string }
                description: Working calendars whose days are the only days this entry may fire on (CAL).
        layout:
          type: object
          nullable: true
          description: |
            Advisory canvas node positions (WC-P7) — a {nodeId: {x, y}} map. Stored
            verbatim in workflows.layout_json; never affects step execution order or
            steps_hash. Omit to preserve any existing layout.
          additionalProperties:
            type: object
            properties:
              x: { type: number }
              y: { type: number }

    WorkflowValidationResult:
      type: object
      description: Result of the WB-A1 dry-run validate endpoint. Returned with 200; `ok` is false when `errors` is non-empty.
      required: [ok, errors]
      properties:
        ok: { type: boolean, description: True when the step graph has no validation errors. }
        errors:
          type: array
          items: { $ref: '#/components/schemas/WorkflowValidationError' }

    WorkflowValidationError:
      type: object
      description: One structural/enum/referential problem found in a workflow step graph (WB-S5).
      required: [message]
      properties:
        step: { type: string, description: Name (or label) of the offending step, when known. }
        field: { type: string, description: "The offending property (e.g. condition.operator, inputs.KEY), when narrowed." }
        message: { type: string }

    ScheduleInput:
      type: object
      description: |
        Request body for authoring (POST) or editing (PUT) an amadeus-source
        first-class Schedule (schedule-builder). On edit, name is taken from the path
        and is immutable; cron/env propagate to every referencing job/workflow.
      required: [cron]
      properties:
        name: { type: string, description: "Schedule name (slug, [a-z0-9][a-z0-9_-]*). Required on create; immutable on edit." }
        cron: { type: string, description: Cron expression (6-field with seconds, or 5-field). }
        env:
          type: object
          additionalProperties: { type: string }
          description: Optional plaintext env injected when this schedule fires.
        description: { type: string }
        startAt:
          type: [string, 'null']
          format: date-time
          description: |
            Activation window start (AW): the schedule does not fire before this
            instant. null/absent ⇒ active immediately. A start already in the past
            is inert — there is no catch-up or backfill fire.
        endAt:
          type: [string, 'null']
          format: date-time
          description: |
            Activation window end (AW): the schedule does not fire after this
            instant. null/absent ⇒ never expires. An elapsed end leaves the entry
            listed (windowState=expired) rather than deleting it.
        interval:
          type: [string, 'null']
          description: |
            Anchored-interval mode (Phase 2): fire every N from startAt — a Go
            duration ("36h", "90m") or a day count ("7d"). MUTUALLY EXCLUSIVE
            with cron, and requires startAt as its phase anchor. Cron is
            calendar-positional and cannot express a repeating interval, which
            is why the anchor is mandatory. Minimum 1 minute.
        skipCalendars:
          type: array
          items: { type: string }
          description: |
            Working calendars whose days SUPPRESS a fire landing on them (CAL).
            Evaluated as a veto: it wins over onlyCalendars, so naming both is
            legal and unambiguous ("only on fiscal-close days, but never on a
            holiday"). Unknown names are rejected (422).
        onlyCalendars:
          type: array
          items: { type: string }
          description: |
            Working calendars whose days are the ONLY days this entry may fire on;
            a fire landing elsewhere is suppressed. Union across several, because
            naming two means "either of these". A global calendar may not be used
            here.

    # ── Working calendars ────────────────────────────────────────────────────
    Reaction:
      type: object
      description: |
        One authored reaction, as served. The owner is the definition that RUNS;
        the `on*` fields identify the definition being WATCHED.
      properties:
        ownerKind: { type: string, enum: [job, workflow] }
        ownerName: { type: string }
        ownerSource: { type: string, enum: [git, amadeus] }
        name:
          type: string
          description: The reaction's entry name, unique within its owner.
        onKind: { type: string, enum: [job, workflow] }
        onName: { type: string }
        onSource: { type: string, enum: [git, amadeus] }
        onOutcome: { $ref: '#/components/schemas/ReactionOutcome' }
        delaySeconds: { type: integer, minimum: 0 }
        minIntervalSeconds: { type: integer, minimum: 0 }
        includeWorkflowChildren: { type: boolean }
        enabled: { type: boolean }
        position: { type: integer }
        missing:
          type: boolean
          description: |
            The WATCHED definition no longer exists, so this reaction can never
            fire. Deleting a watched definition never cascades its reactions
            away — that would be a silent capability loss — so dangling is a
            supported state: the interactive delete path refuses unless forced,
            but the Git sync prune has no request to fail and no operator to
            ask, and always leaves them dangling.

    ReactionInput:
      type: object
      required: [name, onKind, onName, onOutcome]
      properties:
        name:
          type: string
          description: >-
            Slug form: lowercase letters, digits, hyphen or underscore.
        onKind: { type: string, enum: [job, workflow] }
        onName: { type: string }
        onSource:
          type: string
          enum: [git, amadeus]
          default: git
          description: |
            The watched definition's source. Settable rather than assumed, so a
            reaction can cross the Git/in-app boundary in either direction.
        onOutcome: { $ref: '#/components/schemas/ReactionOutcome' }
        delaySeconds:
          type: integer
          minimum: 0
          default: 0
          description: Defer the resulting run by this many seconds after the upstream finishes.
        minIntervalSeconds:
          type: integer
          minimum: 0
          default: 0
          description: |
            Storm brake. An event arriving within this interval of the last FIRED
            one is dropped, not deferred — unlike a concurrency-cap deferral the
            event has already been consumed, so there is no instant to retry at.
            0 disables it.

            Refused if it exceeds the run-retention window: the brake anchors on
            the last fired delivery, and that log is pruned with runs, so a
            longer interval would silently disarm itself.
        includeWorkflowChildren:
          type: boolean
          default: false
          description: |
            By default a job run that belongs to a WORKFLOW emits no reaction:
            otherwise the parent workflow grows fan-out that appears nowhere in
            its step graph. Set this for the rare deliberate case.
        enabled: { type: boolean, default: true }

    ReactionOutcome:
      type: string
      enum: [success, failure, stopped, any]
      description: |
        The normalised terminal outcome to match. Jobs have five terminal states
        and workflows are binary, so both are projected onto this set before
        matching.

        `success` includes a job that exited with warnings — it ran and it
        finished. `stopped` means a human ended the upstream and did NOT say
        what it meant: an unclassified stop, or a cancelled workflow. It is
        deliberately separate from `failure` because folding the two together
        fires your rollback automation while you are already hands-on, and
        folding `stopped` into nothing silently skips the cleanup that releases
        a lock. A stop the operator DID classify follows that classification.

        `any` matches all three, and never a run that did not happen — a
        calendar-suppressed or skipped run is not an event.

        Note that `killed` and `warning` are NOT valid here: they are run
        statuses that normalisation has already folded into `stopped` and
        `success`, so accepting them would let you author a reaction that can
        never fire.

    Calendar:
      type: object
      description: |
        A named set of wall-clock dates. Bound to schedule entries in two
        polarities; see ScheduleInput.skipCalendars / onlyCalendars.
      properties:
        name: { type: string }
        source: { type: string, description: "Always 'amadeus' — calendars are operator-authored, never Git-authored." }
        description: { type: string }
        global:
          type: boolean
          description: |
            Union this calendar's days into EVERY entry's skip set, whether or not
            the entry names it — the change-freeze case, one flag instead of N
            schedule edits. SKIP POLARITY ONLY: a global calendar may not be bound
            as a run-day (only) calendar, and a calendar already bound that way
            cannot be made global.
        recordSuppressed:
          type: boolean
          description: |
            Record only-mode suppressions in History. Off by default: skip-mode
            suppressions always record (that is the compliance question), while a
            weekdays-only entry would otherwise write an audit row every weekend.
        dayCount: { type: integer, readOnly: true }
        lastDay:
          type: [string, 'null']
          readOnly: true
          description: Newest date in the calendar (YYYY-MM-DD); null when empty.
        daysRemaining:
          type: [integer, 'null']
          readOnly: true
          description: |
            Whole days from today to lastDay, NEGATIVE once it has passed. An
            expired skip calendar simply stops suppressing and holiday runs resume
            with nothing else saying so, which is what this field exists to catch.
        usedBy:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/CalendarBinding' }
        days:
          type: array
          description: Present on the single-calendar GET; omitted from the list response.
          items: { $ref: '#/components/schemas/CalendarDay' }
        createdBy: { type: string, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }

    CalendarDay:
      type: object
      required: [day]
      properties:
        day: { type: string, description: "Wall-clock date, strict YYYY-MM-DD. Matched in the effective app timezone, never UTC." }
        label: { type: string, description: "Human label shown as the suppression reason (e.g. \"Independence Day (observed)\")." }

    CalendarBinding:
      type: object
      description: One schedule entry that names a calendar.
      properties:
        ownerKind: { type: string, enum: [job, workflow] }
        ownerName: { type: string }
        ownerSource: { type: string, enum: [git, amadeus] }
        ownerUid:
          type: string
          description: R2F-3 — the owner definition's permanent identity; absent for first-class-schedule bindings, which have no job/workflow owner.
        ownerAgencies:
          type: array
          items: { type: string }
          description: R2F-3 — the derived agency set behind this row's disambiguation badge. A name is suffixed with its agency ONLY when it is ambiguous within the set the viewer received, so the common single-agency install shows plain names.
        scheduleName: { type: string }
        polarity: { type: string, enum: [skip, only] }

    CalendarInput:
      type: object
      description: Request body for creating or updating a calendar.
      properties:
        name: { type: string, description: "Calendar name (slug). Required on create; immutable on edit." }
        description: { type: string }
        global: { type: boolean }
        recordSuppressed: { type: boolean }
        days:
          type: array
          description: Accepted on CREATE only, as a convenience so a calendar and its dates arrive together. Ignored by PUT.
          items: { $ref: '#/components/schemas/CalendarDay' }

    # ── Schedules ────────────────────────────────────────────────────────────
    ScheduleEntry:
      type: object
      description: One named schedule entry on a job or workflow definition.
      properties:
        name: { type: string, description: Entry name; 'default' for a legacy single schedule. }
        cron: { type: string, description: Cron expression (6-field with seconds, or 5-field). }
        env:
          type: object
          additionalProperties: { type: string }
          description: Plaintext env injected when this entry fires (committed to Git in plaintext; not redacted).
        nextRunAt: { type: [string, 'null'], format: date-time, readOnly: true }
        skipCalendars:
          type: array
          items: { type: string }
          description: Working calendars whose days suppress this entry's fires (CAL).
        onlyCalendars:
          type: array
          items: { type: string }
          description: Working calendars whose days are the only days this entry may fire on (CAL).
        sourceRef:
          type: [string, 'null']
          readOnly: true
          description: |
            Name of the first-class schedule this entry was expanded from
            (definition_schedules.source_ref); null ⇒ an inline, job-local entry.
            Lets the composer distinguish a bound scheduleRef from an inline schedule
            on edit (JC8).
        startAt:
          type: [string, 'null']
          format: date-time
          description: |
            Activation window start (AW): the schedule does not fire before this
            instant. null/absent ⇒ active immediately. A start already in the past
            is inert — there is no catch-up or backfill fire.
        endAt:
          type: [string, 'null']
          format: date-time
          description: |
            Activation window end (AW): the schedule does not fire after this
            instant. null/absent ⇒ never expires. An elapsed end leaves the entry
            listed (windowState=expired) rather than deleting it.
        windowState:
          type: string
          enum: [pending, active, expired]
          readOnly: true
          description: |
            Derived activation-window state (AW): pending before startAt, expired
            after endAt, active while inside a window. Absent for an entry with no
            window. Orthogonal to enabled/paused, which are definition-level and
            still take precedence in the collapsed display status.
        interval:
          type: [string, 'null']
          description: |
            Anchored-interval mode (Phase 2): fire every N from startAt — a Go
            duration ("36h", "90m") or a day count ("7d"). MUTUALLY EXCLUSIVE
            with cron, and requires startAt as its phase anchor. Cron is
            calendar-positional and cannot express a repeating interval, which
            is why the anchor is mandatory. Minimum 1 minute.
        mode:
          type: string
          enum: [cron, interval, once]
          readOnly: true
          description: |
            Derived firing mode: `cron` (a cron expression), `interval` (every N
            from startAt) or `once` (a startAt with neither cron nor interval —
            fires exactly once). Clients read this rather than inferring the
            mode from which field happens to be populated.

    ScheduleEntryStatus:
      type: object
      description: A schedule entry plus its owning definition's runtime state (a GET /schedules row).
      properties:
        skipCalendars:
          type: array
          items: { type: string }
          description: Working calendars whose days suppress this entry's fires (CAL).
        onlyCalendars:
          type: array
          items: { type: string }
          description: Working calendars whose days are the only days this entry may fire on (CAL).
        ownerKind: { type: string, enum: [job, workflow] }
        ownerName: { type: string }
        ownerUid:
          type: string
          description: R2F-3 — the owning definition's permanent identity, so two same-named owners can be told apart. Empty on pre-identity rows.
        ownerAgencies:
          type: array
          items: { type: string }
          description: R2F-3 — the derived agency set behind this owner's disambiguation badge. Present for JOB owners (derived from the job's scope); a workflow owner has no scope of its own and carries none, so it renders its bare name.
        ownerSource:
          type: string
          enum: [git, amadeus]
          description: |
            Origin of the owning definition. Part of a row's identity — a name can
            recur across the git and amadeus sources — and the third segment of the
            "kind:source:name" key the calendarRollup map (CAL-12) is keyed by.
        scheduleName: { type: string }
        cron: { type: string }
        env:
          type: [object, 'null']
          additionalProperties: { type: string }
        enabled: { type: boolean }
        paused: { type: boolean }
        nextRunAt: { type: [string, 'null'], format: date-time, readOnly: true }
        lastRunAt: { type: [string, 'null'], format: date-time, readOnly: true }
        startAt:
          type: [string, 'null']
          format: date-time
          description: |
            Activation window start (AW): the schedule does not fire before this
            instant. null/absent ⇒ active immediately. A start already in the past
            is inert — there is no catch-up or backfill fire.
        endAt:
          type: [string, 'null']
          format: date-time
          description: |
            Activation window end (AW): the schedule does not fire after this
            instant. null/absent ⇒ never expires. An elapsed end leaves the entry
            listed (windowState=expired) rather than deleting it.
        windowState:
          type: string
          enum: [pending, active, expired]
          readOnly: true
          description: |
            Derived activation-window state (AW): pending before startAt, expired
            after endAt, active while inside a window. Absent for an entry with no
            window. Orthogonal to enabled/paused, which are definition-level and
            still take precedence in the collapsed display status.
        interval:
          type: [string, 'null']
          description: |
            Anchored-interval mode (Phase 2): fire every N from startAt — a Go
            duration ("36h", "90m") or a day count ("7d"). MUTUALLY EXCLUSIVE
            with cron, and requires startAt as its phase anchor. Cron is
            calendar-positional and cannot express a repeating interval, which
            is why the anchor is mandatory. Minimum 1 minute.
        mode:
          type: string
          enum: [cron, interval, once]
          readOnly: true
          description: |
            Derived firing mode: `cron` (a cron expression), `interval` (every N
            from startAt) or `once` (a startAt with neither cron nor interval —
            fires exactly once). Clients read this rather than inferring the
            mode from which field happens to be populated.

    ScheduleUpcoming:
      type: object
      description: A single projected fire of a schedule entry (a GET /schedules/upcoming item).
      properties:
        ownerKind: { type: string, enum: [job, workflow] }
        ownerName: { type: string }
        ownerUid:
          type: string
          description: R2F-3 — the owning definition's permanent identity, so two same-named owners can be told apart. Empty on pre-identity rows.
        ownerAgencies:
          type: array
          items: { type: string }
          description: R2F-3 — the derived agency set behind this owner's disambiguation badge. Present for JOB owners (derived from the job's scope); a workflow owner has no scope of its own and carries none, so it renders its bare name.
        scheduleName: { type: string }
        cron: { type: string }
        at: { type: string, format: date-time, description: Absolute instant of the projected fire. }
        adHoc:
          type: boolean
          description: >-
            AR — true for a deferred ad-hoc run (a parked manual trigger), absent/false for a
            standing-schedule projection. FX2-D3: this is PROVENANCE, not gate-state — it says
            who parked the row, and stays true for an operator's deferral that is currently
            held (paused, frozen, or its owner in the recycle bin; read `waitingOn` for that).
            False for a Queue-policy hold and for a reaction-parked row: those are fires
            waiting, not something a person scheduled.
        pendingId: { type: [string, 'null'], description: The pending-run id (cancellation handle). Present for any parked row — ad-hoc or gate-held — since it is the cancellation handle for both. }
        scheduledBy: { type: [string, 'null'], description: Who scheduled the run. Present for any parked row; reads 'scheduler' for a gate-held cron fire. }
        waitingOn: { type: [string, 'null'], description: 'Which gate holds a parked row: concurrency (Queue policy) or recycleBin (owner is in the recycle bin). Absent for an ungated ad-hoc deferral.' }
        suppressed:
          type: boolean
          description: |
            A working calendar will suppress this fire (CAL). Suppressed instants
            are ANNOTATED, never dropped: the Upcoming view is the one place a
            holiday gap is worth seeing. Clients that answer "what runs next"
            (the dashboard tile, the health score) must EXCLUDE these — a
            suppressed fire is not an upcoming run.
        suppressedBy: { type: string, description: Name of the calendar responsible. }
        suppressedLabel: { type: string, description: The day's label in that calendar, when it has one. }

    # ── Runs ─────────────────────────────────────────────────────────────────
    Run:
      type: object
      properties:
        reactedToRunId:
          type: [string, 'null']
          readOnly: true
          description: |
            RX — the run whose completion CAUSED this one, for a reaction-fired
            run; null for every other run, which is every run that existed before
            reactions. This is the durable half of History's "why did this run?"
            answer: it lives on the run row rather than only in the delivery log,
            because that log is retention-pruned and a provenance link that
            evaporated with it would not be a trail.

            The REVERSE direction — "what did this run trigger?" — is the
            `?reactedTo=` filter on this endpoint and on /workflow-runs, since a
            run has no list of its children and building one would duplicate a
            fact the child already owns. Query both: a reaction can fire either
            kind, so asking only one answers half the graph.
        reactionDepth:
          type: integer
          readOnly: true
          description: |
            How many reaction hops produced this run (0 for anything not caused
            by a reaction). Inherited as upstream + 1 and refused at a fixed
            ceiling, which is the backstop for cycles static detection cannot
            see.
        suppressedByCalendar:
          type: [string, 'null']
          readOnly: true
          description: |
            Name of the working calendar that suppressed this scheduled fire (CAL);
            null on every run that actually happened. This is the STRUCTURED
            provenance the ?calendar= history filter matches on — statusReason
            carries the human wording and is free to be reworded.
        traceId:
          type: string
          format: uuid
          readOnly: true
          description: Backend-minted UUIDv7 (S11); opaque, time-sortable.
        jobId: { type: integer, readOnly: true }
        jobUid:
          type: [string, 'null']
          readOnly: true
          description: |
            R2-1 — the permanent identity of the job this run executed, frozen
            at enqueue (like entityCode) rather than resolved at read time, so a
            run stays attributable after its job is renamed, re-created or
            deleted. Null on historical rows whose job was already gone when
            migration 1010 backfilled. Unlike `jobName` it never comes to mean
            two jobs, and unlike `jobId` (a database rowid) it is never reused —
            key integrations on this.
        jobName: { type: string, readOnly: true }
        jobSource:
          type: string
          enum: [git, amadeus]
          readOnly: true
          description: Origin of the job this run executed (A9; NULL legacy runs report git).
        outputs:
          type: [object, 'null']
          additionalProperties: { type: string }
          readOnly: true
          description: Captured inter-job outputs (A12) — KEY=value pairs a downstream workflow step can consume.
        overrides:
          type: [object, 'null']
          readOnly: true
          description: |
            F3 — the ad-hoc override envelope an operator supplied at trigger time
            (only the fields actually overridden). NULL ⇒ a plain scheduled/default/
            workflow run. Audit/reproducibility record; the effective values also
            appear in scope / targetHost / executor and the run's injected env.
          properties:
            env: { type: object, additionalProperties: { type: string } }
            hosts: { type: array, items: { type: string } }
            groups:
              type: array
              items: { type: string }
              description: |
                M3 — inventory GROUP names the operator limited this run to. Expanded
                to member hosts on the SSH executor; passed as ansible --limit on a
                runner run.
            ansibleLimit:
              type: string
              description: |
                M3/OD-15 — raw ansible --limit pattern supplied at trigger time, for
                selections the host/group pickers can't express. Mutually exclusive
                with hosts/groups (RP-Q4); ansible run types only.
            ansibleCheck: { type: boolean, description: "Phase 3 — the run was a --check dry run." }
            ansibleDiff: { type: boolean, description: "Phase 3 — --diff was requested." }
            ansibleTags:
              type: array
              items: { type: string }
              description: "Phase 3 — the --tags selection this run was limited to."
            ansibleSkipTags:
              type: array
              items: { type: string }
              description: "Phase 3 — the --skip-tags exclusion applied to this run."
            ansibleVerbosity: { type: integer, description: "Phase 3 — -v level (1–4); absent ⇒ normal." }
            ansibleBecome: { type: boolean, description: "Phase 3 — --become was requested." }
            ansibleBecomeUser: { type: string, description: "Phase 3 — --become-user target." }
            ansibleExtraVars:
              type: object
              additionalProperties: { type: string }
              description: |
                Phase 3 — operator-supplied `-e` extra-vars. Recorded verbatim: the
                envelope is un-redacted (JC12), which is another reason secret
                material must never be passed here.
            sshUser:
              type: string
              description: |
                CA — the "connect as" username the operator overrode for this run
                (names only). Absent when the run took its identity from the job
                spec or the per-host/inventory wiring — the envelope records only
                what the operator actually typed (JC12).
            sshCredential:
              type: string
              description: |
                CA — the stored SSH credential LABEL the operator selected for this
                run. Label only; key bytes never ride the envelope.
            scope: { type: string }
            executor: { type: string, enum: [runner, ssh] }
            references:
              type: array
              items:
                type: object
                properties:
                  kind: { type: string, enum: [secret, var, key] }
                  name: { type: string }
              description: |
                V2-11 — stored references the operator ADDED to this run at trigger
                time (kind + bare name; additive over the job's/script's declared
                bindings). Names only, never values (JC12 — the envelope is
                un-redacted).
            reviewedSections:
              type: array
              items: { type: string }
              description: |
                RV — the Run dialog sections the operator had open before running.
                Absent for API/scheduled/workflow runs and for pre-RV clients.
            promptWarnings:
              type: array
              items: { type: string }
              description: |
                Names of declared REQUIRED run inputs (JobPrompt.required) that were empty
                in the run's effective env at trigger time (UDV4/UDV6). Server-derived and
                advisory — recording one never blocks the run. Absent when none unfilled.
            promptAnswers:
              type: object
              additionalProperties: { type: string }
              description: |
                Operator-supplied audit metadata (T2.4): declared-input name → where its
                value came from ("typed" | "default" | "override" | "job env"). Keys the job
                does not declare are dropped server-side. Absent when the caller omits it.
            promptAcknowledged:
              type: boolean
              description: |
                True when the operator explicitly proceeded past an unfilled required input
                via "Run anyway" (T2.4). Distinguishes "was warned and proceeded" from
                "nobody looked". Never suppresses promptWarnings.
        type: { $ref: '#/components/schemas/RunType' }
        kind:
          type: string
          enum: [job, ssh-test]
          readOnly: true
          description: Discriminates ordinary job runs from synthetic SSH "Test connection" diagnostic runs (V1.1-2). ssh-test runs are badged in History and excluded from job-failure metrics.
        scope: { type: string }
        targetHost: { type: [string, 'null'], readOnly: true, description: Single-host target when not a scope fan-out (EX.3/EX.5). }
        executor:
          type: string
          enum: [runner, ssh]
          readOnly: true
          description: Execution method resolved at trigger and frozen on the run (EX.3). ssh ⇒ in-app SSH executor; runner ⇒ out-of-process agent (V2).
        status: { $ref: '#/components/schemas/RunStatus' }
        statusReason:
          type: [string, 'null']
          readOnly: true
          description: e.g. log_stream_lost, drain_timeout, vault_unreachable, killed.
        manual: { type: boolean, readOnly: true }
        triggeredBy:
          type: [string, 'null']
          readOnly: true
          description: User email for manual runs; null for scheduler-triggered.
        killedBy: { type: [string, 'null'], readOnly: true }
        runnerId: { type: [string, 'null'], readOnly: true, description: UUID of the runner that executed this run; null for in-app SSH runs or deregistered runners (runs.runner_id is ON DELETE SET NULL). }
        runnerTag:
          type: [string, 'null']
          readOnly: true
          description: |
            RT — the runner pin this run was dispatched WITH, frozen at trigger
            time from the four-rung precedence (per-run override → job operator
            override → job declared pin → unpinned). null ⇒ unpinned.

            Distinct from `runnerId`, and the pair is the point: this is INTENT
            and `runnerId` is OUTCOME. A queued run has this and not that; a run
            that waited a long time shows which tag it was waiting for.
        workflowTraceId:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: FK to the owning workflow run, if any (S3 — real FK, not string convention).
        scheduleName:
          type: [string, 'null']
          readOnly: true
          description: Schedule entry that fired this run; null for manual/workflow-child runs.
        scriptRef:
          type: [string, 'null']
          readOnly: true
          description: Name of the Script this run executed, snapshotted at enqueue (B-Git §3.3); null for legacy inline jobs.
        contentHash:
          type: [string, 'null']
          readOnly: true
          description: "sha256: content hash of the executed body, snapshotted at enqueue so History stays truthful after a shared script is edited."
        queuedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        startedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        completedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        durationMs: { type: [integer, 'null'], readOnly: true }
        exitCode: { type: [integer, 'null'], readOnly: true }
        logArchivedAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: |
            When the S3 archive sweep verified this run's log in the bucket
            (SL-1/SL-3). Null until the sweep reaches it, and always null on a
            local-only backend. Once set, the log read falls back to the
            archive when the local file has been reaped.

    WorkflowRun:
      type: object
      properties:
        traceId: { type: string, format: uuid, readOnly: true }
        workflowId: { type: integer, readOnly: true }
        workflowUid:
          type: [string, 'null']
          readOnly: true
          description: |
            R2-1 — the permanent identity of the workflow this run executed,
            frozen at insert. The jobs-side `jobUid` argument applies verbatim:
            it survives rename and deletion, never repeats, and is what a
            workflow's history should be keyed on.
        workflowName: { type: string, readOnly: true }
        agencies:
          type: array
          readOnly: true
          items: { type: string }
          description: |
            R2F-3 — the derived agency set behind this row's disambiguation badge. A name is suffixed with its agency ONLY when it is ambiguous within the set the viewer received, so the common single-agency install shows plain names.
            A workflow has no scope of its own, so this is the union over its
            constituent jobs — the same set the Workflows catalog shows, keyed on
            `workflowUid`, so a run and its definition cannot disagree about
            whose it is. Empty when the run predates the identity backfill.
        status: { $ref: '#/components/schemas/RunStatus' }
        scope: { type: string }
        triggeredBy: { type: [string, 'null'], readOnly: true }
        scheduleName: { type: [string, 'null'], readOnly: true, description: Schedule entry that fired this workflow run; null for manual. }
        statusReason: { type: [string, 'null'], readOnly: true, description: Why a run is in its current state — carries the suppression message on a calendar-skipped fire. }
        triggerKind: { type: [string, 'null'], readOnly: true, description: 'manual | scheduled | webhook | reaction.' }
        reactedToRunId:
          type: [string, 'null']
          readOnly: true
          description: |
            RX — the run whose completion CAUSED this one, for a reaction-fired
            run; null for every other run, which is every run that existed before
            reactions. This is the durable half of History's "why did this run?"
            answer: it lives on the run row rather than only in the delivery log,
            because that log is retention-pruned and a provenance link that
            evaporated with it would not be a trail.

            The REVERSE direction — "what did this run trigger?" — is the
            `?reactedTo=` filter on this endpoint and on /workflow-runs, since a
            run has no list of its children and building one would duplicate a
            fact the child already owns. Query both: a reaction can fire either
            kind, so asking only one answers half the graph.
        reactionDepth:
          type: integer
          readOnly: true
          description: |
            How many reaction hops produced this run (0 for anything not caused
            by a reaction). Inherited as upstream + 1 and refused at a fixed
            ceiling, which is the backstop for cycles static detection cannot
            see.
        suppressedByCalendar:
          type: [string, 'null']
          readOnly: true
          description: |
            CAL — name of the working calendar that suppressed this scheduled
            workflow fire; null on every run that actually happened. Suppressed
            workflow fires left no record at all before this, so unlike the jobs
            side there are no historical rows to reinterpret.
        startedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        completedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        durationMs: { type: [integer, 'null'], readOnly: true }
        cancelled:
          type: boolean
          readOnly: true
          description: True when the run was soft-cancelled (WB-S2); the status then displays as 'cancelled'.
        jobTraceIds:
          type: array
          readOnly: true
          items: { type: string, format: uuid }

    WorkflowRunDetail:
      allOf:
        - $ref: '#/components/schemas/WorkflowRun'
        - type: object
          properties:
            steps:
              type: array
              items: { $ref: '#/components/schemas/WorkflowRunStep' }
            graph:
              type: array
              readOnly: true
              description: |
                The executed step graph (WB-D1 per-run snapshot) with each node's
                live status/duration merged, shaped for grouped parallel/branch
                rendering (WB-O3). Null/absent for a pre-snapshot run.
              items: { $ref: '#/components/schemas/WorkflowRunGraphStep' }

    WorkflowRunGraphStep:
      type: object
      description: One node of a workflow run's executed step graph (snapshot + live status), shaped for StepChain rendering (WB-D1/O3).
      properties:
        type: { type: string, enum: [job, parallel, branch, sequence, workflow] }
        name: { type: string }
        label: { type: string }
        id: { type: string, description: Child-run trace id for a job node (drill-in to its log). }
        status: { $ref: '#/components/schemas/RunStatus' }
        durationMs: { type: [integer, 'null'] }
        jobs:
          type: array
          description: Present when type=parallel — the concurrent arms (leaf jobs or sequence nodes, PS-1).
          items: { $ref: '#/components/schemas/WorkflowRunGraphStep' }
        steps:
          type: array
          description: Present when type=sequence — the ordered serial chain (PS-1).
          items: { $ref: '#/components/schemas/WorkflowRunGraphStep' }
        condition:
          type: [object, 'null']
          description: Present when type=branch — the rendered label plus the structured predicate (WC-R1).
          properties:
            label: { type: string }
            type: { type: string }
            jobRef: { type: string }
            field: { type: string }
            operator: { type: string }
            value: { type: string }
        pass:
          type: array
          description: Present when type=branch — the pass arm's full nested step sequence (WC-R1).
          items: { $ref: '#/components/schemas/WorkflowRunGraphStep' }
        fail:
          type: array
          description: Present when type=branch — the fail arm's full nested step sequence (WC-R1).
          items: { $ref: '#/components/schemas/WorkflowRunGraphStep' }

    WorkflowRunStep:
      type: object
      description: Hierarchical step history — system actions + job/parallel/branch/sequence steps + context snapshots (WORKFLOW_STEP_DETAILS).
      properties:
        id: { type: string, readOnly: true }
        stepIndex: { type: integer }
        stepType:
          type: string
          # The kind of the node's TOP-LEVEL container step. 'sequence' arrived
          # with PS-1 (v0.55.17) — a top-level serial chain — but was never added
          # here, so the spec forbade a value the server had been emitting.
          enum: [system, job, parallel, branch, sequence, workflow]
        stepName: { type: string }
        status: { $ref: '#/components/schemas/RunStatus' }
        jobType: { $ref: '#/components/schemas/RunType' }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        durationMs: { type: [integer, 'null'] }
        detail: { type: [string, 'null'] }
        logFilePath: { type: [string, 'null'], readOnly: true }
        contextSnapshot:
          type: [object, 'null']
          additionalProperties: { type: string }

    # ── Activity ─────────────────────────────────────────────────────────────
    ActivityEntry:
      type: object
      description: |
        Discriminated union on `kind`. run-* entries carry job fields;
        workflow-* carry workflow fields; config carries category/action/
        target/details; gitsync carries inventory/summary; push carries
        scheduleFile/commitSha/summary.
      required: [id, kind, at, actor]
      properties:
        id: { type: integer, readOnly: true }
        kind: { $ref: '#/components/schemas/ActivityKind' }
        outcome: { $ref: '#/components/schemas/ActivityOutcome' }
        actor:
          type: string
          description: User email, or "scheduler" for system-triggered events.
        at: { type: string, format: date-time, readOnly: true }
        # run-start / run-end
        jobId: { type: [integer, 'null'] }
        jobUid:
          type: [string, 'null']
          description: |
            R2-1 — the permanent identity of the job this entry concerns. NULL on
            rows the 1010 backfill could not attribute (the name existed in both
            source pools, or the definition was already gone); such rows never
            carry a disambiguation badge, because they genuinely cannot be told
            apart.
        jobName: { type: [string, 'null'] }
        agencies:
          type: array
          items: { type: string }
          description: R2F-3 — the derived agency set behind this row's disambiguation badge. A name is suffixed with its agency ONLY when it is ambiguous within the set the viewer received, so the common single-agency install shows plain names.
        type: { $ref: '#/components/schemas/RunType' }
        scope: { type: [string, 'null'] }
        traceId: { type: [string, 'null'], format: uuid }
        durationMs: { type: [integer, 'null'] }
        killedBy: { type: [string, 'null'] }
        runnerName:
          type: [string, 'null']
          description: |
            Display name of the runner this event happened on or to (AA-1).
            A snapshot taken when the row was written, NOT a live join —
            `actor` carries `runner:<id>` for agent-written rows and that id
            stops resolving once the runner is deregistered. Null for events
            with no runner: SSH-executor runs, config changes, git syncs.
        # workflow-start / workflow-end (and via-workflow chip on run entries)
        workflowId: { type: [integer, 'null'] }
        workflowUid:
          type: [string, 'null']
          description: R2-1 — the permanent identity of the workflow this entry concerns; NULL on unattributable backfill rows (see `jobUid`).
        workflowName: { type: [string, 'null'] }
        # config
        category: { type: [string, 'null'] }
        action: { type: [string, 'null'] }
        target: { type: [string, 'null'] }
        details: { type: [string, 'null'] }
        # gitsync
        inventory: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        # push
        scheduleFile: { type: [string, 'null'] }
        repository: { type: [string, 'null'] }
        branch: { type: [string, 'null'] }
        commitSha: { type: [string, 'null'] }

    # ── Change Log / pushes ──────────────────────────────────────────────────
    ChangeLogEntry:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        timestamp: { type: string, format: date-time, readOnly: true }
        user:
          type: string
          readOnly: true
          description: Authenticated session identity (S6) — never client-supplied.
        category: { type: string }
        action: { type: string }
        target: { type: string }
        details: { type: string }

    SchedulePush:
      type: object
      properties:
        id: { type: string, readOnly: true }
        userEmail: { type: string, readOnly: true }
        commitSha: { type: [string, 'null'], readOnly: true }
        branch: { type: string }
        filesChanged:
          type: array
          items: { type: string }
        scheduleSlots:
          type: string
          description: Human summary of the schedule diff.
        status:
          type: string
          enum: [success, failed]
        errorMessage: { type: [string, 'null'] }
        timestamp: { type: string, format: date-time, readOnly: true }

    SchedulePublishRequest:
      type: object
      required: [filePath, content]
      properties:
        filePath:
          type: string
          description: Repo-relative YAML path, e.g. jobs/backup-prod-db.yaml.
          examples: ['jobs/backup-prod-db.yaml']
        content:
          type: string
          description: Full YAML file content. Must carry apiVersion cronomicon.io/v1 (T10).
        commitMessage:
          type: string
          description: Optional override; defaults to a generated message. Committed as the bot identity (§3.2).
        new:
          type: boolean
          default: false
          description: True when publishing a brand-new job YAML (§3.3). If-Match then carries the repo HEAD SHA.

    # ── Scopes ───────────────────────────────────────────────────────────────
    Scope:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true, description: UUIDv7. }
            source:
              type: string
              enum: [git, amadeus]
              readOnly: true
            scope: { type: string, description: Scope name (unique, case-insensitive). }
            name:
              type: [string, 'null']
              description: Inventory file name for git-source scopes.
            description: { type: string }
            hostCount: { type: integer, readOnly: true }
            gitlabUrl: { type: [string, 'null'], readOnly: true }
            sidecarPath: { type: [string, 'null'], readOnly: true }
            hosts:
              type: array
              description: |
                Host names belonging to this scope, populated for BOTH git- and
                amadeus-source scopes (git scopes are materialized into scope_hosts
                during sync). Drives the per-run host-subset picker (F2).
              items: { type: string }
            capability: { $ref: '#/components/schemas/ScopeCapability' }
            hasInventory:
              type: boolean
              readOnly: true
              description: True when this scope has a managed inventory file (M2).
            inventoryFormat: { type: [string, 'null'], readOnly: true, description: 'Inventory format (ini | yaml).' }
            projectionStatus:
              type: [string, 'null']
              readOnly: true
              description: 'Advisory parsed-projection status: ok | unavailable. unavailable ⇒ an unsupported construct stopped the preview (all-or-nothing).'
            groups:
              type: array
              readOnly: true
              description: |
                Targetable inventory groups (NAME + member count) for the run dialog's
                group selector (M3). Names only — not sensitive — so this is on the
                session-level scope list; the full group tree with vars is served only by
                the ConfigureApp-gated inventory endpoint. Empty when the projection is
                unavailable or the inventory is group-less.
              items:
                type: object
                properties:
                  name: { type: string }
                  hostCount: { type: integer }
            agencies:
              type: array
              readOnly: true
              description: |
                The agencies (network-isolation zones) this scope's hosts live in.
                A SET since v0.52.3 — a scope may belong to several, which is what
                the `scopes.agency_id` column it replaced could not express (that
                column was dropped in migration 700).

                Operator-owned and never synced: a git sync neither inserts nor
                deletes membership, so an assignment survives every pull. Empty
                means the general pool. Bind one with PUT /scopes/{scopeId}/agency
                (the 1:1 affordance) or several with PUT /scope-agencies.
              items:
                type: object
                required: [id, name]
                properties:
                  id: { type: string }
                  name: { type: string }
            lastChangedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        - $ref: '#/components/schemas/AuditFields'

    InventoryDocument:
      type: object
      description: |
        A scope's inventory and its ADVISORY parsed projection (M2). The projection
        is never authoritative — ansible reads the raw file via `-i`; it drives the
        read-only UI (and, M3, group targeting).
      required: [source, hasInventory, parseStatus, editable]
      properties:
        source: { type: string, enum: [git, amadeus] }
        format: { type: string, description: 'Inventory format (ini | yaml).' }
        editable: { type: boolean, description: True for amadeus-source scopes (in-app authoring lands in M5). }
        hasInventory: { type: boolean }
        raw: { type: string, description: Byte-exact inventory content; returned for amadeus-source scopes only. }
        parseStatus:
          type: string
          enum: [ok, unavailable]
          description: |
            ok — fully parsed (projection present); unavailable — an unsupported
            construct stopped the preview, so projection is omitted (the raw
            inventory still ships to ansible). The projection is all-or-nothing.
        parseReason: { type: string, description: Why the preview is unavailable. }
        parseLine: { type: integer, description: 1-based line of the first out-of-subset construct. }
        projection: { $ref: '#/components/schemas/InventoryProjection' }

    InventoryProjection:
      type: object
      description: Advisory parsed inventory tree. advisory is always true.
      required: [advisory, hosts, groups]
      properties:
        advisory: { type: boolean, description: Always true — a structural reminder that the projection is non-authoritative. }
        hosts:
          type: array
          items: { $ref: '#/components/schemas/InventoryHost' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/InventoryGroup' }

    InventoryHost:
      type: object
      required: [name]
      properties:
        name: { type: string }
        vars:
          type: object
          additionalProperties: { type: string }

    InventoryGroup:
      type: object
      required: [name]
      properties:
        name: { type: string }
        hosts: { type: array, items: { type: string } }
        children: { type: array, items: { type: string } }
        vars:
          type: object
          additionalProperties: { type: string }

    InventoryInput:
      type: object
      description: In-app inventory authoring payload (M5). amadeus-source scopes only.
      required: [raw]
      properties:
        raw: { type: string, description: Byte-exact inventory content. }
        format: { type: string, enum: [ini], description: 'Inventory format (only ini in v1; defaults to ini).' }

    InventoryImportInput:
      type: object
      description: import-hosts options (M5). All fields optional.
      properties:
        hosts:
          type: array
          items: { type: string }
          description: Restrict the import to these inventory hosts; empty/omitted ⇒ all.
        overwrite:
          type: boolean
          description: Update an existing imported (amadeus, same scope) host row instead of skipping it.

    InventoryImportResult:
      type: object
      required: [created, updated, skipped, rejected]
      properties:
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: array, items: { type: string }, description: Hosts already present and not overwritten. }
        rejected: { type: array, items: { type: string }, description: Hosts that could not be imported. }

    ScopeCapability:
      type: object
      readOnly: true
      description: Resolved declared run-type capability (S10). Advisory only — never blocks execution (§9.2).
      properties:
        types:
          type: array
          items: { $ref: '#/components/schemas/RunType' }
        origin:
          type: string
          enum: [local, sidecar, pragma, inference]
        owner: { type: [string, 'null'] }
        errors:
          type: array
          description: Line-numbered pragma parse errors (strict parsing per S10).
          items: { $ref: '#/components/schemas/LineError' }

    LocalScopeInput:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
        description: { type: string }
        hosts:
          type: array
          description: Host names; may be empty for a scope whose membership comes from an authored inventory (M5).
          items: { type: string }
        supportedTypes:
          type: array
          description: Declared capability with a bash floor (S10).
          default: [bash]
          items: { $ref: '#/components/schemas/RunType' }
        rawInventory:
          type: string
          description: Optional raw Ansible inventory (INI format) provided during creation/update.


    # ── Env Vars / Secrets ───────────────────────────────────────────────────
    ReferenceBinding:
      type: object
      required: [kind, name, reference]
      properties:
        kind:
          type: string
          enum: [secret, var, key]
          description: 'Which Env Vars section the reference targets (secret → CRONOMICON_SECRET_, var → CRONOMICON_VAR_, key → CRONOMICON_KEY_).'
        name:
          type: string
          description: 'The bare Env Vars row name (a POSIX identifier). The store never keeps a prefix.'
        as:
          type: string
          description: |
            RA-1 — the optional ALIAS: the bare DESTINATION name this binding's
            value is injected under, so one shared job body can consume any
            department's row (bind `TEAMA_SUDO as BECOME_PASSWORD` and the run
            receives CRONOMICON_SECRET_BECOME_PASSWORD). Omitted/empty ⇒ injected
            under the row's own name, the pre-Phase-A behaviour verbatim.

            It is a DESTINATION, never a selector: `name` still identifies the row
            and the row is still resolved under the run's scope and frozen agency
            snapshot, so an alias can never reach something the binding could not.
            Same charset rules as a row name of that kind (a secret alias carries
            the reserved-KEK bar too) — a violation is 422.
        reference:
          type: string
          readOnly: true
          description: 'Derived CRONOMICON_<SECTION>_<name> reference for the ROW — the binding''s identity. Read-only; server-derived from kind + name. When `as` is set the value actually lands on CRONOMICON_<SECTION>_<as> instead.'
    ReferenceBindingList:
      type: object
      required: [bindings]
      properties:
        bindings:
          type: array
          items: { $ref: '#/components/schemas/ReferenceBinding' }
    ReferenceBindingWrite:
      type: object
      required: [bindings]
      description: |
        Full-replace set of reference bindings for a job/script. `reference` is
        ignored on write (server-derived).

        RA-4 — a binding's identity is kind + name + `as`, so the SAME row may be
        declared twice under two different aliases (it lands two keys). What is
        refused with 422 is two DIFFERENT rows aliased to one destination (RA-Q2):
        there is no defensible silent winner when the values are secret material.
      properties:
        bindings:
          type: array
          items:
            type: object
            required: [kind, name]
            properties:
              kind: { type: string, enum: [secret, var, key] }
              name: { type: string }
              as:
                type: string
                description: 'Optional alias — the bare destination name the value is injected under. See ReferenceBinding.as.'
    ReferenceValidateRequest:
      type: object
      required: [references]
      description: |
        A set of references to validate against one scope. `scope` is the run scope
        to resolve from — the job's own scope, or the Run dialog's effective scope
        when an override is in play. Omit or send "" for the global scope.
      properties:
        scope:
          type: string
          description: 'The run scope to resolve from; "" (or omitted) is the global scope.'
        references:
          type: array
          maxItems: 200
          items:
            type: object
            required: [kind, name]
            properties:
              kind: { type: string, enum: [secret, var, key] }
              name: { type: string }
              as:
                type: string
                description: |
                  Optional alias (RA-1). It never affects WHICH row resolves — the
                  alias is a destination — but a malformed one comes back as
                  `outcome: invalid`, and two different rows aliased to one
                  destination come back as `invalid` on BOTH participants, so the
                  dialog shows the clash before the trigger refuses it.
    ReferenceValidation:
      type: object
      required: [kind, name, reference, injectReference, ok, outcome, reason]
      description: 'The authoring-time verdict for one declared reference. Carries no value, ever.'
      properties:
        kind: { type: string, enum: [secret, var, key] }
        name:
          type: string
          description: 'The bare Env Vars row name that was validated.'
        as:
          type: string
          description: 'The alias the caller asked about, echoed back so a set of chips can be matched to verdicts when one row is bound twice under two destinations.'
        reference:
          type: string
          description: 'Derived CRONOMICON_<SECTION>_<name> reference for the ROW, echoed back so a chip can label itself.'
        injectReference:
          type: string
          description: 'The key the value would actually land on: CRONOMICON_<SECTION>_<as> when aliased, otherwise the same as `reference`.'
        ok:
          type: boolean
          description: 'True when dispatch would resolve this reference for a run in the requested scope.'
        outcome:
          type: string
          enum: [resolved, out_of_scope, not_found, invalid]
          description: |
            `resolved` — dispatch will inject it. `out_of_scope` — a row of this
            name exists and is visible to the CALLER, but not from the run's scope.
            `not_found` — no row the caller can see carries this name (which also
            covers a row that exists only in scopes the caller may not read — the
            two are deliberately indistinguishable). `invalid` — not a legal
            reference kind or name, so no row could ever carry it.
        reason:
          type: string
          description: 'An operator-facing sentence, precise only to the extent the caller''s own list already is.'
        resolvedScope:
          type: string
          nullable: true
          description: |
            The WINNING row''s scope when `ok`: "" means the global row. Null when
            nothing resolved, when the winning row sits in a scope the caller may
            not read, and always for keys (ssh_credentials has no scope column).
        otherScopes:
          type: array
          items: { type: string }
          description: 'Scopes holding a caller-visible row of this name; present only for `out_of_scope`.'
    ReferenceValidateResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/ReferenceValidation' }
    ReferenceUsage:
      type: object
      required: [kind, name, jobs, scripts]
      properties:
        kind: { type: string, enum: [secret, var, key] }
        name: { type: string }
        jobs:
          type: integer
          description: 'Jobs declaring a binding to this reference, filtered to the scopes the caller may read.'
        scripts:
          type: integer
          description: 'Scripts declaring a binding to this reference (scripts are a single shared catalog, so unfiltered).'
    ReferenceUsageList:
      type: object
      required: [usage]
      properties:
        usage:
          type: array
          items: { $ref: '#/components/schemas/ReferenceUsage' }
    EnvVar:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true, description: UUIDv7. }
            key: { type: string }
            reference:
              type: string
              readOnly: true
              description: 'Derived CRONOMICON_VAR_<key> reference (namespace contract) — copy this to reference the value in a run. Read-only; the row keeps its bare key.'
            value: { type: string }
            scope: { type: string }
            description: { type: string }
            tags:
              type: array
              description: |
                Operator-authored tags (migration 470). Stored in SQLite ONLY —
                never sourced from Git — and set via PUT /env-var-tags/{envVarId};
                [] when none. Writable (carries the ManageEnvVars permission).
              items: { type: string }
            ownerAgency:
              type: string
              readOnly: true
              description: |
                RA-15 (Phase E) — the NAME of the department that OWNS this variable, or ""
                for shared infrastructure. Ownership is what lets two departments hold the
                same key in the same scope: uniqueness is
                (key, scope, owner_agency), and a run resolves its OWN department's
                variable before falling back to a shared one (RA-17). A run whose departments
                span MORE THAN ONE owner of a name resolves to nothing at all — it fails
                closed rather than pick one.
            
                Derived from the creating actor's department (the same set RA-9 inherits)
                and set at create; not editable here — transfer is an administrative action
                on the Membership matrix, which also refuses to remove an owner from its
                own row's membership. The column stores the agency id so a rename cannot
                orphan it; this field is the resolved name, for display.
        - $ref: '#/components/schemas/AuditFields'

    Capabilities:
      type: object
      description: >-
        Flat capability flags. Deployment facts and caller permissions in one
        object; see GET /capabilities for why the permission flags must not be used
        as an access control.
      required:
        [vault, apprise, compose, manageRoles, configureApp, manageEnvVars,
         publishSchedule, triggerJobs, killJobs, unrestricted, composeUnbound]
      properties:
        vault: { type: boolean, description: A real Vault client is wired (not merely configured). }
        apprise: { type: boolean, description: An Apprise URL is configured. }
        compose: { type: boolean, description: 'Union: the caller may author amadeus-source jobs/workflows SOMEWHERE (AF-2). Never a route gate — per-object authority is checked server-side against the definition''s scope.' }
        manageRoles: { type: boolean }
        configureApp: { type: boolean }
        manageEnvVars: { type: boolean }
        publishSchedule: { type: boolean }
        triggerJobs: { type: boolean, description: 'Union: the caller may trigger SOMEWHERE. Never a route gate.' }
        killJobs: { type: boolean, description: 'Union: the caller may stop runs SOMEWHERE. Never a route gate.' }
        composeUnbound:
          type: boolean
          description: >-
            AF-2 — the caller may author an ALL-scoped (unscoped) job or workflow.
            Only an unrestricted compose grant qualifies, because a scheduled fire
            of an unbound job runs scope-unchecked (RB-30). The composer reads this
            to withhold the "All agencies (global)" scope option rather than
            teaching the rule with a 403.
        unrestricted:
          type: boolean
          description: >-
            Scope REACH, not a permission: the caller holds a grant covering every
            scope. Drives the Run dialog's unscoped-job binding path (RB-26/RB-29).

    EnvVarInput:
      type: object
      required: [key, value, scope]
      properties:
        key: { type: string }
        value: { type: string }
        scope: { type: string }
        description: { type: string }
        agencyIds:
          type: array
          items: { type: string }
          writeOnly: true
          description: >-
            Agencies to place the new variable in, applied at CREATE only (RF-Q2(a),
            the RBAC-fixes plan). A scope-RESTRICTED creator who omits it
            INHERITS their own department (RA-9) when they hold the permission on
            exactly one; holding it on several is 422 `agency_required` naming the
            candidates, because "their department" then has no single answer and
            enrolling the row in all of them would widen it past what they meant.
            This matters because an entity with no membership is shared
            infrastructure and is unrestricted-only for writes and reveal
            (RB-Q14), so a restricted creator would otherwise be locked out of the
            row they just created. Unrestricted creators may omit it, which is the
            deliberate way to mint shared infrastructure. Membership is edited
            afterwards via PUT /env-var-agencies.

    RunAnalytics:
      type: object
      description: Run aggregates over a window (SL-E).
      properties:
        job: { type: string }
        source: { type: string }
        windowDays: { type: integer }
        from: { type: string, format: date-time }
        total:
          type: integer
          description: >-
            FX-D2 — EXECUTED runs in the window: every row except suppressions. `skipped` counts
            those separately, so the two buckets never overlap and the number of fires the window
            saw is total + skipped. Counting suppressions here made a job stopped every day by a
            working calendar read as fully active, since this is the number rendered as
            "N runs in the last 30 days".
        success: { type: integer }
        failure: { type: integer }
        warning: { type: integer }
        killed: { type: integer }
        skipped: { type: integer }
        running: { type: integer }
        successRate:
          type: [number, 'null']
          description: Successes over terminal outcomes. Null when nothing terminal ran in the window.
        p50Ms: { type: [integer, 'null'] }
        p95Ms: { type: [integer, 'null'] }
        maxMs: { type: [integer, 'null'] }
        slaBreaches:
          type: integer
          description: Runs in the window that were warned as overdue.
        missedRuns:
          type: integer
          description: Expected fires the detector found no run for.
        buckets:
          type: array
          description: Per-day counts, in application-timezone days.
          items:
            type: object
            properties:
              day: { type: string }
              total:
                type: integer
                description: That day's EXECUTED runs (FX-D2); suppressions are counted in `skipped`.
              skipped:
                type: integer
                description: >-
                  That day's suppressed fires. A bucket is created for either, so a day on which
                  everything was suppressed still appears — a gap in the sparkline would read as
                  missing data rather than as a deliberate quiet day.
              success: { type: integer }
              failure: { type: integer }
              p50Ms: { type: [integer, 'null'] }
        failures:
          type: array
          description: The window's most common failure reasons, most frequent first (max 8).
          items:
            type: object
            properties:
              reason: { type: string }
              count: { type: integer }

    DefinitionRevision:
      type: object
      description: One append-only snapshot of an amadeus-source definition.
      properties:
        revisionNo: { type: integer, description: 1-based, monotonic per definition. }
        action: { type: string, enum: [created, updated, deleted, restored] }
        actor: { type: string }
        createdAt: { type: string, format: date-time }
        digest:
          type: string
          description: sha256 of the snapshot — what lets an unchanged save skip writing a revision.
        snapshot:
          type: object
          additionalProperties: true
          description: |
            The compose input as authored. Restoring re-submits exactly this
            through the write path; a deleted/restored action carries a small
            marker object instead of a definition body.

    RecycleBinEntry:
      type: object
      properties:
        kind: { type: string, enum: [job, workflow, schedule] }
        name: { type: string }
        deletedAt: { type: string, format: date-time }
        deletedBy: { type: string }
        purgeAt:
          type: [string, 'null']
          format: date-time
          description: When the reaper will hard-delete this. Absent when the window is "keep forever".

    ServiceAccount:
      type: object
      description: |
        A machine principal (ET-A). Carries a role plus EITHER an agency or the
        "*" sentinel — the same one-shape-per-row rule access_grants uses — so a
        token resolves to exactly the identity a human with that grant holds.
        Never carries token material.
      properties:
        id: { type: string, readOnly: true }
        name:
          type: string
          description: Also the audit actor, rendered `svc:<name>` on every run it triggers.
        description: { type: string }
        role:
          type: string
          description: Any role the roles table knows, custom roles included.
        agencyId: { type: [string, 'null'] }
        agencyName: { type: [string, 'null'], readOnly: true }
        allScopes:
          type: boolean
          description: The "*" sentinel — unrestricted. Mutually exclusive with agencyId.
        createdBy: { type: string, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        expiresAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        lastUsedAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: |
            Stamped on every successful authentication. This is the column that
            answers "is anything still using this token?" — the question that
            otherwise keeps dead credentials alive for years.
        status:
          type: string
          enum: [active, expired, revoked]
          readOnly: true
          description: Derived from revokedAt and expiresAt, not stored.

    ServiceAccountInput:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
          description: |
            May not contain spaces or ':' — it becomes the audit actor
            `svc:<name>` and must stay unambiguous to read and to filter on.
        description: { type: string }
        role: { type: string }
        agencyId:
          type: string
          description: Bind the token to one agency's scopes. Mutually exclusive with allScopes.
        allScopes:
          type: boolean
          description: Grant every scope. Exactly one of this or agencyId must be set.
        expiresAt:
          type: string
          format: date-time
          description: |
            Optional. Omitted means no expiry — a service account is standing
            infrastructure, and an imposed expiry means an integration stops at
            3am with nobody present. Setting one is encouraged, not required.

    MintedServiceAccount:
      allOf:
        - $ref: '#/components/schemas/ServiceAccount'
        - type: object
          properties:
            token:
              type: string
              readOnly: true
              description: |
                The plaintext credential, prefixed `crnsvc_`. Present ONLY in
                the 201 response that created the account; only its SHA-256 is
                stored, so it cannot be recovered afterwards.

    Agency:
      allOf:
        - type: object
          properties:
            id: { type: string, readOnly: true }
            name: { type: string, description: 'Operator label; unique. The dispatch key snapshotted onto a run at enqueue (M3).' }
            description: { type: [string, 'null'] }
            onlineRunnerCount:
              type: integer
              readOnly: true
              description: Number of online runners assigned to this agency (M4 coverage view). 0 means jobs bound here will wait — no runner can claim them.
        - $ref: '#/components/schemas/AuditFields'

    AgencyInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: [string, 'null'] }

    EnvSecret:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true, description: UUIDv7. }
            key: { type: string }
            reference:
              type: string
              readOnly: true
              description: 'Derived CRONOMICON_SECRET_<key> reference (namespace contract) — copy this to reference the secret in a run. Read-only; the row keeps its bare key.'
            source:
              type: string
              enum: [stored, vault]
            scope: { type: string }
            description: { type: string }
            vaultPath:
              type: [string, 'null']
              description: Present for vault-source entries, e.g. secret/data/app#API_SECRET_KEY.
            tags:
              type: array
              description: |
                Operator-authored tags (migration 470). Plaintext metadata stored
                in SQLite ONLY — never part of the encrypted envelope — set via
                PUT /env-secret-tags/{secretId}; [] when none. Writable (carries
                the ManageEnvVars permission).
              items: { type: string }
            ownerAgency:
              type: string
              readOnly: true
              description: |
                RA-15 (Phase E) — the NAME of the department that OWNS this secret, or ""
                for shared infrastructure. Ownership is what lets two departments hold the
                same key in the same scope: uniqueness is (key, scope, owner_agency), and a run resolves its OWN
                department's secret before falling back to a shared one (RA-17). A run whose
                departments span MORE THAN ONE owner of a name resolves to nothing at all —
                it fails closed rather than pick one.
            
                Derived from the creating actor's department (the same set RA-9 inherits)
                and set at create; not editable here — transfer is an administrative action
                on the Membership matrix, which also refuses to remove an owner from its own
                row's membership. The column stores the agency id so a rename cannot orphan
                it; this field is the resolved name, for display.
        - $ref: '#/components/schemas/AuditFields'

    EnvSecretInput:
      type: object
      required: [key, source, scope]
      properties:
        key: { type: string }
        source:
          type: string
          enum: [stored, vault]
        scope: { type: string }
        description: { type: string }
        value:
          type: string
          writeOnly: true
          description: Required when source=stored; encrypted at rest (S14). Never echoed back.
        vaultPath:
          type: string
          description: Required when source=vault.
        agencyIds:
          type: array
          items: { type: string }
          writeOnly: true
          description: >-
            Agencies to place the new secret in, applied at CREATE only (RF-Q2(a),
            the RBAC-fixes plan). A scope-RESTRICTED creator who omits it
            INHERITS their own department (RA-9) when they hold the permission on
            exactly one; holding it on several is 422 `agency_required` naming the
            candidates, because "their department" then has no single answer and
            enrolling the row in all of them would widen it past what they meant.
            This matters because an entity with no membership is shared
            infrastructure and is unrestricted-only for writes and reveal
            (RB-Q14), so a restricted creator would otherwise be locked out of the
            row they just created. Unrestricted creators may omit it, which is the
            deliberate way to mint shared infrastructure. Membership is edited
            afterwards via PUT /secret-agencies.

    # ── Runners ──────────────────────────────────────────────────────────────
    PlacementSuggestion:
      type: object
      description: |
        The placement a re-registered runner previously held, offered for an
        operator to confirm (DR-7). A runner that loses its identity comes back
        with a NEW id, so its agency membership and tags — both keyed to the id
        that was deleted — are gone.

        Losing placement is not "goes idle": the claim predicate admits a runner
        with no agencies to every UNTAGGED run, so an unbound runner has silently
        moved from its department's pool into the shared general pool. That is an
        isolation change, which is why it is surfaced rather than left to be
        noticed.

        Every match signal is carried here, labelled by whether it is OBSERVED or
        SELF-DECLARED, so the person confirming can see what the match rests on.
      properties:
        historyId:
          type: integer
          description: Identifies the snapshot; pass it back to accept the offer.
        previousRunnerId:
          type: string
          description: The runner id that held this placement before it was deleted.
        agencies:
          type: array
          description: |
            The agencies that would be restored. An agency deleted since the
            snapshot is omitted rather than offered.
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
        tags:
          type: array
          items: { type: string }
          description: Operator tags that would be restored alongside the agencies.
        deregisteredAt: { type: string, format: date-time }
        deregisteredVia:
          type: string
          enum: [operator, reaper]
          description: |
            How the previous row was removed. `reaper` means the runner simply
            stayed offline past CRONOMICON_RUNNER_DEREGISTER_AFTER — during an
            outage that is most of them.
        previousClientIp:
          type: [string, 'null']
          description: |
            OBSERVED. The client address the previous runner was last seen from,
            resolved through the trusted-proxy allowlist. The one signal an agent
            cannot freely assert, so it carries the security weight of the match.
        currentClientIp:
          type: [string, 'null']
          description: OBSERVED. Where this runner is being seen from now.
        clientIpMatches:
          type: boolean
          description: |
            Whether the two observed addresses agree. A mismatch does NOT suppress
            the offer — a host legitimately rebuilt during recovery lands on a new
            lease — but it must be shown, so a weaker match is visible rather than
            implied.
    Runner:
      allOf:
        - type: object
          properties:
            id: { type: string, readOnly: true, description: Runner UUIDv7 (runners.id) — a string, not an integer. }
            name: { type: string }
            status:
              type: string
              enum: [online, offline, degraded, draining]
              readOnly: true
            os:
              type: string
              enum: [Linux, Windows]
            capabilities:
              type: array
              items: { type: string }
              description: |
                Flat capability tokens (ansible-update.md RX.7). Includes the
                run-type names (bash, ansible, …) AND, on a checkout-capable
                runner, tokens like `checkout`, `vault`, and
                `collection:<fqcn>`. claimRun gates a run's requires against this
                set.
            tags:
              type: array
              items: { type: string }
              description: |
                Operator-authored tags (migration 580). Stored in SQLite ONLY and
                set via PUT /runner-tags/{runnerId}. Runners are self-registered
                (not a Git catalog), so there is no sync concern; [] when none.
                WRITABLE (inline-editable from the runner's expanded row).
            allowSecretInjection:
              type: boolean
              description: |
                Operator trust flag (migration 600, vault-integration.md P1.4):
                when true, this runner may claim runs whose job/script declares
                reference bindings and receive injected secret material in the
                manifest. Operator-granted (never self-declared), set via
                PUT /runners/{id}/secret-injection; defaults false.
            toolchains:
              type: [object, 'null']
              readOnly: true
              additionalProperties: true
              description: |
                Detected-toolchain display detail (RX.7): ansibleCore version,
                installed collections + versions, checkout/vault flags, and
                keyNames — the credential NAMES the runner can resolve to a local
                key (names only, never paths or key material; R6). Reported by the
                agent at registration; null for a pre-Phase-4 agent, and keyNames
                is absent until the agent re-declares on a post-Phase-4 upgrade.
            inventory:
              type: string
              enum: [amadeus, local]
              default: amadeus
              description: |
                Per-runner inventory canonicality (D8). amadeus — Cronomicon
                resolves targets into the manifest. local — the agent resolves
                hosts against its own inventory (network-isolated segments).
            load: { type: integer, readOnly: true }
            maxConcurrent: { type: integer }
            version: { type: string, readOnly: true }
            protocolVersion:
              type: integer
              readOnly: true
              description: |
                Runner↔server wire-protocol version declared at the last
                (re-)registration (migration 390). Display only: the server's
                floor tracks its current protocol and is enforced at
                registration, at redeclare AND on every poll, so a registered
                runner always speaks it — no row action is gated on this value.
            registeredAt: { type: string, format: date-time, readOnly: true }
            lastHeartbeatAt: { type: [string, 'null'], format: date-time, readOnly: true }
            agencies:
              type: array
              readOnly: true
              description: |
                Agencies (network-isolation zones) this runner belongs to
                (agency-support.md M2). Operator-assigned; never self-declared.
              items:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
            placementSuggestion:
              allOf:
                - $ref: '#/components/schemas/PlacementSuggestion'
              readOnly: true
              description: |
                A prior placement offered for an operator to confirm (DR-7).
                Present ONLY on a runner that currently belongs to no agency and
                whose name matches a retained snapshot. Absent means "no offer",
                never "no placement".

                NEVER applied automatically: the name it is matched on is
                self-declared by the agent at registration, so an automatic
                re-bind would let any agent inherit another runner's agency by
                claiming its name — turning an enrollment credential into a
                placement credential. Accept it via
                POST /runners/{runnerId}/placement.
            registrationTokenId:
              type: [string, 'null']
              readOnly: true
              description: ID of the registration token used (provenance, A6.1).
            managedSettings:
              allOf:
                - $ref: '#/components/schemas/ManagedRunnerSettings'
              readOnly: true
              description: |
                Server-managed operational overrides (runner-install-update-2.md
                Phase 4), edited from the runner's Settings drawer and delivered
                over the poll channel. Omitted when the server has no opinion.
            settingsVersion:
              type: integer
              readOnly: true
              description: Bumps on every managed-settings write.
            settingsAckedVersion:
              type: integer
              readOnly: true
              description: |
                The settingsVersion the agent has applied (echoed as its poll
                ack). settingsVersion > settingsAckedVersion ⇒ a change is still
                propagating (pending-ack).
        - $ref: '#/components/schemas/AuditFields'

    ManagedRunnerSettings:
      type: object
      description: |
        Tri-state server-managed runner overrides (Phase 4). A present field
        overrides the agent's local (declared) value; an absent field means "no
        opinion — keep the local value". capabilityMask is subtract-only: the
        run-types it lists are removed from the runner's effective claim set.
      properties:
        maxConcurrent: { type: integer, minimum: 1 }
        sandboxMemoryMax: { type: string, description: 'cgroup MemoryMax, e.g. "2G".' }
        sandboxCpuQuota: { type: string, description: 'cgroup CPUQuota, e.g. "150%".' }
        sandboxTasksMax: { type: string, description: 'cgroup TasksMax, e.g. "512".' }
        allowCheckout: { type: boolean }
        checkoutRepos:
          type: array
          items: { type: string }
          description: Allowlist of repo clone URLs the runner may check out.
        capabilityMask:
          type: array
          items: { $ref: '#/components/schemas/RunType' }
          description: Run-types to REMOVE from the runner's effective claim set (subtract-only).

    PendingHostKey:
      type: object
      description: |
        A scanned target host key awaiting operator approval (Phase 5, D4). The
        full SHA256 fingerprint is for out-of-band comparison before approving.
      properties:
        id: { type: string, readOnly: true }
        runnerId: { type: string, readOnly: true }
        runnerName: { type: string, readOnly: true }
        host: { type: string, readOnly: true }
        keyType: { type: string, readOnly: true }
        fingerprint: { type: string, readOnly: true }
        scannedAt: { type: string, format: date-time, readOnly: true }

    AgencyMatrixRow:
      type: object
      required: [kind, id, name, scope, agencyIds]
      properties:
        kind: { type: string, enum: [scope, secret, env-var, ssh-credential, runner] }
        id: { type: string }
        name: { type: string, description: 'Scope/runner name, secret or variable key, or SSH-key label.' }
        scope:
          type: string
          description: 'The entity''s own scope where it has one; "" is global (or the kind has no scope).'
        agencyIds:
          type: array
          items: { type: string }
          description: 'Empty means NO agency restriction — reachable from everywhere — not "belongs to nothing".'
    AgencyMatrix:
      type: object
      required: [agencies, rows]
      properties:
        agencies:
          type: array
          items: { $ref: '#/components/schemas/Agency' }
          description: 'The matrix columns.'
        rows:
          type: array
          items: { $ref: '#/components/schemas/AgencyMatrixRow' }
    AgencyMemberEntry:
      type: object
      required: [kind, id, name]
      properties:
        kind: { type: string, enum: [scope, secret, env-var, ssh-credential, runner] }
        id: { type: string }
        name: { type: string }
        scope: { type: string, description: 'The entity''s own scope, where it has one.' }
        status: { type: string, description: 'Runner status — runners only.' }
    AgencyDetail:
      type: object
      required: [agency, members, onlineRunners, queuedRuns]
      properties:
        agency: { $ref: '#/components/schemas/Agency' }
        members:
          type: array
          items: { $ref: '#/components/schemas/AgencyMemberEntry' }
        onlineRunners:
          type: integer
          description: 'ONLINE runner members. Zero means every run targeting this agency queues forever.'
        queuedRuns:
          type: integer
          description: 'Runs waiting on this agency right now, from the same index claimRun probes.'
    AgencyMemberRef:
      type: object
      required: [kind, id]
      description: One entity named for the agency-scoped member setter.
      properties:
        kind:
          type: string
          enum: [scope, secret, env-var, ssh-credential, runner]
        id: { type: string }

    AgencyMembership:
      type: object
      required: [id, agencyIds]
      description: |
        One entity's agency set (migration 670). `id` is the scope / secret /
        env-var / ssh-credential id, depending on the endpoint. An empty or absent
        set means NO agency restriction — the row is reachable from everywhere —
        which is the convention that keeps a global secret global under AG-Q1(b).
      properties:
        id: { type: string }
        agencyIds:
          type: array
          items: { type: string }
    AgencyPreflightFinding:
      type: object
      required: [kind, name, reference, jobName, jobScope, jobAgencies, rowAgencies, reason]
      description: 'One binding that works today and would stop resolving under the Phase-3 predicates.'
      properties:
        kind: { type: string, enum: [secret, var, key] }
        name: { type: string, description: 'The bare row name the binding declares.' }
        reference: { type: string, description: 'The derived CRONOMICON_<SECTION>_<name>.' }
        jobSource: { type: string }
        jobName: { type: string }
        jobScope: { type: string, description: '"" is the global scope.' }
        jobAgencies:
          type: array
          items: { type: string }
          description: 'Agencies the job''s scope belongs to; empty means the general pool, which intersects nothing.'
        rowAgencies:
          type: array
          items: { type: string }
          description: 'The referenced row''s membership. Never empty — an unrestricted row is not a finding.'
        reason: { type: string }
    EnvVarShadowFinding:
      type: object
      required: [kind, name, reference, scope, agencies, globalAgencies, unrestricted, reason]
      description: |
        RA-10 — one scoped Secrets/Variables row that shadows a global row of the
        same key. Resolution prefers a scope-exact row over a global one, which is
        deliberate and useful; what this surfaces is that nothing said so.

        SSH keys never appear: `ssh_credentials` has no scope column, so there is no
        scope-exact-beats-global tier for a key label to be caught in. Kinds are
        never compared against each other either — a secret and a variable of the
        same name resolve through different tables under different prefixes.
      properties:
        kind: { type: string, enum: [secret, var] }
        name: { type: string, description: 'The bare row name both rows share.' }
        reference: { type: string, description: 'The derived CRONOMICON_<SECTION>_<name>.' }
        scope: { type: string, description: 'The SHADOWING row''s scope. Never "" — a global row shadows nothing.' }
        agencies:
          type: array
          items: { type: string }
          description: 'The shadowing row''s membership. Empty means no restriction — the severe case.'
        globalAgencies:
          type: array
          items: { type: string }
          description: 'The shadowed global row''s membership, for contrast.'
        composeUnbound:
          type: boolean
          description: >-
            AF-2 — the caller may author an ALL-scoped (unscoped) job or workflow.
            Only an unrestricted compose grant qualifies, because a scheduled fire
            of an unbound job runs scope-unchecked (RB-30). The composer reads this
            to withhold the "All agencies (global)" scope option rather than
            teaching the rule with a 403.
        unrestricted:
          type: boolean
          description: |
            True when the shadowing row has NO membership, so it wins for EVERY
            department's runs in that scope with no department restriction of its
            own. This is the silent hole Phase D exists to make visible; a membered
            shadow is usually the override feature working as intended.
        reason: { type: string }
    EnvVarAmbiguityFinding:
      type: object
      required: [kind, name, reference, scope, owners, reason]
      description: |
        RA-18 (Phase E) — one name held by MORE THAN ONE department in the same
        scope. This is not a misconfiguration: it is the Phase E model working, and
        each department's own runs resolve their own row. What it warns about is the
        run that spans several of the owners — that one resolves to NOTHING (RA-17
        fails closed rather than pick a department's credential at random), and the
        likeliest person to hit it is an unrestricted admin running ad hoc, who will
        reasonably read the refusal as a bug.

        A department's row sitting alongside a SHARED row of the same name is NOT
        reported: owned beats shared, so it resolves cleanly, and flagging it would
        bury the real finding.
      properties:
        kind: { type: string, enum: [secret, var, key] }
        name: { type: string, description: 'The key (or SSH label) the departments share.' }
        reference: { type: string, description: 'The derived CRONOMICON_<SECTION>_<name>.' }
        scope:
          type: string
          description: 'The scope the collision is in. Always "" for keys — ssh_credentials has no scope column, which is why the key case is the easiest of the three to hit.'
        owners:
          type: array
          items: { type: string }
          description: 'The owning department names, sorted. Always two or more — one owner is not an ambiguity.'
        reason: { type: string }
    EnvVarShadowList:
      type: object
      required: [shadows, ambiguities]
      properties:
        shadows:
          type: array
          items: { $ref: '#/components/schemas/EnvVarShadowFinding' }
        ambiguities:
          type: array
          items: { $ref: '#/components/schemas/EnvVarAmbiguityFinding' }
          description: |
            RA-18 — names held by several departments at once. Scope-filtered like
            `shadows`; key findings carry no scope and are visible to any session,
            exactly as key labels already are elsewhere.
    AgencyPreflightReport:
      type: object
      required: [referenceFindings, keyFindings, shadowFindings, ambiguityFindings, jobBindingsChecked, scriptBindingsUnevaluated, membershipAssigned]
      properties:
        referenceFindings:
          type: array
          items: { $ref: '#/components/schemas/AgencyPreflightFinding' }
          description: 'Secret/variable bindings AG-Q1(b) would break.'
        keyFindings:
          type: array
          items: { $ref: '#/components/schemas/AgencyPreflightFinding' }
          description: 'SSH-key bindings AG-Q5''s tightening would break.'
        shadowFindings:
          type: array
          items: { $ref: '#/components/schemas/EnvVarShadowFinding' }
          description: |
            RA-10 — scoped rows that shadow a global row of the same key. Unlike the
            two above these are not about a pending tightening: they describe what
            resolution does TODAY, so an operator reviewing membership sees the rows
            whose resolution is already ambiguous in the same report.
        ambiguityFindings:
          type: array
          items: { $ref: '#/components/schemas/EnvVarAmbiguityFinding' }
          description: |
            RA-18 — names owned by more than one department. Also a description of
            TODAY rather than a pending tightening: a run spanning several of the
            owners already fails closed, so it belongs in the report an operator
            reads before they meet it as a refused run.
        jobBindingsChecked:
          type: integer
          description: 'How many job-owned bindings were evaluated, so an empty findings list can be told apart from a report over no data.'
        scriptBindingsUnevaluated:
          type: integer
          description: 'Script-owned bindings, which have no static answer (a script carries no scope of its own).'
        membershipAssigned:
          type: integer
          description: 'Total membership rows across the four join tables. Zero means the tightening has nothing to bite on yet.'

    # ── RB-4 departmental-RBAC pre-flight (the rbac-update plan) ────
    FileSighting:
      type: object
      required: [id, path, sizeBytes, mtime, seenAt]
      description: One observed file arrival and what became of it.
      properties:
        id: { type: string }
        path: { type: string }
        sizeBytes: { type: integer, format: int64 }
        mtime: { type: string, format: date-time, description: The file's modification time as the agent observed it. }
        seenAt: { type: string, format: date-time }
        runnerId: { type: [string, 'null'], description: Who reported it first (provenance). }
        runId: { type: [string, 'null'], description: The run this arrival started; null when it was refused. }
        refusedReason:
          type: [string, 'null']
          description: >-
            Why nothing STARTED from this arrival, in the same wording History uses. Null when a
            run started immediately. One reason — "queued behind an active run" — means a run WAS
            parked and executes when its concurrency gate clears; the rest are terminal refusals.
    RbacJobFinding:
      type: object
      required: [kind, name, source, detail, reason]
      description: 'One job, schedule, or parked run affected by the RB-26 binding rule.'
      properties:
        kind: { type: string, enum: [job, schedule, pendingRun] }
        name: { type: string }
        source: { type: string }
        detail: { type: string, description: 'Kind-specific fact: recent triggerers, the cron, or the creator and fire time.' }
        reason: { type: string }
    RbacEntityFinding:
      type: object
      required: [kind, key, scope, lastModifiedBy]
      description: 'A secret or variable with no agency membership, which RB-Q14 makes unrestricted-only for writes and reveals.'
      properties:
        kind: { type: string, enum: [secret, var] }
        key: { type: string }
        scope: { type: string, description: '"" is the global scope.' }
        lastModifiedBy: { type: string }
    RbacPreflightReport:
      description: >-
        The current-state RBAC hygiene report. FX-E6: this schema previously required eight
        fields of the pre-v0.57.8 conversion report that the backend no longer emits, so a
        schema-validating client rejected every valid response; it now matches what
        /rbac-preflight actually returns, and a conformance test pins the two together.
      type: object
      required:
        - ungrantedGroups
        - emptyMembershipEntities
        - unscopedJobs
        - unscopedJobShare
        - totalJobs
        - unscopedSchedules
        - pendingUnbound
        - pendingRevoked
        - usersEvaluated
        - grantsEvaluated
      properties:
        ungrantedGroups:
          type: array
          items: { type: string }
          description: 'AD groups seen in recent_logins that no access grant names. Fail-closed means they hold nothing, which reads to that department as an outage rather than missing configuration.'
        emptyMembershipEntities:
          type: array
          items: { $ref: '#/components/schemas/RbacEntityFinding' }
          description: 'Secrets/variables with no agency membership, which RB-Q14 makes unrestricted-only. The "assign memberships first" backlog.'
        unscopedJobs:
          type: array
          items: { $ref: '#/components/schemas/RbacJobFinding' }
          description: 'RB-26 — jobs with no declared scope, which a restricted actor must bind at trigger time.'
        unscopedJobShare:
          type: integer
          description: 'unscopedJobs as a percentage of the catalog, rounded. A count alone does not say whether this is an edge case or the norm.'
        totalJobs:
          type: integer
          description: 'Denominator for unscopedJobShare. Excludes the recycle bin (FX-A4).'
        unscopedSchedules:
          type: array
          items: { $ref: '#/components/schemas/RbacJobFinding' }
          description: 'Schedules on unscoped jobs. NOT a blocker — RB-Q11(c) leaves these unbound deliberately; this is the number that would pull the deferred per-entry schedule scope forward.'
        pendingUnbound:
          type: array
          items: { $ref: '#/components/schemas/RbacJobFinding' }
          description: 'Parked ad-hoc runs on unscoped jobs with no frozen scope. RB-Q12 fires them with frozen authorization, so they run unbound.'
        pendingRevoked:
          type: array
          items: { $ref: '#/components/schemas/RbacJobFinding' }
          description: 'Parked runs whose creator would lose the trigger verb. RB-Q12 fires them anyway — this is the list an operator sweeps by hand.'
        usersEvaluated:
          type: integer
          description: 'recent_logins rows examined, so an empty findings list can be told apart from a report over no data.'
        grantsEvaluated:
          type: integer
          description: 'access_grants row count — the denominator that replaced mappingsEvaluated/restrictionsEvaluated when the legacy tables were dropped (v0.57.8).'
    RunnerAgencies:
      type: object
      description: One runner's agency-membership set (M2). The matrix is an array of these.
      required: [runnerId, agencyIds]
      properties:
        runnerId: { type: string }
        agencyIds:
          type: array
          items: { type: string }

    RegistrationTokenInfo:
      type: object
      description: |
        A single-use registration token row (Phase 7, D6) — metadata and the
        used-by audit trail only, never plaintext (hash-at-rest; plaintext is
        returned exactly once by mint).
      required: [id, createdBy, createdAt, expiresAt, status]
      properties:
        id: { type: integer, readOnly: true }
        label:
          type: string
          description: Operator-chosen label, e.g. the intended runner name.
        createdBy: { type: string, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        expiresAt: { type: string, format: date-time, readOnly: true }
        revokedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        usedAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: Set atomically by the (single) registration that consumed this token.
        usedByRunnerId: { type: [string, 'null'], readOnly: true }
        usedByRunnerName:
          type: [string, 'null']
          readOnly: true
          description: Resolved at list time; absent if that runner was since deregistered.
        status:
          type: string
          enum: [pending, active, expired, revoked]
          readOnly: true
          description: Derived; active takes precedence (a consumed token stays "active" — that is the audit fact).

    PollResponse:
      type: object
      description: Long-poll response (§6.2/§6.3). Control messages for active runs ride alongside any new assignment.
      properties:
        assignment:
          type: [object, 'null']
          description: New work, or null if only control messages are pending.
          properties:
            traceId: { type: string, format: uuid }
            jobName: { type: string }
            type: { $ref: '#/components/schemas/RunType' }
            scope: { type: string }
            payload:
              type: object
              description: Resolved job definition — script/playbook/module path, target hosts, resolved env (secrets resolved server-side at dispatch, §8.1), timeout, retries.
        control:
          type: array
          description: Server→runner messages for in-flight runs (kill) or the runner itself (drain).
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
                enum: [kill, drain, re-register, keyscan, trust-hosts]
                description: |
                  re-register (added in protocol v4): the agent must re-declare
                  its current local config in place via
                  POST /runners/{runnerId}/redeclare (same id, same API key).
                  keyscan / trust-hosts (added in protocol v5): scan the listed
                  hosts and upload their keys / append the approved known_hosts
                  entries. The per-op protocol gates these once carried went with
                  the server's protocol floor — every registered agent speaks the
                  current protocol.
              traceId:
                type: [string, 'null']
                format: uuid
                description: Target run for kill; null for drain/re-register.
              hosts:
                type: array
                items: { type: string }
                description: Targets to scan (keyscan op, v5).
              entries:
                type: array
                items: { type: string }
                description: Approved known_hosts lines to append (trust-hosts op, v5).
        pollAfterMs:
          type: integer
          description: Suggested delay before the next poll.
        settings:
          type: [object, 'null']
          description: |
            Server-managed operational settings (Phase 4, additive within v4).
            Present only for a settings-capable agent (one whose poll carried a
            settingsVersion query param) and only until it acks the current
            version. The agent applies the values in-memory and echoes version
            back as settingsVersion.
          properties:
            version: { type: integer }
            values: { $ref: '#/components/schemas/ManagedRunnerSettings' }

    ManifestResponse:
      type: object
      description: |
        Execution manifest for a claimed run (R1.1/R1.2, D2). Carries the
        resolved command, env snapshot, and target host references — references
        only, never decrypted key bytes (credential model b, D1).
      required: [traceId, jobName, runType, executor, interp, body, inventoryMode]
      properties:
        traceId: { type: string, format: uuid }
        jobName: { type: string }
        runType: { $ref: '#/components/schemas/RunType' }
        executor: { type: string, enum: [runner, ssh] }
        interp:
          type: array
          items: { type: string }
          description: Interpreter argv (e.g. ["bash","-c"]).
        body:
          type: string
          description: The script/command body to execute under interp.
        env:
          type: object
          additionalProperties: { type: string }
          description: The run's env snapshot (plain config values, not secrets).
        inventoryMode:
          type: string
          enum: [amadeus, local]
          description: |
            Owning runner's inventory canonicality (D8). amadeus — targets is
            fully resolved. local — targets is empty; resolve scope locally.
        scope:
          type: string
          description: The run's scope name; the canonical input in local mode.
        targets:
          type: array
          description: Resolved host references (empty in local mode).
          items: { $ref: '#/components/schemas/ManifestTarget' }
        timeoutSeconds:
          type: integer
          description: Job timeout in seconds (0 ⇒ unset).
        limit:
          type: string
          description: |
            Ansible --limit expression (host/group NAMES only) for a targeted
            run; empty ⇒ no --limit. Secret-free / PATH-A-safe (names only).
        inventory:
          $ref: '#/components/schemas/ManifestInventory'
        sshUser:
          type: string
          description: |
            RP-8 (protocol v7) — the run's frozen "connect as" username, carried
            EXPLICITLY for an ansible run because the agent builds an argv rather
            than dialing the targets itself (an ssh-family run gets the same
            override through targets[].user instead). The agent emits it as
            `-e ansible_user=…`, which beats inventory-authored identity. Absent
            unless the run actually carries an override; never set for terraform.
        sshKeyRef:
          type: string
          description: |
            RP-8 (protocol v7) — the derived CRONOMICON_KEY_<label> REFERENCE for the
            run's overridden SSH key (names only, D1). The agent resolves it to the
            delivered 0600 key file and emits
            `-e ansible_ssh_private_key_file=<path>`. The material itself travels
            only in `keys`; if it did not arrive, the agent fails the run closed
            rather than falling back to the inventory's key.
        envPassthrough:
          type: array
          items: { type: string }
          description: |
            RX.9 (protocol v3) — allowlist of env-var NAMES (never values, D1) the
            agent resolves from its OWN environment into a local-toolchain child
            process. Presence — even empty — flips the agent from legacy full
            inheritance to a scoped child env; absence keeps legacy behavior, so a
            new server stays compatible with an older agent.
        ansibleOptions:
          $ref: '#/components/schemas/ManifestAnsibleOptions'
        checkout:
          $ref: '#/components/schemas/ManifestCheckout'
        secrets:
          type: object
          additionalProperties: { type: string }
          description: |
            P1.4 (protocol v6) — dispatch-time resolved reference VALUES
            (CRONOMICON_SECRET_* / CRONOMICON_VAR_*, plus CRONOMICON_KEY_* mapped to their
            delivered key-file PATHS) for a runner flagged allow_secret_injection.
        keys:
          type: array
          items: { $ref: '#/components/schemas/ManifestKey' }
          description: |
            D8 — delivered SSH-key MATERIAL for the run's key references. The one
            place in the manifest that carries key bytes: the agent writes each to
            a 0600 file off the run tree and wipes it on cleanup, and the values are
            registered for lockstep log redaction before delivery.

    ManifestAnsibleOptions:
      type: object
      description: |
        Per-run advanced ansible options (protocol v8). Absent when the operator
        set none — the overwhelmingly common case, and byte-identical on the wire
        to a pre-v8 manifest. Every field is validated at the trigger boundary, so
        the agent renders argv without re-validating. (The server's protocol
        floor tracks the current version, so every registered agent understands
        this field; there is no per-run back-compat gate.)
      properties:
        check: { type: boolean, description: "--check (dry run)." }
        diff: { type: boolean, description: "--diff." }
        tags:
          type: array
          items: { type: string }
          description: "--tags selection (plain names)."
        skipTags:
          type: array
          items: { type: string }
          description: "--skip-tags exclusion (plain names)."
        verbosity: { type: integer, description: "1–4 ⇒ -v … -vvvv; 0/absent ⇒ normal." }
        become: { type: boolean, description: "--become." }
        becomeUser: { type: string, description: "--become-user." }
        extraVars:
          type: object
          additionalProperties: { type: string }
          description: |
            `-e name=value` pairs. Emitted BEFORE the run's identity extra-vars so
            they can never override them (ansible takes the last occurrence), and
            never a channel for secrets — `-e` values are visible in the runner's
            process table.

    ManifestCheckout:
      type: object
      description: |
        Runner-side pinned-checkout spec (RX.1/RX.2, protocol v3): the agent
        materializes this repo at this exact SHA and runs the entry playbook from
        the resulting tree. No credential ever rides it (D1) — the agent holds its
        own read-only deploy credential and resolves it from ITS config.
      required: [repo, sha, entry]
      properties:
        repo:
          type: string
          description: Repo identity; matched against the agent's -checkout-repos allowlist.
        sha:
          type: string
          description: Full 40-hex commit SHA — never a ref; the agent verifies it exists before archiving.
        entry:
          type: string
          description: Repo-relative playbook path, run with cwd = the materialized tree root.
        requirementsPath:
          type: string
          description: RX.4 — repo-relative requirements.yml the agent installs per run into the ephemeral workdir; empty ⇒ none.
        usesVault:
          type: boolean
          description: |
            RX.13 — derived from the job's `vault` requirement token. When true the
            agent passes --vault-password-file from its OWN config; the password
            never travels (D1). A run requiring vault on a runner with no password
            file configured fails loudly rather than silently unencrypted.

    ManifestKey:
      type: object
      description: |
        One delivered SSH private key (D8). Carries MATERIAL — the sole exception
        to the manifest's references-only rule — and only to a runner flagged
        allow_secret_injection, for references the run's frozen agencies permit.
      required: [name, reference, material]
      properties:
        name:
          type: string
          description: The credential's bare LABEL; the agent keys its resolver on this.
        reference:
          type: string
          description: The derived CRONOMICON_KEY_<label> form, as it appears in env and in sshKeyRef.
        material:
          type: string
          description: |
            PEM private-key bytes. Written 0600 off the run tree, wiped on cleanup,
            and redacted from run output in lockstep with delivery.

    ManifestInventory:
      type: object
      description: |
        Ansible inventory file shipped to an amadeus-mode runner for
        `ansible-playbook -i` (protocol v2, D3). Byte-exact and SECRET-FREE —
        secret-bearing inventory vars are rejected at ingest (Path A, D1); the
        manifest path never carries decrypted secret values. Absent for
        non-ansible runs and for local-mode runners (which hold their own
        inventory; their host list is never shipped).
      required: [raw]
      properties:
        raw:
          type: string
          description: Byte-exact inventory content (the -i material).
        format:
          type: string
          description: ini | yaml — picks the runner temp-file extension.
        groups:
          type: array
          items: { type: string }
          description: Advisory parsed group set (M2+; for --limit validation/UI).

    ManifestTarget:
      type: object
      description: |
        One resolved host reference in a manifest. Reference only — no key
        bytes (D1). authKeyEnvVar names the env var / secret key the agent
        resolves locally to obtain the private key.
      required: [name]
      properties:
        name: { type: string, description: Inventory/host identifier. }
        address: { type: string, description: Dial address (falls back to name). }
        port: { type: integer }
        user: { type: string }
        via: { type: string, description: Bastion id/name; empty ⇒ direct. }
        authKeyEnvVar:
          type: string
          description: NAME of the env var holding the private key (never the key bytes, D1).
        resolveErr:
          type: string
          description: Non-empty when this host could not be resolved (per-host failure, not a silent skip).

    # ── Settings ─────────────────────────────────────────────────────────────
    GeneralSettings:
      allOf:
        - type: object
          properties:
            appName: { type: string }
            timezone:
              type: string
              description: |
                IANA name of the application timezone. This is the source of truth
                the app BOTH schedules cron in AND displays timestamps in; if unset
                or unloadable it falls back to the host TZ (time.Local). Must be a
                valid IANA zone — an invalid value is rejected with 422.
            appTimezone:
              type: string
              readOnly: true
              description: |
                The resolved, validated effective timezone the app actually
                schedules + displays in (timezone if loadable, else the host TZ).
                The SPA formats all absolute timestamps in this zone.
            serverTimezone:
              type: string
              readOnly: true
              description: The host OS timezone (the TZ fallback), surfaced as offset context for the Settings banner. Distinct from the effective appTimezone the app schedules and displays in.
            serverUtcOffsetMinutes:
              type: integer
              readOnly: true
              description: The host's current UTC offset in minutes — offset context for the banner.
            maxConcurrent:
              type: integer
              description: Global concurrent-run cap. Per-job caps are an open S16 decision and not in the v1 contract.
            defaultExecutor:
              type: string
              enum: [ssh, runner]
              default: ssh
              description: |
                Global executor default (R5.1) applied when neither a per-trigger
                override nor a job's spec.executor is set. Lowest-precedence
                explicit input; the run-type capability default still overrides it
                for ansible/terraform (which always need the runner executor).
            jobTimeoutSeconds: { type: integer }
            sessionPolicy:
              type: object
              properties:
                timeoutMinutes:
                  type: integer
                  description: >-
                    FX-E4 — minutes before a session expires; 0 disables. Enforced by auth.readSession
                    on top of the fixed 8-hour cookie ceiling. With reauth=false this is an IDLE cap:
                    the clock runs from the last request and activity slides it. Settable since the
                    field shipped; enforced since v1.0.5.
                reauth:
                  type: boolean
                  description: >-
                    Makes the timeout ABSOLUTE — measured from login, so activity does not extend it
                    and everyone re-authenticates every N minutes. Off, the timeout is the idle cap.

        - $ref: '#/components/schemas/AuditFields'

    GitlabConfig:
      allOf:
        - type: object
          properties:
            pat:
              type: string
              description: Bot PAT. Masked on read; omit on write to keep stored value.
            botName: { type: string }
            botEmail: { type: string }
            writeBranch: { type: string }
            repoUrl: { type: string }
            tokenExpiryNotifyDays: { type: integer }
            webhookEnabled: { type: boolean }
            webhookSecretEnvPinned:
              type: boolean
              readOnly: true
              description: >-
                Read-only. True when the webhook secret is pinned by the
                CRONOMICON_GITLAB_WEBHOOK_SECRET env var; rotation via the API is
                rejected (409) while pinned.
            webhookEvents:
              type: object
              properties:
                push: { type: boolean }
                mr: { type: boolean }
                tag: { type: boolean }
        - $ref: '#/components/schemas/AuditFields'

    VaultConfig:
      allOf:
        - type: object
          properties:
            addr: { type: string }
            authMethod:
              type: string
              enum: [approle, token]
            roleId: { type: string }
            roleIdSet: { type: boolean, readOnly: true }
            secretId:
              type: string
              writeOnly: true
              description: >-
                The credential for the selected authMethod: the AppRole
                secret_id, or the Vault token when authMethod is token. Never
                returned on read; omit to keep the stored value. Changing
                authMethod clears it, so a switch must supply the new credential.
            secretIdSet: { type: boolean, readOnly: true }
            namespace: { type: [string, 'null'] }
            status:
              type: string
              enum: [ok, degraded, unconfigured]
              readOnly: true
        - $ref: '#/components/schemas/AuditFields'

    NotificationConfig:
      allOf:
        - type: object
          properties:
            provider:
              type: string
              enum: [apprise, smtp]
            apprise:
              type: object
              properties:
                enabled: { type: boolean }
                apiUrl: { type: string }
                targets:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: integer, readOnly: true }
                      label: { type: string }
                      service: { type: string }
                      url: { type: string }
                      enabled: { type: boolean }
            smtp:
              type: object
              properties:
                host: { type: string }
                port: { type: integer }
                encryption:
                  type: string
                  enum: [none, starttls, ssl]
                username: { type: string }
                password:
                  type: string
                  writeOnly: true
                passwordSet: { type: boolean, readOnly: true }
                fromAddress: { type: string }
                fromName: { type: string }
                recipients:
                  type: array
                  items: { type: string }
            lastSent:
              type: object
              readOnly: true
              description: >-
                When each transport last delivered, and whether it worked (K-2,
                v0.52.24). An absent entry means the transport has never sent —
                a different fact from a failed send. This replaced the per-
                destination `lastFiredAt`, which was stamped on every enabled
                destination of a matching type and so could only ever mean
                "something sent over this transport".
              properties:
                email: { $ref: '#/components/schemas/TransportSend' }
                apprise: { $ref: '#/components/schemas/TransportSend' }
        - $ref: '#/components/schemas/AuditFields'

    AuditComplianceSettings:
      allOf:
        - type: object
          properties:
            retentionDays:
              type: object
              description: |
                The eleven retention knobs (A4 defaults shown): five row windows
                (`runs`, `activity`, `workflowRuns`, `changeLog`,
                `schedulePushes`), two on-disk file windows (`logFiles`,
                `auditLogFiles`), the two RH windows (`recycleBin`,
                `definitionRevisions`), the DR-7 window
                (`runnerPlacementHistory`), and the S3 archive window
                (`archivedLogFiles`, SL-4). `0` on any of them means keep forever. This blob
                is authoritative — the `CRONOMICON_RETENTION_*` env vars only seed it
                on the first boot that finds it unset (LU-2), and a change here
                applies on the next nightly sweep rather than at the next restart.
              properties:
                runs: { type: integer, default: 90 }
                activity: { type: integer, default: 90 }
                workflowRuns: { type: integer, default: 90 }
                changeLog: { type: integer, default: 365 }
                schedulePushes: { type: integer, default: 365 }
                logFiles: { type: integer, default: 90 }
                recycleBin:
                  type: integer
                  default: 30
                  description: |
                    How long a soft-deleted amadeus-source definition stays
                    restorable before it is permanently purged (RH). `0` keeps
                    forever — note this is the one window whose "forever" costs a
                    NAME rather than disk, since a binned definition still
                    occupies its (source, name) key and blocks a replacement.
                definitionRevisions:
                  type: integer
                  default: 365
                  description: |
                    How long the append-only definition snapshot history is kept.
                    Matches `changeLog` by default: a revision and the change-log
                    row describing it are two halves of one answer.
                runnerPlacementHistory:
                  type: integer
                  default: 30
                  description: |
                    How long a deregistered runner's placement snapshot stays
                    available to be offered back to a re-registered runner (DR-7).
                    Deliberately shorter than the 90-day row windows: it covers a
                    multi-week outage with less standing exposure. The window
                    starts when the runner is REAPED, not when it went offline —
                    so it adds to `CRONOMICON_RUNNER_DEREGISTER_AFTER` (default 14d)
                    rather than competing with it.
                archivedLogFiles:
                  type: integer
                  default: 0
                  description: |
                    How long a run log stays in the S3 archive tier (SL-4). The
                    only knob whose default is keep-forever: the bucket is the
                    disaster-recovery copy. When set, the archive sync deletes
                    expired objects itself and clears the run's archive marker —
                    the bucket policy must grant `s3:DeleteObject`. When `0`,
                    Cronomicon never deletes from the bucket; withhold delete in the
                    policy or use an S3 lifecycle rule. Independent of `logFiles`,
                    which governs LOCAL files and, while the archive backend is
                    on, never reaps a file the sync has not yet copied.
                auditLogFiles:
                  type: integer
                  default: 730
                  description: |
                    On-disk **audit stream** window — `audit.log` and its dated
                    `audit.log.YYYYMMDD` generations (`CRONOMICON_AUDIT_LOG`), not the
                    per-run logs (`logFiles`) and not the process log (a keep count,
                    not a day window). Two years by design: deliberately longer than
                    `changeLog`'s 365 and `activity`'s 90, because the file is an
                    *export* of those tables and its whole purpose is to outlive the
                    rows it exported. Setting it below `changeLog` discards the
                    exported tail while the source rows are still present, which
                    inverts the intent. Has no environment variable — new
                    deployments and upgrades alike start at this default. `0` keeps
                    forever.
        - $ref: '#/components/schemas/AuditFields'

    LogStorageConfig:
      allOf:
        - type: object
          properties:
            backend:
              type: string
              enum: [local, s3]
            local:
              type: object
              properties:
                path: { type: string, default: /var/lib/amadeus/logs }
            s3:
              type: object
              description: >-
                The archive tier's connection (SL-1, the s3-logging plan).
                `backend: s3` means local AND archive: local disk stays the only
                write target during a run, and the scheduled sync copies sealed
                logs to this bucket afterwards. A save with `backend: s3` probes
                the bucket with the credentials it would store and answers 422
                `validation_failed` (the S3 error code in the message) without
                writing the row when the probe fails.
              properties:
                endpoint:
                  type: string
                  description: host[:port]; empty means the AWS regional endpoint for `region`. Any scheme prefix is ignored — `useSsl` decides.
                bucket: { type: string }
                region: { type: string, description: Required when `endpoint` is empty. }
                accessKey:
                  type: string
                  description: Static V4 keys are both-or-neither with `secretKey`; both empty means the ambient AWS credential chain (env / shared file / IAM).
                secretKey: { type: string, writeOnly: true, description: Write-only; an empty value on write keeps the stored one. }
                prefix: { type: string, description: Key prefix; normalised to no leading slash and one trailing slash. }
                useSsl:
                  type: boolean
                  description: Endpoint scheme; true when never set. Omitted on write keeps the stored value.
                caPem:
                  type: string
                  description: >-
                    Optional PEM bundle of CA certificates to trust for a private
                    S3 node signed by an internal CA (MinIO, Ceph). Empty means the
                    process trust store. Stored and returned — a certificate is
                    not a secret — and validated on save to hold at least one
                    certificate. Ignored when `useSsl` is false.
            sync:
              type: object
              description: >-
                The archive timetable. `interval` fires every `intervalSeconds`
                (floor 60, ceiling 86400, clamped not refused; default 900) measured
                from the end of the previous sync; `daily` fires once at `at`
                (HH:MM, UTC). Omitted on write keeps the stored timetable. Sync
                ticks never overlap: a tick that fires while one is running is
                skipped, so no interval is unsafe.
              properties:
                mode:
                  type: string
                  enum: [interval, daily]
                  default: interval
                intervalSeconds: { type: integer, default: 900, minimum: 60, maximum: 86400 }
                at: { type: string, description: HH:MM UTC; required in daily mode. }
            archive:
              type: object
              readOnly: true
              description: >-
                Archive-tier status. Present while `backend` is `s3`, and after a
                switch back to `local` for as long as archived objects remain
                (`count > 0`). `count`/`bytes` are maintained at upload time,
                never by listing the bucket. `pending` is the number of terminal
                runs whose log is not yet archived — the figure that says whether
                the interval keeps up (reported only while `backend` is `s3`).
              properties:
                count: { type: integer }
                bytes: { type: integer }
                pending: { type: integer }
                inProgress: { type: boolean, description: A sync tick is running now. }
                lastSyncStartedAt: { type: [string, 'null'], format: date-time }
                lastSyncFinishedAt: { type: [string, 'null'], format: date-time }
                lastSyncError: { type: [string, 'null'] }
            stats:
              type: object
              readOnly: true
              properties:
                totalSizeBytes: { type: integer }
                fileCount:
                  type: integer
                  description: >-
                    Run logs only — roughly the number of runs on disk. Excludes the
                    process log and its rotated generations, the audit log, and the
                    per-folder `_meta.json` sidecars; see `classes` for those.
                oldestLogAt:
                  type: [string, 'null']
                  format: date-time
                  description: >-
                    Modification time of the oldest run log, for judging whether the
                    retention window is working. The process log and audit log are
                    excluded (both are rewritten continuously).
                classes:
                  type: object
                  description: >-
                    Per-class breakdown of every file under the log directory. The four
                    classes partition the tree, so their sizes sum to `totalSizeBytes`.
                  properties:
                    runLogs:
                      type: object
                      properties:
                        fileCount: { type: integer }
                        totalSizeBytes: { type: integer }
                    processLog:
                      type: object
                      properties:
                        fileCount: { type: integer }
                        totalSizeBytes: { type: integer }
                    auditLog:
                      type: object
                      properties:
                        fileCount: { type: integer }
                        totalSizeBytes: { type: integer }
                    other:
                      type: object
                      properties:
                        fileCount: { type: integer }
                        totalSizeBytes: { type: integer }
        - $ref: '#/components/schemas/AuditFields'

    ObservabilityConfig:
      allOf:
        - type: object
          properties:
            enabled: { type: boolean }
            path: { type: string, default: /metrics }
            authType:
              type: string
              enum: [none, bearer]
            bearerToken:
              type: string
              description: Masked on read; rotates independently (§2.2).
            metrics:
              type: object
              additionalProperties: { type: boolean }
        - $ref: '#/components/schemas/AuditFields'

    # Read is deliberately more tolerant than write (VF-15 / J-1). The narrowed
    # enums below are what the API ACCEPTS; rows created before v0.52.23 can hold
    # values the dispatcher never honoured (targetMode=tag/scope, channels
    # slack/webhook/in-app), and they must still validate on read. So AlertRule
    # overrides those two properties as plain strings rather than inheriting the
    # input enums, which is why no migration was needed to narrow the contract.
    AlertRule:
      allOf:
        - $ref: '#/components/schemas/AlertRuleInput'
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true, description: UUIDv7. }
            jobUid:
              type: [string, 'null']
              readOnly: true
              description: >-
                R2-4 — the permanent identity of the job this rule targets,
                resolved from `jobName` when the rule is written, so existing
                clients get identity targeting without sending anything new.
                Null when the name matched no job, or matched a job in BOTH
                catalogs (alert rules carry no source, and picking one would
                point the rule at the wrong department's job); such a rule keeps
                matching by name, exactly as every rule did before.
            targetMode:
              type: string
              description: >-
                Honoured values are `job` and `all`. Legacy rows may hold `tag`
                or `scope`; both match no run and the rule never fires.
            channels:
              type: array
              description: >-
                Honoured values are `email` (or `smtp`) and `apprise` (or
                `push`). Legacy rows may hold `slack`, `webhook` or `in-app`;
                the dispatcher ignores them and sends nothing for that channel.
              items: { type: string }
        - $ref: '#/components/schemas/AuditFields'

    AlertRuleInput:
      type: object
      required: [targetMode, trigger, channels]
      properties:
        targetMode:
          type: string
          # `tag` was removed in v0.52.23: it was never threaded into RunEvent,
          # so targetMatches rejected it and the rule could not fire (VF-15).
          enum: [job, all]
        jobName: { type: [string, 'null'] }
        trigger:
          type: string
          description: >-
            Matched case-insensitively against the run's terminal status;
            `any` matches every run. `n-failures-window` was removed in
            v0.52.23 — nothing implemented the window.


            `sla-breach` and `missed-run` (SL) are NOT run outcomes: one fires
            mid-run when a job passes its `warnAfterSeconds` or `mustFinishBy`
            deadline, the other when a schedule expected a fire and none
            appeared. `any` deliberately does NOT cover them — an operator with
            an "any run" rule asked about run outcomes, and silently widening it
            would have turned every such rule into a pager the day SL shipped.
          enum: [failure, success, warning, killed, skipped, any, sla-breach, missed-run]
        channels:
          type: array
          items:
            type: string
            # slack/webhook/in-app were removed in v0.52.23: the dispatcher had
            # no branch for any of them. Apprise already fans out to those
            # services and is selectable here for the first time (VF-15).
            enum: [email, apprise]
        recipients: { type: string }
        owner: { type: [string, 'null'] }
        enabled: { type: boolean, default: true }

    NotificationTestReport:
      type: object
      description: Per-transport outcomes from a test send (K-5).
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              transport:
                type: string
                enum: [email, apprise]
              sent: { type: boolean }
              skipped:
                type: boolean
                description: >-
                  True when the transport was not attempted — no SMTP host, no
                  recipients, Apprise switched off, no targets. On a
                  half-configured install this is the answer most of the time,
                  and it is more useful than a bare failure.
              detail:
                type: string
                description: Human-readable outcome, or the reason it was skipped.

    # One transport's most recent dispatch attempt (K-2). Absent rather than
    # zero-valued when the transport has never sent — "never" and "failed" are
    # different facts and the UI says different things about them.
    TransportSend:
      type: object
      readOnly: true
      properties:
        at: { type: string, format: date-time, readOnly: true }
        status:
          type: string
          enum: [ok, error]
          readOnly: true

    # ── SSH ──────────────────────────────────────────────────────────────────
    SshHost:
      allOf:
        - $ref: '#/components/schemas/SshHostInput'
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true, description: UUIDv7. }
            source:
              type: string
              enum: [git, amadeus]
              readOnly: true
              description: >-
                Provenance (M4). git = imported from an inventory by sync (read-only;
                operator edits/deletes are rejected — author an amadeus host to
                override). amadeus = operator-authored. When a hostname has both, the
                amadeus row wins at resolution.
            status:
              type: string
              enum: [verified, reachable, cred_error, conn_error, unverified]
              description: >-
                Connection-test outcome. unverified = never tested; verified =
                last test logged in successfully; reachable = keyless tier —
                the SSH endpoint answered and its host key verified/pinned, but
                no auth key is configured so authentication was not tested;
                cred_error/conn_error = last test failed at auth / network.
                Only a test changes this.
              readOnly: true
            lastCheckedAt: { type: [string, 'null'], format: date-time, readOnly: true }
            hostKeyPinned:
              type: boolean
              readOnly: true
              description: >-
                Whether the host's SSH host key is pinned (FU-1). Empty until the
                first successful connect/test TOFU-captures it; thereafter a
                changed key aborts the connection. Clear it (DELETE .../host-key)
                to re-capture after a legitimate re-key.
            hostKeyFingerprint:
              type: string
              readOnly: true
              description: SHA256 fingerprint of the pinned host key, for out-of-band comparison. Absent when unpinned. Never the raw key line.
            hostKeyType:
              type: string
              readOnly: true
              description: Algorithm of the pinned host key (e.g. ssh-ed25519). Absent when unpinned.
        - $ref: '#/components/schemas/AuditFields'

    SshHostInput:
      type: object
      required: [hostname]
      properties:
        hostname: { type: string }
        address: { type: string }
        port: { type: integer, default: 22 }
        os:
          type: string
          enum: [Linux, Windows]
        via:
          type: [string, 'null']
          description: Bastion name, or null for direct.
        authKeyEnvVar:
          type: string
          description: Name of the ENV_SECRETS key holding the SSH private key (legacy; prefer authCredentialId).
        authCredentialId:
          type: [string, 'null']
          description: First-class SSH key credential id; resolved before authKeyEnvVar.
        user: { type: string }

    SshBastion:
      allOf:
        - $ref: '#/components/schemas/SshBastionInput'
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true, description: UUIDv7. }
            status:
              type: string
              enum: [verified, reachable, cred_error, conn_error, unverified]
              description: Connection-test outcome; see SshHost.status.
              readOnly: true
            lastCheckedAt: { type: [string, 'null'], format: date-time, readOnly: true }
            hostKeyPinned:
              type: boolean
              readOnly: true
              description: Whether the bastion's own SSH host key is pinned (SU-4/FU-1). See SshHost.hostKeyPinned.
            hostKeyFingerprint:
              type: string
              readOnly: true
              description: SHA256 fingerprint of the pinned bastion host key, for out-of-band comparison. Absent when unpinned.
            hostKeyType:
              type: string
              readOnly: true
              description: Algorithm of the pinned bastion host key. Absent when unpinned.
        - $ref: '#/components/schemas/AuditFields'

    SshBastionInput:
      type: object
      required: [name, address]
      properties:
        name: { type: string }
        address: { type: string }
        port: { type: integer, default: 22 }
        username: { type: string }
        authKeyEnvVar: { type: string }
        authCredentialId:
          type: [string, 'null']
          description: First-class SSH key credential id; resolved before authKeyEnvVar.
        zone: { type: string }

    SshTestResult:
      type: object
      description: Outcome of a "Test connection" probe (POST .../test).
      required: [status, checkedAt]
      properties:
        status:
          type: string
          enum: [verified, reachable, cred_error, conn_error]
          description: >-
            verified = login OK; reachable = endpoint answered and host key
            pinned, auth not tested (no key configured — the keyless tier);
            cred_error = auth failed; conn_error = unreachable / host-key fail.
        message:
          type: string
          description: Operator-safe explanation (never key material).
        latencyMs: { type: integer, description: Dial + auth round-trip in milliseconds. }
        checkedAt: { type: string, format: date-time }
        hostKeyFingerprint:
          type: string
          description: >-
            SHA256 fingerprint of the target's (or bastion's) host key as pinned
            after this test (FU-1) — shown so the operator can compare it
            out-of-band. Present on a verified result once a key is pinned.
        hostKeyType:
          type: string
          description: Algorithm of the pinned host key (e.g. ssh-ed25519).

    SshCredentialInput:
      type: object
      required: [label, source]
      properties:
        label: { type: string, description: Operator-facing name for the key. }
        description: { type: [string, 'null'] }
        source:
          type: string
          enum: [stored, vault]
          default: stored
          description: >-
            stored = key material held envelope-encrypted by Cronomicon; vault =
            resolved from Vault at vaultRef (resolution is a later phase).
        material:
          type: string
          writeOnly: true
          description: >-
            The unencrypted PEM/OpenSSH private key. Required when source=stored on
            create; on update, a non-empty value rotates the key. Passphrase-
            protected keys are rejected. Never returned.
        vaultRef:
          type: string
          description: Vault path#field holding the key. Required when source=vault.
        agencyIds:
          type: array
          items: { type: string }
          writeOnly: true
          description: >-
            Agencies to place the new SSH key in, applied at CREATE only (RF-Q2(a),
            the RBAC-fixes plan). A scope-RESTRICTED creator who omits it
            INHERITS their own department (RA-9) when they hold the permission on
            exactly one; holding it on several is 422 `agency_required` naming the
            candidates, because "their department" then has no single answer and
            enrolling the row in all of them would widen it past what they meant.
            This matters because an entity with no membership is shared
            infrastructure and is unrestricted-only for writes and reveal
            (RB-Q14), so a restricted creator would otherwise be locked out of the
            row they just created. Unrestricted creators may omit it, which is the
            deliberate way to mint shared infrastructure. Membership is edited
            afterwards via PUT /ssh-credential-agencies.

    SshCredential:
      allOf:
        - type: object
          required: [id, label, source]
          properties:
            id: { type: string, readOnly: true }
            label: { type: string }
            reference:
              type: string
              readOnly: true
              description: 'Derived CRONOMICON_KEY_<label> reference (namespace contract); resolves to a key-file PATH on the executing host. Read-only; the credential keeps its bare label.'
            description: { type: [string, 'null'] }
            source:
              type: string
              enum: [stored, vault]
              readOnly: true
            keyType:
              type: [string, 'null']
              readOnly: true
              description: Derived on save (e.g. ssh-ed25519, ssh-rsa, ecdsa-sha2-nistp256).
            fingerprint:
              type: [string, 'null']
              readOnly: true
              description: SHA256 fingerprint derived on save.
            publicKey:
              type: [string, 'null']
              readOnly: true
              description: authorized_keys public line derived on save (safe to display/copy).
            vaultRef: { type: [string, 'null'], readOnly: true }
            tags:
              type: array
              description: |
                Operator-authored tags (migration 470). Plaintext metadata stored
                beside the label — never the sealed key material — set via
                PUT /ssh-credential-tags/{credentialId}; [] when none. Writable
                (carries the ConfigureApp permission).
              items: { type: string }
            ownerAgency:
              type: string
              readOnly: true
              description: |
                RA-15 (Phase E) — the NAME of the department that OWNS this SSH key, or ""
                for shared infrastructure. Ownership is what lets two departments hold the
                same label (RA-19; labels carry no scope): uniqueness is (label, owner_agency), and a run resolves its OWN
                department's SSH key before falling back to a shared one (RA-17). A run whose
                departments span MORE THAN ONE owner of a name resolves to nothing at all —
                it fails closed rather than pick one.
            
                Derived from the creating actor's department (the same set RA-9 inherits)
                and set at create; not editable here — transfer is an administrative action
                on the Membership matrix, which also refuses to remove an owner from its own
                row's membership. The column stores the agency id so a rename cannot orphan
                it; this field is the resolved name, for display.
        - $ref: '#/components/schemas/AuditFields'

    SshCredentialRef:
      type: object
      description: A host or bastion referencing a credential.
      properties:
        id: { type: string }
        name: { type: string }

    SshCredentialUsage:
      type: object
      description: Hosts and bastions that reference a credential by id.
      properties:
        hosts:
          type: array
          items: { $ref: '#/components/schemas/SshCredentialRef' }
        bastions:
          type: array
          items: { $ref: '#/components/schemas/SshCredentialRef' }

    # ── Access ───────────────────────────────────────────────────────────────
    RolePermissions:
      type: object
      description: |
        The fixed permission set a role carries. SIX permissions as of v0.56.1:
        `viewDashboard` and `editSchedules` were removed (RB-Q9/RB-Q13) because
        neither had an enforcement point anywhere and neither could get one —
        `viewDashboard` gates nothing a session does not already reach, and the
        only schedule-authoring surface is admin-gated by a separate mechanism
        that must stay that way. A permission that cannot be enforced must not be
        displayed as though it were.

        `triggerJobs` and `killJobs` are still enforced NOWHERE (FR-M1) — they are
        computed and reported but not checked on the run path. Do not treat them
        as access controls until the release that wires them.
      properties:
        triggerJobs: { type: boolean }
        killJobs: { type: boolean }
        manageEnvVars: { type: boolean }
        publishSchedule: { type: boolean }
        configureApp: { type: boolean }
        manageRoles: { type: boolean }
        compose:
          type: boolean
          description: >-
            AF-2 — authoring amadeus-source JOBS and WORKFLOWS. Agency-bound: the
            holder may author within the scopes their grant reaches, never
            everywhere. An All-scoped (unscoped) job stays admin-only, which is
            what keeps a scheduled fire of an unbound job unreachable to a
            departmental composer (RB-30). The other surfaces the old admin gate
            covered — schedule-defs, calendars, reactions, the recycle bin — act
            on objects with no scope and remain admin-only.

    Role:
      allOf:
        - $ref: '#/components/schemas/RoleInput'
        - type: object
          properties:
            builtin:
              type: boolean
              readOnly: true
              description: >-
                Built-in roles ship with the product, cannot be deleted, and cannot
                have this flag cleared. Their permissions ARE editable, subject to
                the admin/manageRoles lockout floors.

    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          description: >-
            Canonicalized to lowercase on write, so 'Tax-Operator' and
            'tax-operator' are the same role. Free-form since v0.56.1 — the frozen
            [Admin, Approver, Operator, Viewer] enum was removed when roles became
            data (RB-6/RB-9).
          examples: ['tax-operator']
        description:
          type: string
          examples: ['Runs and stops jobs within the scopes granted to the role.']
        rank:
          type: integer
          description: >-
            Precedence for display tie-breaks (higher wins); replaces the old
            hardcoded admin>operator>viewer map. Built-ins are 3/2/2/1. NOT an
            authorization input — nothing compares ranks to decide access.
          examples: [2]
        permissions: { $ref: '#/components/schemas/RolePermissions' }

    AccessGrantInput:
      type: object
      required: [adGroup, role]
      description: >-
        A grant's "where" is EXACTLY ONE of an agency or allScopes. There is no
        single-scope shape (RB-Q1): the agency list is the department taxonomy, so
        a narrow need gets a deliberate narrow agency, which is self-documenting in
        a way a loose per-scope grant is not.
      properties:
        adGroup:
          type: string
          description: >-
            Matched EXACTLY at login — the column is plain TEXT with no
            case-insensitive collation and the claim is trimmed but not folded, so
            a mapping stored in a different case grants nothing.
          examples: ['SG-Cronomicon-Tax']
        role:
          type: string
          description: Any defined role name (see GET /roles).
          examples: ['operator']
        agencyId:
          type: string
          format: uuid
          description: >-
            The agency this grant applies to. Expanded to that agency's scopes at
            LOGIN, so a scope added to the agency later is covered with no grant
            edit — but only for sessions established after the change, which is why
            agency-membership writes bump the session epoch.
        allScopes:
          type: boolean
          description: The '*' sentinel — unrestricted. Mutually exclusive with agencyId.

    AccessGrant:
      allOf:
        - $ref: '#/components/schemas/AccessGrantInput'
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true, description: UUIDv7. }
            agencyName:
              type: string
              readOnly: true
              description: Denormalized for display so a grants table needs no second fetch.
        - $ref: '#/components/schemas/AuditFields'

    RecentLogin:
      type: object
      readOnly: true
      description: Honest View (A3.2) — populated only by successful OIDC logins.
      properties:
        email: { type: string }
        name: { type: string }
        adGroups:
          type: array
          items: { type: string }
        grants:
          type: array
          description: >-
            What this person may do, and where — one entry per resolved access
            grant, ordered by role then agency. Replaced the single `resolvedRole`
            string in v0.57.8 (RB-21/RB-Q6): under multi-grant one role name was
            not merely incomplete but false, reading as "Alice can operate" when
            the truth was "Alice can operate Finance and can only view Tax". An
            empty array means the user's groups match no grant and they hold
            nothing — the fail-closed default, not an error.
          items: { $ref: '#/components/schemas/RecentLoginGrant' }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }

    RecentLoginGrant:
      type: object
      readOnly: true
      description: One (role, where) pair as the Honest View renders it.
      properties:
        role: { type: string }
        agencyName:
          type: string
          description: >-
            The department the grant applies to. Absent exactly when allScopes is
            true. Falls back to the raw agency id if the agency was deleted out
            from under the grant — an unresolvable grant is worth seeing, and a
            blank "where" would be indistinguishable from unrestricted.
        allScopes:
          type: boolean
          description: >-
            True for an unrestricted grant. A flag rather than a sentinel name so
            the UI can style it distinctly — these are the rows worth auditing
            first, and a magic string would sort in among real department names.

    CurrentUser:
      type: object
      readOnly: true
      properties:
        email: { type: string }
        name: { type: string }
        groups:
          type: array
          items: { type: string }
        role: { type: string }
        allowedScopes:
          type: array
          description: Effective set via resolveAllowedScopes (A5).
          items: { type: string }
        sessionExpiresAt: { type: string, format: date-time }
        iat: { type: string, format: date-time, readOnly: true, description: When this session was established. }
        seen:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: >-
            FX-E4 — the sliding activity stamp behind the sessionPolicy idle cap. Absent on a
            session established before the cap shipped. The raw Identity serializes onto /me, so
            the field is declared here rather than left as undocumented drift — the exact class
            this band exists to close.

    # ── Git / Health ─────────────────────────────────────────────────────────
    GitSyncEvent:
      type: object
      readOnly: true
      properties:
        id: { type: integer }
        timestamp: { type: string, format: date-time }
        action:
          type: string
          enum: [Pulled, Pushed]
        status:
          type: string
          enum: [success, warning, failure]
        commit: { type: [string, 'null'] }
        author: { type: string }
        message: { type: string }
        files: { type: string }
        changes: { type: string }
        details: { type: string }

    ReadyzReport:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, fail]
        checks:
          type: object
          description: Per-subcheck flags (§11.5).
          properties:
            oidcMetadata:
              type: string
              enum: [ok, degraded, fail]
            vault:
              type: string
              enum: [ok, degraded, fail]
              description: Only evaluated if Vault is configured.
            gitClone:
              type: string
              enum: [ok, degraded, fail]
              description: degraded = serving a stale clone (§11.4).
            migrations:
              type: string
              enum: [ok, fail]
